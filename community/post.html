<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>Community Post — MoonLat</title>
<meta name="description" content="A public MoonLat Community post.">
<link rel="canonical" id="canonicalUrl" href="https://moonlat.top/community/post.html">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/index.min.css">
<style>
:root{--navy:#0b1020;--terracotta:#d86f55;--bg:#f3f5f9;--text:#111827;--muted:#64748b;--line:#e5e9f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--navy);color:#fff;padding:18px 18px}header a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:0 auto;padding:20px 14px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 36px rgba(15,23,42,.06)}.body{padding:20px}.meta{font-size:12px;color:var(--muted);margin-top:6px}.type{display:inline-block;margin-bottom:10px;padding:6px 9px;border-radius:999px;background:#fff5f1;color:#bd5c45;font-size:10px;font-weight:800;text-transform:uppercase}.title{font-size:30px;line-height:1.2;margin:0 0 10px}.content{font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.hashtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.hashtags a{padding:6px 9px;border-radius:999px;background:#fff5f1;border:1px solid #fde5de;color:#bd5c45;text-decoration:none;font-size:11px;font-weight:800}.media{margin-top:18px}.media img,.media video{display:block;width:100%;max-height:720px;object-fit:contain;background:#0b1020;border-radius:14px}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.media-grid img{height:280px;object-fit:cover}.state{text-align:center;padding:50px 20px;color:var(--muted)}.back{display:inline-flex;margin-top:18px;color:var(--terracotta);font-weight:800;text-decoration:none}@media(max-width:600px){.title{font-size:24px}.body{padding:16px}}
</style>
</head>
<body>
<header><a href="index.html">MoonLat Community</a></header>
<main class="wrap"><article id="post" class="card"><div class="state">Loading community post...</div></article><a class="back" href="index.html">Back to Community</a></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",authDomain:"moonlat-estate-dashboard.firebaseapp.com",projectId:"moonlat-estate-dashboard",storageBucket:"moonlat-estate-dashboard.firebasestorage.app",messagingSenderId:"289878951289",appId:"1:289878951289:web:18db63e3ab8f071b811ba8"};
const db=getFirestore(initializeApp(firebaseConfig));const $=id=>document.getElementById(id);
function esc(v=""){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function cleanTag(v=""){return String(v).replace(/^#+/,"").toLowerCase().replace(/[^a-z0-9_]/g,"")}
function iso(ts){if(!ts)return new Date().toISOString();const d=typeof ts.toDate==="function"?ts.toDate():new Date(ts);return Number.isNaN(d.getTime())?new Date().toISOString():d.toISOString()}
function label(t){return({discussion:"Discussion",question:"Question",property:"Property",photo:"Local Photo",market:"Market",investment:"Investment",advice:"Advice"}[t]||"Community")}
function jsonLd(p,url){const media=Array.isArray(p.images)?p.images.filter(x=>x?.url):[];const video=media.find(x=>String(x.format||"").toLowerCase().includes("mp4")||String(x.format||"").toLowerCase().includes("video"));const image=media.find(x=>!String(x.format||"").toLowerCase().includes("video"));const data={"@context":"https://schema.org","@type":"DiscussionForumPosting","mainEntityOfPage":url,"headline":p.title||undefined,"text":p.content||undefined,"datePublished":iso(p.createdAt),"dateModified":iso(p.updatedAt||p.createdAt),"author":{"@type":"Person","name":p.authorName||"MoonLat Community member"},"interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":Number(p.likeCount)||0},{"@type":"InteractionCounter","interactionType":"https://schema.org/CommentAction","userInteractionCount":Number(p.commentCount)||0},{"@type":"InteractionCounter","interactionType":"https://schema.org/ShareAction","userInteractionCount":Number(p.shareCount)||0}]};if(image)data.image=image.url;if(video)data.video={"@type":"VideoObject",contentUrl:video.url,thumbnailUrl:image?.url||undefined};Object.keys(data).forEach(k=>data[k]===undefined&&delete data[k]);return data}
async function run(){const id=new URLSearchParams(location.search).get("id");if(!id){$("post").innerHTML='<div class="state">This community post could not be found.</div>';return}try{const snap=await getDoc(doc(db,"communityPosts",id));if(!snap.exists()){document.title="Post Not Found — MoonLat";$("post").innerHTML='<div class="state">This community post is no longer available.</div>';return}const p={id:snap.id,...snap.data()},url=`${location.origin}${location.pathname}?id=${encodeURIComponent(id)}`;const tags=Array.isArray(p.hashtags)?[...new Set(p.hashtags.map(cleanTag).filter(Boolean))]:[];const media=Array.isArray(p.images)?p.images.filter(x=>x?.url):[];const images=media.filter(x=>!String(x.format||"").toLowerCase().includes("video"));const videos=media.filter(x=>String(x.format||"").toLowerCase().includes("video")||["mp4","webm","mov","m4v","ogv","avi"].includes(String(x.format||"").toLowerCase()));const title=p.title||`${label(p.type)} on MoonLat Community`;const desc=(p.content||`A ${label(p.type).toLowerCase()} shared by ${p.authorName||"a MoonLat community member"}.`).slice(0,155);document.title=`${title} — MoonLat Community`;document.querySelector('meta[name="description"]').setAttribute("content",desc);$("canonicalUrl").href=url;const og=[['property','og:title',title],['property','og:description',desc],['property','og:url',url],['property','og:type','article']];if(images[0]?.url)og.push(['property','og:image',images[0].url]);og.forEach(([a,b,c])=>{const m=document.createElement("meta");m.setAttribute(a,b);m.setAttribute("content",c);document.head.appendChild(m)});const ld=document.createElement("script");ld.type="application/ld+json";ld.textContent=JSON.stringify(jsonLd(p,url));document.head.appendChild(ld);$("post").innerHTML=`<div class="body"><div class="type">${esc(label(p.type))}</div>${p.title?`<h1 class="title">${esc(p.title)}</h1>`:""}<div class="meta">${esc(p.authorName||"MoonLat Community member")} · ${new Date(iso(p.createdAt)).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}</div>${p.content?`<div class="content" style="margin-top:18px">${esc(p.content)}</div>`:""}${tags.length?`<div class="hashtags">${tags.map(t=>`<a href="hashtag.html?tag=${encodeURIComponent(t)}" rel="tag">#${esc(t)}</a>`).join("")}</div>`:""}${images.length?`<div class="media ${images.length>1?'media-grid':''}">${images.map(x=>`<img src="${esc(x.url)}" alt="${esc(x.filename||p.title||"MoonLat community image")}" loading="eager">`).join("")}</div>`:""}${videos.length?`<div class="media">${videos.map(x=>`<video src="${esc(x.url)}" controls playsinline preload="metadata"></video>`).join("")}</div>`:""}</div>`}catch(e){console.error(e);$("post").innerHTML='<div class="state">This community post could not be loaded.</div>'}}
run();
</script>
</body>
</html>
