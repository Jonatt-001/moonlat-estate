<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Members — Moonlat Community</title>

<style>
*,*::before,*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --navy:#0F172A;
  --navy-2:#151E31;
  --navy-3:#1E293B;
  --gold:#D4AF37;
  --gold-light:#F4E8C1;
  --terracotta:#E07A5F;
  --terracotta-light:#F5EBE0;

  --bg:#F5F7FA;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;

  --text:#172033;
  --text-2:#64748B;
  --text-3:#94A3B8;

  --border:#E2E8F0;

  --success:#10B981;
  --danger:#EF4444;
  --blue:#3B82F6;
  --purple:#8B5CF6;

  --shadow:0 12px 40px rgba(15,23,42,.07);

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  max-width:100%;
}

svg{
  display:block;
}

.hidden{
  display:none!important;
}

/* ============================================================
   TOP BAR
============================================================ */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:68px;
  background:rgba(15,23,42,.97);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.topbar-inner{
  width:min(1180px,100%);
  height:100%;
  margin:auto;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.top-button{
  width:42px;
  height:42px;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s ease;
}

.top-button:active{
  transform:scale(.95);
}

.top-button svg{
  width:21px;
  height:21px;
}

.page-title{
  text-align:center;
}

.page-title strong{
  display:block;
  color:#fff;
  font-size:17px;
  font-weight:800;
  letter-spacing:-.2px;
}

.page-title span{
  display:block;
  margin-top:2px;
  color:rgba(255,255,255,.45);
  font-size:10px;
}

/* ============================================================
   PAGE
============================================================ */

.page{
  width:min(1120px,100%);
  margin:auto;
  padding:16px 14px 35px;
}

/* ============================================================
   DISCOVERY HERO
============================================================ */

.discovery{
  position:relative;
  overflow:hidden;
  border-radius:23px;
  background:
    radial-gradient(
      circle at 86% 15%,
      rgba(212,175,55,.2),
      transparent 33%
    ),
    radial-gradient(
      circle at 12% 110%,
      rgba(224,122,95,.16),
      transparent 38%
    ),
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy-3)
    );
  padding:25px 18px 22px;
  color:#fff;
  box-shadow:0 15px 45px rgba(15,23,42,.14);
}

.discovery::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-80px;
  bottom:-120px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  box-shadow:
    0 0 0 35px rgba(255,255,255,.02),
    0 0 0 70px rgba(255,255,255,.015);
  pointer-events:none;
}

.discovery-content{
  position:relative;
  z-index:1;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--gold);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}

.eyebrow-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 4px rgba(212,175,55,.12);
}

.discovery h1{
  font-size:27px;
  line-height:1.15;
  letter-spacing:-.8px;
  font-weight:850;
}

.discovery-copy{
  margin-top:8px;
  max-width:620px;
  color:rgba(255,255,255,.62);
  font-size:12px;
  line-height:1.6;
}

/* ============================================================
   SEARCH
============================================================ */

.search-wrap{
  margin-top:18px;
  position:relative;
  max-width:720px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:rgba(255,255,255,.5);
  pointer-events:none;
}

.member-search{
  width:100%;
  height:49px;
  padding:0 76px 0 43px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  background:rgba(255,255,255,.09);
  color:#fff;
  font-size:12px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:.2s ease;
}

.member-search::placeholder{
  color:rgba(255,255,255,.42);
}

.member-search:focus{
  border-color:rgba(212,175,55,.7);
  background:rgba(255,255,255,.12);
  box-shadow:0 0 0 4px rgba(212,175,55,.08);
}

.clear-search{
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  width:33px;
  height:33px;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.clear-search.show{
  display:flex;
}

.clear-search svg{
  width:15px;
  height:15px;
}

/* ============================================================
   LIVE STATS
============================================================ */

.discovery-stats{
  display:flex;
  gap:25px;
  margin-top:17px;
}

.discovery-stat{
  display:flex;
  flex-direction:column;
}

.discovery-stat strong{
  color:#fff;
  font-size:18px;
  font-weight:800;
}

.discovery-stat span{
  color:rgba(255,255,255,.43);
  font-size:9px;
  margin-top:1px;
}

/* ============================================================
   FILTER BAR
============================================================ */

.filter-section{
  margin-top:13px;
}

.filter-bar{
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:2px;
}

.filter-bar::-webkit-scrollbar{
  display:none;
}

.filter{
  min-height:37px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-2);
  white-space:nowrap;
  font-size:10px;
  font-weight:750;
  transition:.2s ease;
}

.filter.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}

.filter:hover{
  border-color:var(--navy);
}

.filter-separator{
  width:1px;
  height:23px;
  background:var(--border);
  flex-shrink:0;
  margin:0 3px;
}

.sort-button{
  min-height:37px;
  padding:0 11px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-2);
  display:flex;
  align-items:center;
  gap:6px;
  font-size:10px;
  font-weight:750;
  flex-shrink:0;
}

.sort-button svg{
  width:14px;
  height:14px;
}

/* ============================================================
   RESULTS HEADER
============================================================ */

.results-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:17px 2px 11px;
}

.results-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:-.2px;
}

.results-meta{
  color:var(--text-3);
  font-size:10px;
}

.results-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.view-button{
  width:33px;
  height:33px;
  border-radius:9px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-3);
  display:flex;
  align-items:center;
  justify-content:center;
}

.view-button.active{
  color:var(--navy);
  border-color:var(--navy);
  background:#fff;
}

.view-button svg{
  width:15px;
  height:15px;
}

/* ============================================================
   MEMBER GRID
============================================================ */

.members-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

@media(min-width:540px){
  .members-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(min-width:880px){
  .members-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(min-width:1120px){
  .members-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

/* ============================================================
   MEMBER CARD
============================================================ */

.member-card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.member-card:hover{
  transform:translateY(-3px);
  border-color:#D5DDE8;
  box-shadow:var(--shadow);
}

.member-card-main{
  display:block;
}

.member-cover{
  height:83px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(212,175,55,.18),
      transparent 40%
    ),
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy-3)
    );
}

.member-cover-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

.member-cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(15,23,42,.25)
  );
}

.member-avatar-wrap{
  position:absolute;
  z-index:2;
  left:15px;
  top:47px;
}

.member-avatar{
  width:68px;
  height:68px;
  border-radius:18px;
  background:var(--navy-3);
  border:4px solid #fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:17px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(15,23,42,.15);
}

.member-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.member-status{
  position:absolute;
  right:-1px;
  bottom:0;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#CBD5E1;
  border:3px solid #fff;
}

.member-status.online{
  background:var(--success);
}

.member-content{
  padding:42px 14px 13px;
}

.member-topline{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.member-name-area{
  min-width:0;
}

.member-name{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
}

.member-name strong{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  font-weight:800;
}

.verified{
  width:15px;
  height:15px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.verified svg{
  width:9px;
  height:9px;
}

.member-username{
  margin-top:2px;
  color:var(--text-3);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.role-badge{
  flex-shrink:0;
  padding:4px 7px;
  border-radius:6px;
  background:var(--gold-light);
  color:#856512;
  font-size:8px;
  line-height:1;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.25px;
}

.role-badge.client{
  background:#EEF2F7;
  color:#64748B;
}

.role-badge.agent{
  background:var(--gold-light);
  color:#856512;
}

.role-badge.investor{
  background:#EDE9FE;
  color:#6D28D9;
}

.role-badge.broker{
  background:#DBEAFE;
  color:#1D4ED8;
}

.member-bio{
  color:var(--text-2);
  font-size:10px;
  line-height:1.55;
  margin-top:10px;
  min-height:31px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.member-location{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:9px;
  color:var(--text-3);
  font-size:9px;
  min-width:0;
}

.member-location svg{
  width:12px;
  height:12px;
  flex-shrink:0;
}

.member-location span{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member-footer{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:7px;
}

.member-action{
  height:34px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:9px;
  font-weight:800;
  transition:.18s ease;
}

.member-action svg{
  width:13px;
  height:13px;
}

.follow-button{
  flex:1;
  background:var(--navy);
  color:#fff;
}

.follow-button.following{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
}

.message-button{
  width:35px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-2);
}

.member-action:active{
  transform:scale(.96);
}

.member-menu{
  position:absolute;
  top:95px;
  right:12px;
  width:31px;
  height:31px;
  border-radius:9px;
  background:rgba(255,255,255,.92);
  color:var(--text-2);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
  border:1px solid rgba(226,232,240,.8);
  backdrop-filter:blur(8px);
}

.member-menu svg{
  width:15px;
  height:15px;
}

/* ============================================================
   LIST VIEW
============================================================ */

.members-grid.list-view{
  grid-template-columns:1fr;
}

.members-grid.list-view .member-card{
  display:flex;
  min-height:120px;
}

.members-grid.list-view .member-cover{
  width:105px;
  height:auto;
  flex-shrink:0;
}

.members-grid.list-view .member-cover-image{
  position:absolute;
  inset:0;
}

.members-grid.list-view .member-avatar-wrap{
  left:20px;
  top:27px;
}

.members-grid.list-view .member-content{
  flex:1;
  padding:14px 14px 13px 25px;
  min-width:0;
}

.members-grid.list-view .member-bio{
  min-height:auto;
}

.members-grid.list-view .member-location{
  margin-top:6px;
}

.members-grid.list-view .member-footer{
  margin-top:8px;
  padding-top:8px;
}

/* ============================================================
   SKELETON
============================================================ */

.skeleton{
  background:
    linear-gradient(
      90deg,
      #EDF1F6 25%,
      #F8FAFC 37%,
      #EDF1F6 63%
    );
  background-size:400% 100%;
  animation:shimmer 1.35s infinite;
}

.member-skeleton{
  height:280px;
  border-radius:18px;
}

@keyframes shimmer{
  0%{
    background-position:100% 0;
  }

  100%{
    background-position:-100% 0;
  }
}

/* ============================================================
   EMPTY STATE
============================================================ */

.empty{
  min-height:310px;
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 22px;
  grid-column:1/-1;
}

.empty-icon{
  width:60px;
  height:60px;
  border-radius:19px;
  background:var(--navy);
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:13px;
}

.empty-icon svg{
  width:27px;
  height:27px;
}

.empty-title{
  font-size:16px;
  font-weight:850;
}

.empty-copy{
  max-width:340px;
  margin-top:6px;
  color:var(--text-2);
  font-size:11px;
  line-height:1.6;
}

.empty-button{
  margin-top:15px;
  min-height:38px;
  padding:0 14px;
  border-radius:10px;
  background:var(--navy);
  color:#fff;
  font-size:10px;
  font-weight:800;
}

/* ============================================================
   LOAD MORE
============================================================ */

.load-more-wrap{
  display:flex;
  justify-content:center;
  margin-top:16px;
}

.load-more{
  min-height:39px;
  padding:0 17px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  font-size:10px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:7px;
}

.load-more svg{
  width:14px;
  height:14px;
}

.load-more:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* ============================================================
   DRAWER / MEMBER QUICK VIEW
============================================================ */

.drawer-backdrop{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  background:rgba(2,6,23,.62);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.drawer-backdrop.open{
  display:block;
}

.member-drawer{
  position:absolute;
  top:0;
  right:0;
  width:min(440px,94%);
  height:100%;
  background:var(--surface);
  overflow-y:auto;
  box-shadow:-20px 0 60px rgba(0,0,0,.18);
  transform:translateX(100%);
  transition:transform .25s ease;
}

.drawer-backdrop.open .member-drawer{
  transform:translateX(0);
}

.drawer-header{
  position:sticky;
  top:0;
  z-index:3;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.drawer-title{
  font-size:13px;
  font-weight:800;
}

.drawer-close{
  width:35px;
  height:35px;
  border-radius:10px;
  background:var(--surface-2);
  color:var(--text-2);
  display:flex;
  align-items:center;
  justify-content:center;
}

.drawer-close svg{
  width:16px;
  height:16px;
}

.drawer-body{
  padding:18px;
}

.quick-cover{
  height:125px;
  border-radius:16px;
  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(212,175,55,.18),
      transparent 40%
    ),
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy-3)
    );
  overflow:hidden;
}

.quick-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.quick-identity{
  margin-top:-34px;
  position:relative;
  padding:0 14px;
}

.quick-avatar{
  width:78px;
  height:78px;
  border-radius:20px;
  overflow:hidden;
  background:var(--navy-3);
  border:4px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
  font-weight:800;
  box-shadow:0 8px 20px rgba(15,23,42,.16);
}

.quick-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.quick-name{
  margin-top:12px;
  font-size:21px;
  font-weight:850;
  letter-spacing:-.5px;
}

.quick-username{
  margin-top:2px;
  color:var(--text-3);
  font-size:10px;
}

.quick-bio{
  margin-top:12px;
  color:var(--text-2);
  font-size:11px;
  line-height:1.65;
}

.quick-meta{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.quick-meta-item{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--text-2);
  font-size:10px;
}

.quick-meta-item svg{
  width:15px;
  height:15px;
  color:var(--text-3);
}

.quick-actions{

<script type="module">

/* ============================================================
   MOONLAT MEMBERS
   ------------------------------------------------------------
   Real data sources:

   users/{uid}
   users/{uid}/following/{targetUid}
   users/{uid}/followers/{followerUid}

   Optional fields:

   displayName
   username
   photoURL
   coverURL
   role
   bio
   location
   verified
   followersCount
   followingCount
   lastActiveAt
   createdAt
============================================================ */

import {
  initializeApp,
  getApps,
  getApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  query,
  where,
  orderBy,
  limit,
  startAfter,
  endAt,
  startAt,
  getCountFromServer,
  setDoc,
  deleteDoc,
  serverTimestamp,
  increment,
  writeBatch
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* ============================================================
   CONFIGURATION
============================================================ */

const PAGE_SIZE = 24;

const ROLE_LABELS = {
  all:"All members",
  agent:"Agents",
  client:"Clients",
  investor:"Investors",
  broker:"Brokers"
};

/* ============================================================
   STATE
============================================================ */

let app = null;
let auth = null;
let db = null;

let currentUser = null;

let members = [];
let filteredMembers = [];

let currentRole = "all";
let currentSort = "recent";

let lastDocument = null;
let hasMore = false;

let loadingMembers = false;

let searchTimer = null;

let followingIds = new Set();

let activeDrawerMember = null;

/* ============================================================
   DOM
============================================================ */

const memberSearch =
  document.getElementById("memberSearch");

const clearSearch =
  document.getElementById("clearSearch");

const membersGrid =
  document.getElementById("membersGrid");

const resultsMeta =
  document.getElementById("resultsMeta");

const loadMoreWrap =
  document.getElementById("loadMoreWrap");

const loadMoreButton =
  document.getElementById("loadMoreButton");

const memberCount =
  document.getElementById("memberCount");

const agentCount =
  document.getElementById("agentCount");

const investorCount =
  document.getElementById("investorCount");

const drawerBackdrop =
  document.getElementById("memberDrawerBackdrop");

const drawerBody =
  document.getElementById("drawerBody");

/* ============================================================
   FIREBASE INITIALIZATION
============================================================ */

async function initializeFirebase(){

  try{

    const configModule =
      await import("./firebase-config.js");

    const firebaseConfig =
      configModule.firebaseConfig ||
      configModule.default;

    if(!firebaseConfig){
      throw new Error(
        "Firebase configuration was not found."
      );
    }

    app =
      getApps().length
        ? getApp()
        : initializeApp(firebaseConfig);

    auth =
      getAuth(app);

    db =
      getFirestore(app);

    initializeAuth();

  }catch(error){

    console.error(
      "Firebase initialization failed:",
      error
    );

    showFatalError(
      "Moonlat could not connect to the member directory."
    );
  }
}

/* ============================================================
   AUTH
============================================================ */

function initializeAuth(){

  onAuthStateChanged(
    auth,
    async user => {

      if(!user){

        window.location.href =
          "sign-in.html";

        return;
      }

      currentUser =
        user;

      await Promise.all([
        loadFollowing(),
        loadDirectoryStats()
      ]);

      await loadMembers(true);
    }
  );
}

/* ============================================================
   DIRECTORY STATS
============================================================ */

async function loadDirectoryStats(){

  try{

    const usersRef =
      collection(
        db,
        "users"
      );

    const totalQuery =
      query(
        usersRef,
        limit(1)
      );

    const totalSnapshot =
      await getCountFromServer(
        totalQuery
      );

    memberCount.textContent =
      formatCount(
        totalSnapshot.data().count
      );

  }catch(error){

    console.warn(
      "Total member count unavailable:",
      error
    );

    memberCount.textContent =
      "—";
  }

  try{

    const agentQuery =
      query(
        collection(db,"users"),
        where("role","==","agent")
      );

    const snapshot =
      await getCountFromServer(
        agentQuery
      );

    agentCount.textContent =
      formatCount(
        snapshot.data().count
      );

  }catch(error){

    console.warn(
      "Agent count unavailable:",
      error
    );

    agentCount.textContent =
      "—";
  }

  try{

    const investorQuery =
      query(
        collection(db,"users"),
        where("role","==","investor")
      );

    const snapshot =
      await getCountFromServer(
        investorQuery
      );

    investorCount.textContent =
      formatCount(
        snapshot.data().count
      );

  }catch(error){

    console.warn(
      "Investor count unavailable:",
      error
    );

    investorCount.textContent =
      "—";
  }
}

/* ============================================================
   FOLLOWING
============================================================ */

async function loadFollowing(){

  if(!currentUser){
    return;
  }

  try{

    const followingRef =
      collection(
        db,
        "users",
        currentUser.uid,
        "following"
      );

    const snapshot =
      await getDocs(
        followingRef
      );

    followingIds =
      new Set(
        snapshot.docs.map(
          item => item.id
        )
      );

  }catch(error){

    console.warn(
      "Following list could not be loaded:",
      error
    );

    followingIds =
      new Set();
  }
}

/* ============================================================
   LOAD MEMBERS
============================================================ */

async function loadMembers(reset = false){

  if(
    loadingMembers ||
    (
      !reset &&
      !hasMore
    )
  ){
    return;
  }

  loadingMembers = true;

  if(reset){

    lastDocument = null;
    hasMore = true;
    members = [];

    renderLoading();
  }

  try{

    const usersRef =
      collection(
        db,
        "users"
      );

    const constraints = [];

    /*
      Role filtering is done server-side.
      This keeps the returned result set small.
    */

    if(currentRole !== "all"){

      constraints.push(
        where(
          "role",
          "==",
          currentRole
        )
      );
    }

    /*
      Recent sorting uses createdAt.
      A fallback query below handles projects
      that do not yet have this field/index.
    */

    if(currentSort === "recent"){

      constraints.push(
        orderBy(
          "createdAt",
          "desc"
        )
      );

    }else{

      constraints.push(
        orderBy(
          "displayName",
          "asc"
        )
      );
    }

    constraints.push(
      limit(PAGE_SIZE)
    );

    if(lastDocument){

      constraints.push(
        startAfter(
          lastDocument
        )
      );
    }

    const membersQuery =
      query(
        usersRef,
        ...constraints
      );

    const snapshot =
      await getDocs(
        membersQuery
      );

    if(snapshot.empty){

      if(reset){

        members = [];
      }

      hasMore = false;

    }else{

      const newMembers =
        snapshot.docs
          .map(item => ({
            id:item.id,
            ...item.data()
          }))
          .filter(
            member =>
              member.id !==
              currentUser.uid
          );

      members =
        reset
          ? newMembers
          : [
              ...members,
              ...newMembers
            ];

      lastDocument =
        snapshot.docs[
          snapshot.docs.length - 1
        ];

      hasMore =
        snapshot.docs.length ===
        PAGE_SIZE;
    }

    applyLocalSearch();
    renderMembers();

  }catch(error){

    console.error(
      "Member query failed:",
      error
    );

    if(
      String(error.message || "")
        .toLowerCase()
        .includes("index")
    ){

      showToast(
        "Firestore needs an index for this member query.",
        "error"
      );

    }else{

      showToast(
        "Members could not be loaded. Please try again.",
        "error"
      );
    }

    if(reset){

      members = [];
      renderEmpty(
        "Unable to load members",
        "The member directory could not be reached right now."
      );
    }

  }finally{

    loadingMembers = false;

    loadMoreButton.disabled =
      false;

    updateLoadMore();
  }
}

/* ============================================================
   SEARCH
============================================================ */

memberSearch.addEventListener(
  "input",
  () => {

    const value =
      memberSearch.value.trim();

    clearSearch.classList.toggle(
      "show",
      Boolean(value)
    );

    clearTimeout(
      searchTimer
    );

    searchTimer =
      setTimeout(
        () => {

          /*
            Search is intentionally performed
            against already loaded real members.

            For very large directories, replace this
            with a dedicated search index such as
            Algolia, Typesense or an equivalent
            backend search service.
          */

          applyLocalSearch();
          renderMembers();

        },
        160
      );
  }
);

clearSearch.addEventListener(
  "click",
  () => {

    memberSearch.value =
      "";

    clearSearch.classList.remove(
      "show"
    );

    applyLocalSearch();
    renderMembers();

    memberSearch.focus();
  }
);

/* ============================================================
   FILTERS
============================================================ */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const role =
          button.dataset.role;

        if(
          role === currentRole
        ){
          return;
        }

        document
          .querySelectorAll(".filter")
          .forEach(item =>
            item.classList.remove(
              "active"
            )
          );

        button.classList.add(
          "active"
        );

        currentRole =
          role;

        await loadMembers(true);
      }
    );
  });

/* ============================================================
   SORT
============================================================ */

document
  .getElementById("sortButton")
  .addEventListener(
    "click",
    async () => {

      currentSort =
        currentSort === "recent"
          ? "name"
          : "recent";

      document
        .getElementById("sortLabel")
        .textContent =
          currentSort === "recent"
            ? "Recent"
            : "A-Z";

      await loadMembers(true);
    }
  );

/* ============================================================
   LOCAL SEARCH
============================================================ */

function applyLocalSearch(){

  const term =
    memberSearch.value
      .trim()
      .toLowerCase();

  if(!term){

    filteredMembers =
      [...members];

    return;
  }

  filteredMembers =
    members.filter(
      member => {

        const searchable = [
          member.displayName,
          member.username,
          member.location,
          member.role,
          member.bio
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return searchable.includes(
          term
        );
      }

    }else{

      renderEmpty(
        "No members available",
        "There are currently no other members available in the directory."

    return;

  membersGrid.innerHTML =
    filteredMembers

    `${filteredMembers.length} member${

  updateLoadMore();

============================================================ */

function bindMemberActions(){

  membersGrid
    .querySelectorAll(
      "[data-action]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async event => {

          event.preventDefault();
          event.stopPropagation();

          const action =
            button.dataset.action;

          const memberId =
            button.dataset.memberId ||
            button.closest(
              ".member-card"
            )?.dataset.memberId;

          if(!memberId){
            return;
          }

          if(action === "follow"){

            await toggleFollow(
              memberId,
              button
            );

          }else if(action === "message"){

            openMessages(
              memberId
            );

          }else if(action === "details"){

            openMemberDrawer(
              memberId
            );
          }
        }
      );
    });
}

/* ============================================================
   FOLLOW / UNFOLLOW
============================================================ */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    targetUid === currentUser.uid
  ){
    return;
  }

  const currentlyFollowing =
    followingIds.has(
      targetUid
    );

  button.disabled =
    true;

  try{

    const myFollowingRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "following",
        targetUid
      );

    const targetFollowerRef =
      doc(
        db,
        "users",
        targetUid,
        "followers",
        currentUser.uid
      );

    if(currentlyFollowing){

      /*
        Remove both sides of the relationship.
      */

      const batch =
        writeBatch(db);

      batch.delete(
        myFollowingRef
      );

      batch.delete(
        targetFollowerRef
      );

      batch.set(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          followingCount:
            increment(-1)
        },
        {
          merge:true
        }
      );

      batch.set(
        doc(
          db,
          "users",
          targetUid
        ),
        {
          followersCount:
            increment(-1)
        },
        {
          merge:true
        }
      );

      await batch.commit();

      followingIds.delete(
        targetUid
      );

      updateFollowButton(
        button,
        false
      );

      showToast(
        "You unfollowed this member.",
        "success"
      );

    }else{

      /*
        Create both sides of the relationship.
      */

      const batch =
        writeBatch(db);

      batch.set(
        myFollowingRef,
        {
          uid:targetUid,
          createdAt:
            serverTimestamp()
        }
      );

      batch.set(
        targetFollowerRef,
        {
          uid:currentUser.uid,
          createdAt:
            serverTimestamp()
        }
      );

      batch.set(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          followingCount:
            increment(1)
        },
        {
          merge:true
        }
      );

      batch.set(
        doc(
          db,
          "users",
          targetUid
        ),
        {
          followersCount:
            increment(1)
        },
        {
          merge:true
        }
      );

      await batch.commit();

      followingIds.add(
        targetUid
      );

      updateFollowButton(
        button,
        true
      );

      showToast(
        "Following member.",
        "success"
      );
    }

  }catch(error){

    console.error(
      "Follow operation failed:",
      error
    );

    showToast(
      "Could not update your network connection.",
      "error"
    );

  }finally{

    button.disabled =
      false;
  }
}

function updateFollowButton(
  button,
  following
){

  button.classList.toggle(
    "following",
    following
  );

  button.innerHTML =
    following
      ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        Following
      `
      : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>

      `;
}

function createCompatibleFollowButton(
  button
){

  /*
    toggleFollow expects a button
    whose state can be updated.
  */

  return {
    get classList(){
      return {
        toggle(){}
      };
    },
    set disabled(value){
      button.disabled =
        value;
    },
    get disabled(){
      return button.disabled;
    },
    set innerHTML(value){
      button.innerHTML =
        value;
    }
  };
}

/* ============================================================
   UTILITY FUNCTIONS
============================================================ */

function normalizeRole(
  role
){

  if(!role){
    return "";
  }

  return String(role)
    .replace(/[_-]/g," ")
    .replace(/\b\w/g,char =>
      char.toUpperCase()
    );
}

function normalizeRoleValue(
  role
){

  if(!role){
    return "";
  }

  return String(role)
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"_");
}

function getInitials(
  name
){

  const parts =
    String(name || "U")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  return parts
    .slice(0,2)
    .map(
      part =>
        part.charAt(0)
          .toUpperCase()
    )
    .join("") ||
    "U";
}

function getDate(
  value
){

  if(
    value &&
    typeof value.toDate ===
      "function"
  ){

    return value.toDate();
  }

  if(
    value &&
    typeof value.seconds ===
      "number"
  ){

    return new Date(
      value.seconds * 1000
    );
  }

  if(
    value instanceof Date
  ){

    return value;
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return null;
  }

  return date;
}

function isRecentlyActive(
  value
){

  if(!value){
    return false;
  }

  const date =
    getDate(value);

  if(!date){
    return false;
  }

  const difference =
    Date.now() -
    date.getTime();

  return (
    difference >= 0 &&
    difference <=
      15 * 60 * 1000
  );
}

function formatLocation(
  location
){

  if(
    typeof location ===
      "string"
  ){

    return location;
  }

  if(
    location &&
    typeof location ===
      "object"
  ){

    return [
      location.address,
      location.city,
      location.state,
      location.country
    ]
      .filter(Boolean)
      .join(", ");
  }

  return "";
}

function formatCount(
  value
){

  const number =
    Number(value || 0);

  if(
    number >= 1000000
  ){

    return (
      (number / 1000000)
        .toFixed(
          number >= 10000000
            ? 0
            : 1
        )
        .replace(
          ".0",
          ""
        ) +
      "M"
    );
  }

  if(
    number >= 1000
  ){

    return (
      (number / 1000)
        .toFixed(
          number >= 10000
            ? 0
            : 1
        )
        .replace(
          ".0",
          ""
        ) +
      "K"
    );
  }

  return String(
    number
  );
}

/* ============================================================
   SECURITY
============================================================ */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

function escapeAttribute(
  value
){

  return escapeHTML(
    value
  )
    .replaceAll(
      "`",
      "&#096;"
    );
}

/* ============================================================
   TOAST
============================================================ */

function showToast(
  message,
  type = "success"
){

  const toast =
    document.createElement(
      "div"
    );

  toast.className =
    `toast ${type}`;

  const icon =
    type === "success"
      ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      `
      : type === "info"
        ? `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 10v6"/>
            <path d="M12 7h.01"/>
          </svg>
        `
        : `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v5"/>
            <path d="M12 16h.01"/>
          </svg>
        `;

  toast.innerHTML = `
    ${icon}
    <span>
      ${escapeHTML(message)}
    </span>
  `;

  document
    .getElementById(
      "toastStack"
    )
    .appendChild(
      toast
    );

  setTimeout(
    () => {

      toast.style.opacity =
        "0";

      toast.style.transform =
        "translateY(8px)";

      toast.style.transition =
        ".2s ease";

      setTimeout(
        () => toast.remove(),
        220
      );

    },
    3000
  );
}

/* ============================================================
   FATAL ERROR
============================================================ */

function showFatalError(
  message
){

  membersGrid.innerHTML = `
    <div class="empty">

      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v5"/>
          <path d="M12 16h.01"/>
        </svg>
      </div>

      <div class="empty-title">
        Member directory unavailable
      </div>

      <div class="empty-copy">
        ${escapeHTML(message)}
      </div>

      <button
        class="empty-button"
        onclick="location.reload()"
      >
        Try again
      </button>

    </div>
  `;

  resultsMeta.textContent =
    "Connection error";
}

   START
============================================================ */
