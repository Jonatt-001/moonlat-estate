<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community | moonlat Estate</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.1/css/font-awesome.min.css'>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="light-theme">

    <div class="banner d-flex align-items-center">
        <!-- LEFT SIDE: Community Intro & Search -->
        <div class="banner-left">
            <label class="switch d-flex">
                <input id="toggle-theme" type="checkbox">
                <span class="light-txt">light</span>
                <span class="dark-txt">dark</span>
            </label>
            
            <!-- Updated Headline for Community -->
            <h1>The moonlat <br> Community</h1>
            
            <div class="inner-desc">
                <p>Real estate is more than just properties; it's about the people and neighborhoods. Connect with neighbors, share local insights, discover community events, and make your new house truly feel like home.</p>
                
                <!-- Search bar repurposed for community search -->
                <form>
                    <div class="form-group d-flex flex-wrap">
                        <input type="text" class="form-control" id="exampleInputtext1" placeholder="Search for local groups, events, or discussions">
                        <button type="submit" class="black-btn">Explore</button>
                    </div>
                </form>
            </div>

            <div class="social-icons d-flex align-items-center">
                <ul class="d-flex">
                    <li><a href="#" target="_blank"><i class="fa fa-facebook" aria-hidden="true"></i></a></li>
                    <li><a href="#" target="_blank"><i class="fa fa-instagram" aria-hidden="true"></i></a></li>
                    <li><a href="#" target="_blank"><i class="fa fa-twitter" aria-hidden="true"></i></a></li>
                </ul>
                <!-- Changed text to fit community vibe -->
                <span>Join the conversation</span>
            </div>
        </div>

        <!-- RIGHT SIDE: Visuals & Community Stats -->
        <div class="banner-right d-flex">
            <!-- Kept the 'family' div structure so your CSS images still render -->
            <div class="family">
                <!-- Tip: Replace these image URLs with pictures of people, neighborhood gatherings, or local events -->
                <img src="https://yudiz.com/codepen/real-estate/property-img-one.png" alt="community" class="img-fluid">
                <img src="https://yudiz.com/codepen/real-estate/property-img-two.png" alt="community" class="img-fluid">
                
                <!-- Updated the stat to reflect community size -->
                <div class="banner-right-inner">
                    <h2>50k+</h2>
                    <span>Active <br> Members</span>
                    <img src="https://yudiz.com/codepen/real-estate/heart-icon.svg" alt="heart-icon" class="img-fluid">
                </div>
                
                <img src="https://yudiz.com/codepen/real-estate/property-img-three.png" alt="community" class="img-fluid">
                <img src="https://yudiz.com/codepen/real-estate/property-img-four.png" alt="community" class="img-fluid">
            </div>

            <!-- Kept the 'sale' div structure -->
            <div class="sale">
                <img src="https://yudiz.com/codepen/real-estate/property-img-five.png" alt="community" class="img-fluid">
                <img src="https://yudiz.com/codepen/real-estate/property-img-six.png" alt="community" class="img-fluid">
                
                <!-- Updated the stat to reflect community activity -->
                <div class="banner-right-inner">
                    <h2>1k+</h2>
                    <span>Local <br> Events</span>
                    <img src="https://yudiz.com/codepen/real-estate/unit-icon.svg" alt="unit-icon" class="img-fluid">
                </div>
                
                <img src="https://yudiz.com/codepen/real-estate/property-img-seven.png" alt="community" class="img-fluid">
                <img src="https://yudiz.com/codepen/real-estate/property-img-eight.png" alt="community" class="img-fluid">
            </div>
        </div>
    </div>

    <!-- Scripts at the end of the body -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script>
    <script src="./script.js"></script>
</body>
</html>
