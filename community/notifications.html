<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    limit,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    writeBatch,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const app = initializeApp(window.MOONLAT_FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let notifications = [];
let activeFilter = "all";
let notificationUnsubscribe = null;
let selectedNotification = null;

const $ = id => document.getElementById(id);

function escapeHTML(value = "") {
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function getInitials(name = "") {
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    return parts.length
        ? parts.slice(0,2).map(part => part[0]).join("").toUpperCase()
        : "U";
}

function toDate(value) {
    if (!value) return null;
    if (typeof value?.toDate === "function") return value.toDate();
    if (value?.seconds) return new Date(Number(value.seconds) * 1000);

    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
}

function relativeTime(value) {
    const date = toDate(value);
    if (!date) return "Recently";

    const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));

    if (seconds < 10) return "Just now";
    if (seconds < 60) return `${seconds}s ago`;

    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;

    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;

    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d ago`;

    return date.toLocaleDateString(undefined,{
        day:"numeric",
        month:"short",
        year:date.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined
    });
}

function roleLabel(role) {
    const value = String(role || "client").toLowerCase();
    const map = {
        agent:"Agent",
        admin:"Administrator",
        buyer:"Buyer",
        client:"Community member"
    };
    return map[value] || "Community member";
}

function notificationType(type = "") {
    const value = String(type).toLowerCase();

    if (["like","post_like","comment_like"].includes(value)) return "like";
    if (["comment","reply","post_comment","comment_reply"].includes(value)) return "comment";
    if (["mention","mentioned"].includes(value)) return "mention";
    if (["follow","connection","followed"].includes(value)) return "connection";
    if (["property","property_view","property_inquiry"].includes(value)) return "property";
    if (["moderation","report","warning"].includes(value)) return "moderation";
    if (["system","announcement","account"].includes(value)) return "system";

    return value || "system";
}

function typeLabel(type) {
    const labels = {
        like:"Engagement",
        comment:"Conversation",
        mention:"Mention",
        connection:"Connection",
        property:"Property",
        moderation:"Moderation",
        system:"System"
    };
    return labels[notificationType(type)] || "Notification";
}

function typeIcon(type) {
    const icons = {
        like:"fa-heart",
        comment:"fa-comment",
        mention:"fa-at",
        connection:"fa-user-plus",
        property:"fa-building",
        moderation:"fa-shield-halved",
        system:"fa-circle-info"
    };
    return icons[notificationType(type)] || "fa-bell";
}

function notificationCategory(type) {
    const normalized = notificationType(type);

    if (["system","moderation"].includes(normalized)) return "system";
    if (normalized === "mention") return "mentions";
    return "community";
}

function formatNotificationText(item) {
    const actor = item.actorName || item.senderName || item.fromName || "Someone";
    const type = notificationType(item.type);

    if (item.message) {
        return {
            html: item.messageIsTrustedHTML
                ? item.message
                : escapeHTML(item.message),
            actor
        };
    }

    switch(type){
        case "like":
            return { html:`<strong>${escapeHTML(actor)}</strong> liked your post.`, actor };
        case "comment":
            return { html:`<strong>${escapeHTML(actor)}</strong> replied to your community post.`, actor };
        case "mention":
            return { html:`<strong>${escapeHTML(actor)}</strong> mentioned you in a community conversation.`, actor };
        case "connection":
            return { html:`<strong>${escapeHTML(actor)}</strong> connected with you on MoonLat.`, actor };
        case "property":
            return { html:`<strong>${escapeHTML(actor)}</strong> interacted with your property activity.`, actor };
        case "moderation":
            return { html:`MoonLat has an important moderation update for your account or content.`, actor };
        default:
            return { html:`MoonLat has a new account update for you.`, actor };
    }
}

function getActorAvatar(item) {
    return (
        item.actorPhotoURL ||
        item.senderPhotoURL ||
        item.fromPhotoURL ||
        item.actorAvatar ||
        ""
    );
}

function buildTargetURL(item) {
    const base = window.location.origin;

    if (item.targetUrl) {
        if (/^https?:\/\//i.test(item.targetUrl)) return item.targetUrl;
        return new URL(item.targetUrl, base).href;
    }

    if (item.postId) {
        return `${window.location.pathname.replace(/[^/]*$/, "")}index.html?post=${encodeURIComponent(item.postId)}`;
    }

    if (item.commentId && item.postId) {
        return `${window.location.pathname.replace(/[^/]*$/, "")}index.html?post=${encodeURIComponent(item.postId)}&comment=${encodeURIComponent(item.commentId)}`;
    }

    if (item.propertyId) {
        return `property.html?id=${encodeURIComponent(item.propertyId)}`;
    }

    if (item.actorId) {
        return `profile.html?id=${encodeURIComponent(item.actorId)}`;
    }

    return "";
}

function sortNotifications(items) {
    return [...items].sort((a,b) => {
        const ta = toDate(a.createdAt)?.getTime() || 0;
        const tb = toDate(b.createdAt)?.getTime() || 0;
        return tb - ta;
    });
}

function matchesFilter(item) {
    if (activeFilter === "all") return true;
    if (activeFilter === "unread") return item.read !== true;
    if (activeFilter === "mentions") return notificationCategory(item.type) === "mentions";
    if (activeFilter === "community") return notificationCategory(item.type) === "community";
    if (activeFilter === "system") return notificationCategory(item.type) === "system";
    return true;
}

function groupLabel(dateValue) {
    const date = toDate(dateValue);
    if (!date) return "Earlier";

    const now = new Date();
    const dateStart = new Date(date.getFullYear(),date.getMonth(),date.getDate());
    const nowStart = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const diff = Math.round((nowStart - dateStart) / 86400000);

    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    if (diff < 7) return "This week";
    return date.toLocaleDateString(undefined,{month:"long",year:"numeric"});
}

function renderAvatar(item) {
    const name = item.actorName || item.senderName || item.fromName || "MoonLat";
    const avatar = getActorAvatar(item);

    return avatar
        ? `<img src="${escapeHTML(avatar)}" alt="${escapeHTML(name)}">`
        : escapeHTML(getInitials(name));
}

function renderNotification(item) {
    const type = notificationType(item.type);
    const text = formatNotificationText(item);
    const target = buildTargetURL(item);
    const preview = item.previewText || item.commentText || item.postTitle || item.contentPreview || "";
    const unread = item.read !== true;

    return `
        <article class="notification-card ${unread ? "unread" : ""}" data-notification-id="${escapeHTML(item.id)}">

            <div class="actor-avatar">
                ${renderAvatar(item)}
            </div>

            <div class="notification-main">

                <div class="notification-top">
                    <p class="notification-text">
                        ${text.html}
                    </p>

                    <time class="notification-time">
                        ${escapeHTML(relativeTime(item.createdAt))}
                    </time>
                </div>

                ${preview ? `
                    <div class="notification-preview">
                        ${escapeHTML(String(preview).slice(0,220))}
                    </div>
                ` : ""}

                <div class="notification-actions">
                    ${
                        target
                            ? `<button class="notification-action primary" type="button" data-action="open" data-id="${escapeHTML(item.id)}">
                                <i class="fas ${typeIcon(type)}"></i>
                                ${type === "system" || type === "moderation" ? "Review" : "Open"}
                               </button>`
                            : ""
                    }

                    ${
                        unread
                            ? `<button class="notification-action" type="button" data-action="read" data-id="${escapeHTML(item.id)}">
                                <i class="fas fa-check"></i>
                                Mark read
                               </button>`
                            : ""
                    }

                    <button class="notification-action" type="button" data-action="details" data-id="${escapeHTML(item.id)}">
                        <i class="fas fa-ellipsis"></i>
                        Details
                    </button>
                </div>
            </div>

            ${unread ? `<span class="unread-marker" aria-label="Unread"></span>` : ""}
        </article>
    `;
}

function renderNotifications() {
    const list = $("notificationList");
    const items = sortNotifications(notifications).filter(matchesFilter);

    const unreadCount = notifications.filter(item => item.read !== true).length;
    $("heroUnread").textContent = String(unreadCount);

    if (!items.length) {
        const isUnread = activeFilter === "unread";

        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    <i class="fas ${isUnread ? "fa-check-circle" : "fa-bell-slash"}"></i>
                </div>
                <div class="empty-title">
                    ${isUnread ? "You're all caught up" : "No notifications yet"}
                </div>
                <div class="empty-text">
                    ${
                        isUnread
                            ? "New activity will appear here when someone interacts with your content or account."
                            : "MoonLat will keep your community, property and account activity organized here."
                    }
                </div>
            </div>
        `;
        return;
    }

    let html = "";
    let previousGroup = "";

    items.forEach(item => {
        const group = groupLabel(item.createdAt);

        if (group !== previousGroup) {
            html += `<div class="group-label">${escapeHTML(group)}</div>`;
            previousGroup = group;
        }

        html += renderNotification(item);
    });

    list.innerHTML = html;
}

async function markRead(id) {
    if (!currentUser) return;

    const item = notifications.find(notification => notification.id === id);

    if (!item || item.read === true) return;

    try {
        await updateDoc(
            doc(db,"notifications",id),
            { read:true }
        );
    } catch(error) {
        console.error("Mark notification read error:",error);
        toast("Could not mark the notification as read.","error");
    }
}

async function markAllRead() {
    if (!currentUser) return;

    const unread = notifications.filter(item => item.read !== true);

    if (!unread.length) {
        toast("You're already caught up.","info");
        return;
    }

    const button = $("markAllRead");
    button.disabled = true;

    try {
        const batch = writeBatch(db);

        unread.forEach(item => {
            batch.update(
                doc(db,"notifications",item.id),
                { read:true }
            );
        });

        await batch.commit();

        toast("All notifications marked as read.");
    } catch(error) {
        console.error("Mark all read error:",error);
        toast("Could not update all notifications.","error");
    } finally {
        button.disabled = false;
    }
}

function openDetails(item) {
    selectedNotification = item;

    const type = notificationType(item.type);
    const text = formatNotificationText(item);
    const target = buildTargetURL(item);

    $("detailBody").innerHTML = `
        <div style="display:grid;gap:12px">
            <div style="display:flex;align-items:center;gap:9px">
                <div style="width:39px;height:39px;border-radius:12px;background:#f1f5f9;color:#64748b;display:grid;place-items:center">
                    <i class="fas ${typeIcon(type)}"></i>
                </div>
                <div>
                    <div style="font-size:11px;font-weight:850;color:#111827">${escapeHTML(typeLabel(type))}</div>
                    <div style="margin-top:3px;color:#94a3b8;font-size:8px">${escapeHTML(relativeTime(item.createdAt))}</div>
                </div>
            </div>

            <div style="padding:12px;border:1px solid #e6eaf0;border-radius:13px;background:#f8fafc;color:#334155;font-size:10px;line-height:1.65">
                ${text.html}
            </div>

            ${
                item.previewText || item.commentText || item.postTitle
                    ? `<div style="padding:11px;border-left:2px solid #dce2ea;background:#fafbfc;color:#64748b;font-size:9px;line-height:1.6">
                        ${escapeHTML(item.previewText || item.commentText || item.postTitle)}
                       </div>`
                    : ""
            }

            <div style="font-size:8px;color:#94a3b8">
                ${escapeHTML(item.id)}
            </div>
        </div>
    `;

    $("openDetailTarget").classList.toggle("hidden", !target);
    $("notificationDetailModal").classList.add("open");
    $("notificationDetailModal").setAttribute("aria-hidden","false");
    document.body.classList.add("locked");
}

function closeDetails() {
    $("notificationDetailModal").classList.remove("open");
    $("notificationDetailModal").setAttribute("aria-hidden","true");
    document.body.classList.remove("locked");
    selectedNotification = null;
}

async function openNotification(item) {
    await markRead(item.id);

    const target = buildTargetURL(item);

    if (!target) {
        openDetails(item);
        return;
    }

    if (/^https?:\/\//i.test(target)) {
        window.location.href = target;
        return;
    }

    window.location.href = target;
}

function bindNotificationActions() {
    document.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", async event => {
            event.stopPropagation();

            const id = button.dataset.id;
            const action = button.dataset.action;
            const item = notifications.find(notification => notification.id === id);

            if (!item) return;

            if (action === "read") {
                await markRead(id);
                return;
            }

            if (action === "open") {
                await openNotification(item);
                return;
            }

            if (action === "details") {
                if (item.read !== true) {
                    await markRead(id);
                }
                openDetails(item);
            }
        });
    });

    document.querySelectorAll(".notification-card").forEach(card => {
        card.addEventListener("click", async event => {
            if (event.target.closest("button")) return;

            const item = notifications.find(notification => notification.id === card.dataset.notificationId);

            if (item) {
                await openNotification(item);
            }
        });
    });
}

function subscribeToNotifications() {
    if (notificationUnsubscribe) {
        notificationUnsubscribe();
        notificationUnsubscribe = null;
    }

    const q = query(
        collection(db,"notifications"),
        where("userId","==",currentUser.uid),
        limit(100)
    );

    notificationUnsubscribe = onSnapshot(
        q,
        snapshot => {
            notifications = snapshot.docs.map(item => ({
                id:item.id,
                ...item.data()
            }));

            notifications = sortNotifications(notifications);
            renderNotifications();
            bindNotificationActions();

            const unread = notifications.filter(item => item.read !== true).length;

            if (unread) {
                $("headerNotifications").innerHTML = `
                    <i class="fas fa-bell"></i>
                    <span class="notification-dot"></span>
                `;
            } else {
                $("headerNotifications").innerHTML = `<i class="far fa-bell"></i>`;
            }
        },
        error => {
            console.error("Notification subscription error:",error);
            $("notificationList").innerHTML = `
                <div class="empty">
                    <div class="empty-icon"><i class="fas fa-triangle-exclamation"></i></div>
                    <div class="empty-title">Notifications unavailable</div>
                    <div class="empty-text">
                        MoonLat could not load your notification inbox. Check the Firestore notifications read rule and your connection.
                    </div>
                </div>
            `;
        }
    );
}

async function refreshNotifications() {
    if (!currentUser) return;

    const button = $("refreshNotifications");
    button.disabled = true;
    button.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;

    try {
        const q = query(
            collection(db,"notifications"),
            where("userId","==",currentUser.uid),
            limit(100)
        );

        const snapshot = await getDocs(q);

        notifications = sortNotifications(
            snapshot.docs.map(item => ({
                id:item.id,
                ...item.data()
            }))
        );

        renderNotifications();
        bindNotificationActions();
        toast("Notifications refreshed.","info");
    } catch(error) {
        console.error("Notification refresh error:",error);
        toast("Could not refresh notifications.","error");
    } finally {
        button.disabled = false;
        button.innerHTML = `<i class="fas fa-rotate"></i>`;
    }
}

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click",() => {
        document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderNotifications();
        bindNotificationActions();
    });
});

$("markAllRead").addEventListener("click",markAllRead);
$("refreshNotifications").addEventListener("click",refreshNotifications);

$("headerNotifications").addEventListener("click",() => {
    window.scrollTo({top:0,behavior:"smooth"});
});

$("closeDetail").addEventListener("click",closeDetails);
$("closeDetailButton").addEventListener("click",closeDetails);

$("notificationDetailModal").addEventListener("click",event => {
    if (event.target === $("notificationDetailModal")) {
        closeDetails();
    }
});

$("openDetailTarget").addEventListener("click",async() => {
    if (selectedNotification) {
        await openNotification(selectedNotification);
    }
});

document.addEventListener("keydown",event => {
    if (event.key === "Escape" && $("notificationDetailModal").classList.contains("open")) {
        closeDetails();
    }
});

onAuthStateChanged(auth,async user => {
    currentUser = user;

    if (!user) {
        window.location.href = "../dashboard/sign-in.html";
        return;
    }

    subscribeToNotifications();
});
</script>
</body>
</html>
