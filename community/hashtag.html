<body><header><a href="index.html">MoonLat Community</a></header><main class="wrap"><section class="hero"><h1 id="heading">Hashtag</h1><p id="sub">Loading relevant community posts...</p></section><section id="feed"></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";import{getFirestore,collection,query,where,getDocs,limit}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",authDomain:"moonlat-estate-dashboard.firebaseapp.com",projectId:"moonlat-estate-dashboard",storageBucket:"moonlat-estate-dashboard.firebasestorage.app",messagingSenderId:"289878951289",appId:"1:289878951289:web:18db63e3ab8f071b811ba8"};const db=getFirestore(initializeApp(firebaseConfig));const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");const tag=(new URLSearchParams(location.search).get("tag")||"").replace(/^#+/,"").toLowerCase().replace(/[^a-z0-9_]/g,"");
function ms(x){const t=x?.createdAt;return typeof t?.toMillis==="function"?t.toMillis():new Date(t||0).getTime()||0}function run(){if(!tag){document.getElementById("heading").textContent="Community hashtags";document.getElementById("sub").textContent="Choose a hashtag from a MoonLat community post.";document.getElementById("feed").innerHTML='<div class="empty">No hashtag was selected.</div>';return}document.title=`#${tag} — MoonLat Community`;document.getElementById("heading").textContent=`#${tag}`;document.querySelector('meta[name="description"]').setAttribute("content",`MoonLat Community posts tagged #${tag}.`);document.getElementById("canonicalUrl").href=`${location.origin}${location.pathname}?tag=${encodeURIComponent(tag)}`;getDocs(query(collection(db,"communityPosts"),where("hashtags","array-contains",tag),limit(100))).then(s=>{const posts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ae=(Number(a.likeCount)||0)+(Number(a.commentCount)||0)*2+(Number(a.shareCount)||0)*2+(Number(a.saveCount)||0);const be=(Number(b.likeCount)||0)+(Number(b.commentCount)||0)*2+(Number(b.shareCount)||0)*2+(Number(b.saveCount)||0);return(be-ae)||ms(b)-ms(a)});document.getElementById("sub").textContent=`${posts.length} relevant ${posts.length===1?"post":"posts"} ranked by community engagement and freshness.`;document.getElementById("feed").innerHTML=posts.length?posts.map(p=>`<article class="post"><a href="post.html?id=${encodeURIComponent(p.id)}"><div class="title">${esc(p.title||"Community post")}</div>${p.content?`<div class="content">${esc(p.content.slice(0,280))}${p.content.length>280?"…":""}</div>`:""}<div class="meta">${esc(p.authorName||"Community member")} · ${new Date(ms(p)||Date.now()).toLocaleDateString()}</div>${Array.isArray(p.hashtags)?`<div class="tags">${p.hashtags.map(h=>`<span class="tag">#${esc(h)}</span>`).join("")}</div>`:""}${Array.isArray(p.images)&&p.images[0]?.url&&!String(p.images[0].format||"").includes("video")?`<div class="media"><img src="${esc(p.images[0].url)}" alt="${esc(p.title||"MoonLat community image")}" loading="lazy"></div>`:""}</a></article>`).join(""): '<div class="empty">No public posts are currently tagged with this hashtag.</div>'}).catch(e=>{console.error(e);document.getElementById("feed").innerHTML='<div class="empty">This hashtag could not be loaded. Check public Firestore read access.</div>'})}run();
