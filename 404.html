<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction | MoonLat</title>
<meta name="description" content="This page is currently under construction. We're building something amazing for you.">
<meta name="theme-color" content="#09063d">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #09063d;
    --navy-dark: #07052f;
    --accent: #3465f6;
    --accent-light: #7c9eff;
    --white: #ffffff;
    --text: rgba(255, 255, 255, 0.9);
    --muted: rgba(255, 255, 255, 0.6);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 50%, #0a0638 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
}

/* Animated background elements */
body::before,
body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: float 20s ease-in-out infinite;
}

body::before {
    width: 400px;
    height: 400px;
    background: var(--accent);
    top: -100px;
    left: -100px;
}

body::after {
    width: 300px;
    height: 300px;
    background: #17d8c2;
    bottom: -50px;
    right: -50px;
    animation-delay: -10s;
}

@keyframes float {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }
    33% {
        transform: translate(30px, -30px) scale(1.1);
    }
    66% {
        transform: translate(-20px, 20px) scale(0.9);
    }
}

.container {
    max-width: 600px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: fadeInUp 0.8s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Icon */
.icon-wrapper {
    width: 100px;
    height: 100px;
    margin: 0 auto 24px;
    position: relative;
}

.icon-wrapper svg {
    width: 100%;
    height: 100%;
    color: var(--accent);
    filter: drop-shadow(0 8px 24px rgba(52, 101, 246, 0.4));
    animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: 0.9;
    }
    50% {
        transform: scale(1.05);
        opacity: 1;
    }
}

/* Badge */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: rgba(52, 101, 246, 0.15);
    border: 1px solid rgba(52, 101, 246, 0.3);
    border-radius: 50px;
    margin-bottom: 24px;
}

.badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.badge span {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent-light);
    text-transform: uppercase;
    letter-spacing: 0.12em;
}

/* Heading */
h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 16px;
}

/* Subtitle */
.subtitle {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
}

/* Progress */
.progress-container {
    margin-bottom: 32px;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.progress-label span {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 500;
}

.progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
}

.progress-fill {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, var(--accent), #17d8c2);
    border-radius: 3px;
    position: relative;
    animation: shimmer 2s ease-in-out infinite;
}

@keyframes shimmer {
    0% { opacity: 0.8; }
    50% { opacity: 1; }
    100% { opacity: 0.8; }
}

/* Buttons */
.actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 28px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
}

.btn-primary {
    background: var(--accent);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(52, 101, 246, 0.35);
}

.btn-primary:hover {
    background: #2952d3;
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(52, 101, 246, 0.45);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--white);
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
}

.btn svg {
    width: 20px;
    height: 20px;
}

/* Footer */
.footer {
    padding-top: 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.footer p {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
}

.footer a {
    color: var(--accent-light);
    text-decoration: none;
    transition: color 0.3s ease;
}

.footer a:hover {
    color: var(--accent);
}

/* ============================================
   MOBILE-FIRST RESPONSIVE
   ============================================ */

/* Base styles are now mobile-optimized */
body {
    padding: 20px;
}

.container {
    max-width: 100%;
}

.icon-wrapper {
    width: 80px;
    height: 80px;
    margin-bottom: 20px;
}

h1 {
    font-size: 1.75rem;
    margin-bottom: 14px;
}

.subtitle {
    font-size: 0.92rem;
    margin-bottom: 28px;
    max-width: 100%;
}

.progress-container {
    margin-bottom: 28px;
}

.progress-label span {
    font-size: 0.78rem;
}

.actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
}

.btn {
    padding: 14px 24px;
    font-size: 0.9rem;
}

.footer {
    padding-top: 20px;
}

.footer p {
    font-size: 0.8rem;
}

/* Tablet (640px+) */
@media (min-width: 640px) {
    body {
        padding: 24px;
    }
    
    .container {
        max-width: 500px;
    }
    
    .icon-wrapper {
        width: 90px;
        height: 90px;
        margin-bottom: 22px;
    }
    
    h1 {
        font-size: 2rem;
        margin-bottom: 15px;
    }
    
    .subtitle {
        font-size: 0.95rem;
        margin-bottom: 30px;
        max-width: 420px;
    }
    
    .progress-container {
        margin-bottom: 30px;
    }
    
    .actions {
        flex-direction: row;
        gap: 14px;
        margin-bottom: 36px;
    }
    
    .btn {
        flex: 1;
        padding: 15px 26px;
        font-size: 0.92rem;
    }
    
    .footer {
        padding-top: 22px;
    }
    
    .footer p {
        font-size: 0.82rem;
    }
}

/* Desktop (768px+) */
@media (min-width: 768px) {
    body {
        padding: 32px;
    }
    
    .container {
        max-width: 600px;
    }
    
    .icon-wrapper {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
    }
    
    h1 {
        font-size: 2.2rem;
        margin-bottom: 16px;
    }
    
    .subtitle {
        font-size: 1rem;
        margin-bottom: 32px;
    }
    
    .progress-container {
        margin-bottom: 32px;
    }
    
    .actions {
        gap: 16px;
        margin-bottom: 40px;
    }
    
    .btn {
        padding: 16px 28px;
        font-size: 0.95rem;
    }
    
    .footer {
        padding-top: 24px;
    }
    
    .footer p {
        font-size: 0.85rem;
    }
}

/* Large Desktop (1024px+) */
@media (min-width: 1024px) {
    .container {
        max-width: 640px;
    }
    
    h1 {
        font-size: 2.4rem;
    }
}

/* ============================================
   MOBILE OVERFLOW FIX
   ============================================ */

/* Prevent all overflow on mobile */
html, body {
    overflow-x: hidden !important;
    max-width: 100vw !important;
}

/* Constrain background elements */
body::before,
body::after {
    max-width: 300px !important;
    max-height: 300px !important;
}

@media (max-width: 639px) {
    body::before {
        width: 250px !important;
        height: 250px !important;
        top: -80px !important;
        left: -80px !important;
    }
    
    body::after {
        width: 200px !important;
        height: 200px !important;
        bottom: -40px !important;
        right: -40px !important;
    }
}

/* Ensure container respects viewport */
.container {
    width: 100% !important;
    max-width: 100vw !important;
    padding: 0 4px;
    box-sizing: border-box !important;
}

/* Prevent button overflow */
.actions {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
}

.btn {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

/* Prevent badge overflow */
.badge {
    max-width: 100%;
    box-sizing: border-box;
}

/* Ensure text doesn't overflow */
h1,
.subtitle,
.footer p {
    word-wrap: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
}

/* Fix progress bar */
.progress-bar {
    max-width: 100%;
    box-sizing: border-box;
}

/* Fix icon wrapper */
.icon-wrapper {
    max-width: 100px;
    width: 100%;
    box-sizing: border-box;
}

/* Additional mobile fixes */
@media (max-width: 480px) {
    body {
        padding: 16px !important;
    }
    
    .container {
        padding: 0 !important;
    }
    
    h1 {
        font-size: 1.6rem !important;
        padding: 0 8px;
    }
    
    .subtitle {
        padding: 0 8px;
    }
    
    .btn {
        padding: 12px 20px !important;
        font-size: 0.85rem !important;
    }
    
    .badge {
        padding: 6px 16px !important;
    }
    
    .badge span {
        font-size: 0.7rem !important;
    }
}

/* Prevent any element from causing horizontal scroll */
* {
    max-width: 100%;
    box-sizing: border-box;
}

img, svg {
    max-width: 100%;
    height: auto;
}






</style>
