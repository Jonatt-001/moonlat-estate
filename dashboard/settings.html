<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | MoonLat Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.3/index.min.css">
<link rel="stylesheet" href="dashboard.css">
<style>
  #sidebar { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #sidebarNav { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  #sidebarNav::-webkit-scrollbar { width: 6px; }
  #sidebarNav::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
  #sidebarNav::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
  #sidebarNav::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
  #sidebarNav { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) rgba(255, 255, 255, 0.05); }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Auth Guard -->
<div id="authGuard" class="fixed inset-0 bg-white z-[9999] flex items-center justify-center">
  <div class="spinner" style="width: 32px; height: 32px; border-width: 3px; border-color: #e2e8f0; border-top-color: #3b82f6;"></div>
</div>

<div id="app" class="flex min-h-screen hidden flex-col w-full">
  <!-- Main -->
  <main class="flex-1 min-w-0 w-full bg-gray-50">
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-20">
      <div class="flex items-center justify-between px-4 sm:px-6 py-3">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <!-- Return Back Arrow -->
          <button onclick="window.history.back()" class="text-gray-600 hover:bg-gray-100 hover:text-gray-900 p-2 rounded-lg transition" title="Go Back">
            <i class="fas fa-arrow-left text-lg"></i>
          </button>
          <h1 class="text-xl font-bold text-gray-900">Settings</h1>
        </div>
        <div class="flex items-center gap-1 sm:gap-2">
          <div class="hidden md:flex items-center gap-2 pl-2 ml-2 border-l border-gray-200">
            <img id="headerAvatarImg" class="avatar w-9 h-9 rounded-full object-cover hidden" />
            <div id="headerAvatarText" class="avatar w-9 h-9 text-sm flex items-center justify-center bg-gradient-to-br from-violet-500 to-indigo-600 text-white">U</div>
            <div>
              <p class="text-sm font-semibold leading-tight" id="headerUserName">User</p>
              <p class="text-xs text-gray-500 leading-tight" id="headerUserEmail">user@example.com</p>
            </div>
          </div>
        </div>
      </div>
    </header>


    <div id="page-content" class="p-4 sm:p-6 lg:p-8 max-w-[1600px] mx-auto">
      <div class="flex items-center justify-center h-64">
        <div class="spinner" style="width: 32px; height: 32px; border-width: 3px; border-color: #e2e8f0; border-top-color: #3b82f6;"></div>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-3"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",
  authDomain: "moonlat-estate-dashboard.firebaseapp.com",
  projectId: "moonlat-estate-dashboard",
  storageBucket: "moonlat-estate-dashboard.firebasestorage.app",
  messagingSenderId: "289878951289",
  appId: "1:289878951289:web:18db63e3ab8f071b811ba8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userProfile = null;

function getInitials(name) {
  if (!name) return 'U';
  return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  const icons = { success: 'fa-check-circle text-green-500', error: 'fa-times-circle text-red-500', warning: 'fa-exclamation-triangle text-amber-500', info: 'fa-info-circle text-blue-500' };
  
  toast.className = `bg-white border-l-4 border-gray-300 rounded-lg shadow-lg p-4 flex items-center gap-3 min-w-[300px] animate-fade-in`;
  if (type === 'success') toast.classList.replace('border-gray-300', 'border-green-500');
  if (type === 'error') toast.classList.replace('border-gray-300', 'border-red-500');
  if (type === 'warning') toast.classList.replace('border-gray-300', 'border-amber-500');
  if (type === 'info') toast.classList.replace('border-gray-300', 'border-blue-500');

  toast.innerHTML = `
    <i class="fas ${icons[type]} text-xl"></i>
    <div class="flex-1">
      <p class="font-medium text-gray-900">${type.charAt(0).toUpperCase() + type.slice(1)}</p>
      <p class="text-sm text-gray-600">${message}</p>
    </div>
    <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'sign-in.html';
  } else {
    currentUser = user;
    try {
      const profileDoc = await getDoc(doc(db, 'users', user.uid));
      if (profileDoc.exists()) {
        userProfile = { id: user.uid, ...profileDoc.data() };
      } else {
        userProfile = {
          id: user.uid,
          name: user.displayName || user.email?.split('@')[0] || 'User',
          email: user.email,
          role: 'buyer',
          createdAt: Date.now(),
          memberSince: new Date().toLocaleDateString('en', { month: 'short', year: 'numeric' })
        };
      }
      setupUI();
      renderSettings();
      document.getElementById('authGuard').style.display = 'none';
      document.getElementById('app').classList.remove('hidden');
    } catch (err) {
      console.error('Profile load error:', err);
      showToast('Failed to load profile', 'error');
    }
  }
});

function setupUI() {
  const name = userProfile.name || 'User';
  const email = userProfile.email || '';
  const photo = userProfile.photoURL || userProfile.profileImage || '';
  
  // Update Header Avatar Only
  if (photo) {
    const headerImg = document.getElementById('headerAvatarImg');
    if (headerImg) {
      headerImg.src = photo;
      headerImg.classList.remove('hidden');
    }
    const headerText = document.getElementById('headerAvatarText');
    if (headerText) {
      headerText.classList.add('hidden');
    }
  } else {
    const initials = getInitials(name);
    const headerText = document.getElementById('headerAvatarText');
    if (headerText) {
      headerText.textContent = initials;
    }
  }
  
  const headerName = document.getElementById('headerUserName');
  if (headerName) headerName.textContent = name;
  
  const headerEmail = document.getElementById('headerUserEmail');
  if (headerEmail) headerEmail.textContent = email;
}

function renderSettings() {
  const p = userProfile || {};
  const photo = p.photoURL || p.profileImage || '';
  const content = document.getElementById('page-content');
  
  content.innerHTML = `
    <div class="mb-6">
      <h2 class="text-3xl font-bold">Settings</h2>
      <p class="text-gray-500 text-sm mt-1">Manage your account and preferences</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="text-center">
          <div class="relative w-24 h-24 mx-auto mb-4 group cursor-pointer" onclick="document.getElementById('profileImageInput').click()">
            ${photo ? 
              `<img src="${escapeHtml(photo)}" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md" alt="Profile">` : 
              `<div class="w-24 h-24 rounded-full bg-gradient-to-br from-violet-500 to-indigo-600 text-white text-3xl flex items-center justify-center border-4 border-white shadow-md">${getInitials(p.name)}</div>`
            }
            <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <i class="fas fa-camera text-white text-xl"></i>
            </div>
          </div>
          <input type="file" id="profileImageInput" accept="image/*" class="hidden" onchange="uploadProfileImage(event)">
          <h3 class="font-bold text-lg">${escapeHtml(p.name)}</h3>
          <p class="text-sm text-gray-500">${p.role === 'agent' ? 'Agent' : 'Buyer'}</p>
          <p class="text-xs text-gray-400 mt-1">Member since ${p.memberSince || 'Recently'}</p>
        </div>
        <div class="mt-6 pt-6 border-t space-y-3">
          <div class="flex justify-between text-sm"><span class="text-gray-500">Role</span><span class="font-semibold">${p.role === 'agent' ? 'Agent' : 'Buyer'}</span></div>
          <div class="flex justify-between text-sm"><span class="text-gray-500">Email</span><span class="font-semibold">${escapeHtml(p.email)}</span></div>
        </div>
      </div>

      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h3 class="font-bold text-lg mb-4">Personal Information</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
              <input type="text" id="setName" value="${escapeHtml(p.name)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
              <input type="email" value="${escapeHtml(p.email)}" class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg text-gray-500 cursor-not-allowed" disabled>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
              <input type="tel" id="setPhone" value="${escapeHtml(p.phone)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
              <textarea id="setBio" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">${escapeHtml(p.bio)}</textarea>
            </div>
          </div>
        </div>

        ${p.role === 'agent' ? `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h3 class="font-bold text-lg mb-4">Business Information</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Agency</label>
              <input type="text" id="setAgency" value="${escapeHtml(p.agency)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">License #</label>
              <input type="text" id="setLicense" value="${escapeHtml(p.license)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Service Area</label>
              <input type="text" id="setArea" value="${escapeHtml(p.serviceArea)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Commission Rate</label>
              <input type="text" id="setRate" value="${escapeHtml(p.commissionRate)}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
          </div>
        </div>
        ` : ''}

        <div class="flex justify-end gap-3">
          <button onclick="window.history.back()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            <i class="fas fa-arrow-left mr-2"></i>Back
          </button>
          <button onclick="saveSettings()" id="saveSettingsBtn" class="px-6 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition flex items-center gap-2">
            <i class="fas fa-save"></i> Save Changes
          </button>
        </div>
      </div>
    </div>
  `;
}

window.uploadProfileImage = async function(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showToast('Please select an image file', 'error');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showToast('Image must be less than 5MB', 'error');
    return;
  }

  showToast('Uploading profile image...', 'info');
  const btn = document.getElementById('saveSettingsBtn');
  const originalBtnText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

  try {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', 'moonlat_preset'); 
    formData.append('folder', 'moonlat_profiles');

    const result = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/dxdbn6xwy/image/upload`, true);
      
      xhr.onload = function() {
        if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
        else reject(new Error(`Upload failed: ${xhr.statusText}`));
      };
      xhr.onerror = () => reject(new Error('Network error during upload'));
      xhr.send(formData);
    });

    const imageUrl = result.secure_url;
    
    await updateDoc(doc(db, 'users', currentUser.uid), {
      photoURL: imageUrl,
      profileImage: imageUrl,
      updatedAt: serverTimestamp()
    });

    userProfile.photoURL = imageUrl;
    userProfile.profileImage = imageUrl;
    
    setupUI();
    renderSettings();
    showToast('Profile image updated successfully', 'success');
  } catch (err) {
    console.error('Profile image upload error:', err);
    showToast('Failed to upload profile image', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalBtnText;
  }
};

window.saveSettings = async function() {
  const data = {
    name: document.getElementById('setName').value.trim(),
    phone: document.getElementById('setPhone').value.trim(),
    bio: document.getElementById('setBio').value.trim()
  };
  
  if (userProfile?.role === 'agent') {
    data.agency = document.getElementById('setAgency')?.value.trim() || '';
    data.license = document.getElementById('setLicense')?.value.trim() || '';
    data.serviceArea = document.getElementById('setArea')?.value.trim() || '';
    data.commissionRate = document.getElementById('setRate')?.value.trim() || '';
  }
  
  const btn = document.getElementById('saveSettingsBtn');
  const originalBtnText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
  
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), {
      ...data,
      updatedAt: serverTimestamp()
    });
    userProfile = { ...userProfile, ...data };
    setupUI();
    showToast('Settings saved successfully', 'success');
  } catch (err) {
    console.error('Save settings error:', err);
    showToast('Failed to save settings', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalBtnText;
  }
};

window.handleLogout = async function(e) {
  if(e) e.preventDefault();
  if (confirm('Are you sure you want to sign out?')) {
    try {
      await signOut(auth);
      window.location.href = 'sign-in.html';
    } catch (err) {
      showToast('Failed to sign out', 'error');
    }
  }
};
</script>

</body>
</html>
