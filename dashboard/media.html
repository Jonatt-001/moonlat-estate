<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Library — MoonLat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/index.min.css">
<style>
  body { font-family: 'Inter', sans-serif; background: #f8fafc; }
  .gradient-text { background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body class="min-h-screen">

<!-- Auth Guard -->
<div id="authGuard" class="fixed inset-0 bg-white z-[9999] flex items-center justify-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
</div>

<!-- Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-20">
  <div class="flex items-center justify-between px-4 sm:px-6 py-3 max-w-[1600px] mx-auto">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-gray-600 hover:bg-gray-100 p-2 rounded-lg transition" title="Back to Dashboard">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-violet-500 via-indigo-500 to-slate-700 flex items-center justify-center shadow-sm">
          <i class="fas fa-images text-white text-sm"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-gray-900 leading-tight">Media Library</h1>
          <p class="text-xs text-gray-500 leading-tight">Manage your property images</p>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="hidden sm:flex items-center gap-2 pr-3 border-r border-gray-200">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold" id="headerAvatar">U</div>
        <p class="text-sm font-semibold" id="headerUserName">User</p>
      </div>
      <a href="dashboard.html" class="btn px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm font-semibold"><i class="fas fa-th-large mr-1"></i> Dashboard</a>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="p-4 sm:p-6 lg:p-8 max-w-[1600px] mx-auto">
  <!-- Stats -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
      <div class="flex items-center justify-between mb-3">
        <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
          <i class="fas fa-image"></i>
        </div>
      </div>
      <p class="text-2xl font-bold" id="statTotal">0</p>
      <p class="text-sm text-gray-500 mt-0.5">Total Images</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
      <div class="flex items-center justify-between mb-3">
        <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center">
          <i class="fas fa-building"></i>
        </div>
      </div>
      <p class="text-2xl font-bold" id="statProperties">0</p>
      <p class="text-sm text-gray-500 mt-0.5">Properties</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
      <div class="flex items-center justify-between mb-3">
        <div class="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center">
          <i class="fas fa-hdd"></i>
        </div>
      </div>
      <p class="text-2xl font-bold" id="statStorage">0 MB</p>
      <p class="text-sm text-gray-500 mt-0.5">Storage Used</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
      <div class="flex items-center justify-between mb-3">
        <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center">
          <i class="fas fa-star"></i>
        </div>
      </div>
      <p class="text-2xl font-bold" id="statFeatured">0</p>
      <p class="text-sm text-gray-500 mt-0.5">Featured Images</p>
    </div>
  </div>

  <!-- Upload Section -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 mb-6">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="font-bold text-lg text-gray-900">Upload Images</h3>
        <p class="text-sm text-gray-500 mt-0.5">Add images to your media library</p>
      </div>
      <button onclick="document.getElementById('fileInput').click()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold text-sm">
        <i class="fas fa-upload mr-2"></i>Upload Files
      </button>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event)">
    
    <!-- Upload Progress -->
    <div id="uploadProgress" class="hidden mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-gray-700">Uploading...</span>
        <span class="text-sm text-gray-500" id="uploadPercent">0%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div id="uploadBar" class="bg-blue-600 h-2 rounded-full transition-all" style="width: 0%"></div>
      </div>
    </div>

    <!-- Preview Grid -->
    <div id="uploadPreview" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 mb-6">
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Search images..." class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" oninput="renderMedia()">
      </div>
      <select id="propertyFilter" class="w-full sm:w-64 px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm" onchange="renderMedia()">
        <option value="">All Properties</option>
      </select>
    </div>
  </div>

  <!-- Media Grid -->
  <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    <!-- Loader -->
    <div class="col-span-full flex justify-center py-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
    </div>
  </div>
</main>

<!-- Image Preview Modal -->
<div id="previewModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background: rgba(0,0,0,0.9);">
  <button onclick="closePreview()" class="absolute top-4 right-4 text-white hover:text-gray-300 p-2">
    <i class="fas fa-times text-2xl"></i>
  </button>
  <img id="previewImage" src="" class="max-w-full max-h-[90vh] rounded-lg" alt="Preview">
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
    <button onclick="copyImageUrl()" class="px-4 py-2 bg-white text-gray-900 rounded-lg font-semibold text-sm hover:bg-gray-100">
      <i class="fas fa-copy mr-2"></i>Copy URL
    </button>
    <button onclick="deleteCurrentImage()" class="px-4 py-2 bg-red-600 text-white rounded-lg font-semibold text-sm hover:bg-red-700">
      <i class="fas fa-trash mr-2"></i>Delete
    </button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed top-4 right-4 z-[100] hidden px-4 py-3 rounded-lg shadow-lg text-white font-medium text-sm"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, getDocs, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",
  authDomain: "moonlat-estate-dashboard.firebaseapp.com",
  projectId: "moonlat-estate-dashboard",
  storageBucket: "moonlat-estate-dashboard.firebasestorage.app",
  messagingSenderId: "289878951289",
  appId: "1:289878951289:web:18db63e3ab8f071b811ba8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Cloudinary config - REPLACE WITH YOUR CLOUDINARY DETAILS
const CLOUDINARY_CLOUD_NAME = 'dxdbn6xwy'; // From your screenshot
const CLOUDINARY_UPLOAD_PRESET = 'geefox_unsigned'; // You need to create this in Cloudinary

let currentUser = null;
let mediaItems = [];
let properties = [];
let currentPreviewId = null;

// Helpers
function getInitials(name) {
  if (!name) return 'U';
  return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 MB';
  const mb = bytes / (1024 * 1024);
  return mb.toFixed(1) + ' MB';
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `fixed top-4 right-4 z-[100] px-4 py-3 rounded-lg shadow-lg text-white font-medium text-sm ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
  toast.classList.remove('hidden');
  setTimeout(() => toast.classList.add('hidden'), 3000);
}

// Upload to Cloudinary
async function uploadToCloudinary(file, onProgress) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', 'moonlat_properties');

  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/dxdbn6xwy/image/upload`, true);
    
    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable && onProgress) {
        const percent = Math.round((e.loaded / e.total) * 100);
        onProgress(percent);
      }
    });
    
    xhr.addEventListener('load', () => {
      if (xhr.status === 200) {
        const response = JSON.parse(xhr.responseText);
        resolve(response);
      } else {
        reject(new Error('Upload failed'));
      }
    });
    
    xhr.addEventListener('error', () => reject(new Error('Upload failed')));
    xhr.send(formData);
  });
}

// Handle file selection
window.handleFileSelect = async function(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;

  const previewContainer = document.getElementById('uploadPreview');
  const progressDiv = document.getElementById('uploadProgress');
  const progressBar = document.getElementById('uploadBar');
  const progressPercent = document.getElementById('uploadPercent');
  
  previewContainer.innerHTML = '';
  progressDiv.classList.remove('hidden');

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    
    // Create preview
    const reader = new FileReader();
    reader.onload = (e) => {
      const div = document.createElement('div');
      div.className = 'relative aspect-square rounded-lg overflow-hidden border border-gray-200';
      div.innerHTML = `
        <img src="${e.target.result}" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
          <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
        </div>
      `;
      previewContainer.appendChild(div);
    };
    reader.readAsDataURL(file);

    try {
      const result = await uploadToCloudinary(file, (percent) => {
        progressBar.style.width = percent + '%';
        progressPercent.textContent = percent + '%';
      });

      // Save to Firestore
      await addDoc(collection(db, 'media'), {
        url: result.secure_url,
        publicId: result.public_id,
        filename: file.name,
        size: file.size,
        format: result.format,
        width: result.width,
        height: result.height,
        ownerId: currentUser.uid,
        createdAt: serverTimestamp()
      });

      showToast('Image uploaded successfully');
    } catch (err) {
      console.error(err);
      showToast('Failed to upload image', 'error');
    }
  }

  setTimeout(() => {
    progressDiv.classList.add('hidden');
    previewContainer.innerHTML = '';
    event.target.value = '';
  }, 1000);
};

// Render media grid
function renderMedia() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const propertyFilter = document.getElementById('propertyFilter').value;
  
  let filtered = mediaItems;
  
  if (search) {
    filtered = filtered.filter(m => m.filename.toLowerCase().includes(search));
  }
  if (propertyFilter) {
    filtered = filtered.filter(m => m.propertyId === propertyFilter);
  }

  const grid = document.getElementById('mediaGrid');
  
  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="col-span-full flex flex-col items-center justify-center py-12 text-gray-500">
        <i class="fas fa-images text-4xl mb-3"></i>
        <p>No images found</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(item => `
    <div class="group relative aspect-square rounded-xl overflow-hidden border border-gray-200 bg-gray-100 cursor-pointer" onclick="openPreview('${item.id}', '${item.url}')">
      <img src="${item.url}" class="w-full h-full object-cover" alt="${item.filename}">
      <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-all flex items-center justify-center opacity-0 group-hover:opacity-100">
        <button class="p-2 bg-white rounded-lg text-gray-900 hover:bg-gray-100" title="View">
          <i class="fas fa-expand"></i>
        </button>
      </div>
      <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
        <button onclick="event.stopPropagation(); deleteImage('${item.id}')" class="p-1.5 bg-red-600 text-white rounded-lg hover:bg-red-700" title="Delete">
          <i class="fas fa-trash text-xs"></i>
        </button>
      </div>
      <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/60 to-transparent">
        <p class="text-white text-xs truncate">${item.filename}</p>
      </div>
    </div>
  `).join('');

  // Update stats
  document.getElementById('statTotal').textContent = mediaItems.length;
  const totalSize = mediaItems.reduce((sum, m) => sum + (m.size || 0), 0);
  document.getElementById('statStorage').textContent = formatBytes(totalSize);
  document.getElementById('statFeatured').textContent = mediaItems.filter(m => m.isFeatured).length;
  document.getElementById('statProperties').textContent = new Set(mediaItems.map(m => m.propertyId).filter(Boolean)).size;
}

// Preview functions
window.openPreview = function(id, url) {
  currentPreviewId = id;
  document.getElementById('previewImage').src = url;
  document.getElementById('previewModal').classList.remove('hidden');
};

window.closePreview = function() {
  document.getElementById('previewModal').classList.add('hidden');
  currentPreviewId = null;
};

window.copyImageUrl = async function() {
  const url = document.getElementById('previewImage').src;
  await navigator.clipboard.writeText(url);
  showToast('URL copied to clipboard');
};

window.deleteCurrentImage = async function() {
  if (!currentPreviewId) return;
  if (!confirm('Are you sure you want to delete this image?')) return;
  
  try {
    await deleteDoc(doc(db, 'media', currentPreviewId));
    showToast('Image deleted');
    closePreview();
  } catch (err) {
    showToast('Failed to delete image', 'error');
  }
};

window.deleteImage = async function(id) {
  if (!confirm('Are you sure you want to delete this image?')) return;
  
  try {
    await deleteDoc(doc(db, 'media', id));
    showToast('Image deleted');
  } catch (err) {
    showToast('Failed to delete image', 'error');
  }
};

// Auth + Data subscription
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'sign-in.html';
    return;
  }

  currentUser = user;
  document.getElementById('headerUserName').textContent = user.displayName || user.email?.split('@')[0] || 'User';
  document.getElementById('headerAvatar').textContent = getInitials(user.displayName || user.email);

  // Load properties for filter
  const propsQuery = query(collection(db, 'properties'), where('ownerId', '==', user.uid));
  const propsSnap = await getDocs(propsQuery);
  properties = propsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  
  const filterSelect = document.getElementById('propertyFilter');
  properties.forEach(p => {
    const option = document.createElement('option');
    option.value = p.id;
    option.textContent = p.title;
    filterSelect.appendChild(option);
  });

  // Subscribe to media
  const mediaQuery = query(collection(db, 'media'), where('ownerId', '==', user.uid));
  onSnapshot(mediaQuery, (snap) => {
    mediaItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMedia();
    document.getElementById('authGuard').style.display = 'none';
  });
});
</script>
</body>
</html>
