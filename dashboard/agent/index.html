    (function () {

      try {
        if (!window.firebase || !firebase.apps) {
          throw new Error("Firebase App SDK failed to load.");
        }

        if (!firebase.apps.length) {
          firebase.initializeApp(window.MOONLAT_FIREBASE_CONFIG);
        }
      } catch (error) {
        console.error("MoonLat Firebase initialization failed:", error);

        const loading = document.getElementById("loadingScreen");

        if (loading) {
          loading.innerHTML = `
            <div class="text-center px-6">
              <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-red-100 text-red-600">
                <i class="fas fa-triangle-exclamation"></i>

              <div class="mt-4 font-extrabold text-white">
                Workspace unavailable
              </div>

              <div class="mt-2 max-w-xs text-xs leading-5 text-slate-400">
                MoonLat could not initialize Firebase. Check your connection and try again.
              </div>

              <button
                onclick="location.reload()"
                class="mt-5 rounded-xl bg-white px-5 py-3 text-xs font-bold text-slate-900">
                Retry
              </button>
            </div>
          `;
        }

        return;
      }
    })();

  <script>
    // =================== FIREBASE IS LOADED GLOBALLY ===================
    // Auth & Firestore are available from HTML

    // =================== STATE ===================
    const state = {
      user: null,
      userProfile: null,
      properties: [],
      leads: [],
      clients: [],
      appointments: [],
      deals: [],
      notifications: [],
      transactions: [],
      currentPage: 'dashboard',
      editingPropertyId: null,
      filters: {
        properties: { type: '', status: '', search: '' },
        leads: { status: '', search: '' },
        clients: { type: '', search: '' },
        appointments: { status: '', search: '' }
      },
      unsubscribers: [],
      initialized: false
    };

    // =================== AUTH SERVICE ===================
    const AuthService = {
      async init() {
        firebase.auth().onAuthStateChanged(async (user) => {
          if (user) {
            state.user = user;

            try {
              const profileDoc = await firebase.firestore()
                .collection('users')
                .doc(user.uid)
                .get();

              if (profileDoc.exists) {
                state.userProfile = {
                  id: user.uid,
                  ...profileDoc.data()
                };
              } else {
                state.userProfile = {
                  id: user.uid,
                  name: user.displayName || user.email?.split('@')[0] || 'User',
                  email: user.email,
                  role: 'buyer',
                  avatar: getInitials(user.displayName || user.email),
                  createdAt: Date.now(),
                  memberSince: new Date().toLocaleDateString('en', {
                    month: 'short',
                    year: 'numeric'
                  })
                };
              }

              setupUI();
              subscribeToData();

            } catch (err) {
              console.error('Profile load error:', err);
              UI.toast('Failed to load profile', 'error');
            }

          } else {
            window.location.href = '../sign-in.html';
          }
        });
      },

      async logout() {
        try {
          await firebase.auth().signOut();

          state.unsubscribers.forEach(unsub => unsub());
          state.unsubscribers = [];

          window.location.href = '../sign-in.html';

        } catch (err) {
          UI.toast('Failed to sign out', 'error');
        }
      }
    };


    // =================== FIRESTORE SERVICE ===================
    const FirestoreService = {

      subscribeToData() {
        const uid = state.user.uid;
        const role = state.userProfile?.role || 'buyer';

        let propsQuery;

        if (role === 'buyer') {

          propsQuery = firebase.firestore()
            .collection('properties')
            .where('status', '==', 'Active');

        } else {

          propsQuery = firebase.firestore()
            .collection('properties')
            .where('ownerId', '==', uid);

        }

        const unsubProps = propsQuery.onSnapshot((snap) => {

          state.properties = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          if (state.initialized) {
            renderPage();
          } else {
            state.initialized = true;
            renderPage();
          }

        });

        state.unsubscribers.push(unsubProps);


        const leadsQuery = firebase.firestore()
          .collection('leads')
          .where('ownerId', '==', uid);

        const unsubLeads = leadsQuery.onSnapshot((snap) => {

          state.leads = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          renderPage();

        });

        state.unsubscribers.push(unsubLeads);


        const clientsQuery = firebase.firestore()
          .collection('clients')
          .where('ownerId', '==', uid);

        const unsubClients = clientsQuery.onSnapshot((snap) => {

          state.clients = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          renderPage();

        });

        state.unsubscribers.push(unsubClients);


        const apptsQuery = firebase.firestore()
          .collection('appointments')
          .where('ownerId', '==', uid);

        const unsubAppts = apptsQuery.onSnapshot((snap) => {

          state.appointments = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          renderPage();

        });

        state.unsubscribers.push(unsubAppts);


        const dealsQuery = firebase.firestore()
          .collection('deals')
          .where('ownerId', '==', uid);

        const unsubDeals = dealsQuery.onSnapshot((snap) => {

          state.deals = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          renderPage();

        });

        state.unsubscribers.push(unsubDeals);


        const notifsQuery = firebase.firestore()
          .collection('notifications')
          .where('userId', '==', uid);

        const unsubNotifs = notifsQuery.onSnapshot((snap) => {

          state.notifications = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          updateNotifBadge();
          renderPage();

        });

        state.unsubscribers.push(unsubNotifs);


        const transQuery = firebase.firestore()
          .collection('transactions')
          .where('ownerId', '==', uid);

        const unsubTrans = transQuery.onSnapshot((snap) => {

          state.transactions = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          renderPage();

        });

        state.unsubscribers.push(unsubTrans);
      },

      async add(collectionName, data) {

        try {

          const docRef = await firebase.firestore()
            .collection(collectionName)
            .add({
              ...data,
              ownerId: state.user.uid,
              userId: state.user.uid,
              createdAt: Date.now(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

          return docRef.id;

        } catch (err) {

          console.error(`Add error for ${collectionName}:`, err);
          UI.toast('Failed to save data', 'error');
          throw err;

        }
      },

      async update(collectionName, id, data) {

        try {

          await firebase.firestore()
            .collection(collectionName)
            .doc(id)
            .update({
              ...data,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

        } catch (err) {

          console.error(`Update error for ${collectionName}/${id}:`, err);
          UI.toast('Failed to update data', 'error');
          throw err;

        }
      },

      async remove(collectionName, id) {

        try {

          await firebase.firestore()
            .collection(collectionName)
            .doc(id)
            .delete();

        } catch (err) {

          console.error(`Delete error for ${collectionName}/${id}:`, err);
          UI.toast('Failed to delete data', 'error');
          throw err;

        }
      }
    };


    // =================== UI SERVICE ===================
    const UI = {

      toast(message, type = 'info', duration = 4000) {

        const container = document.getElementById('toastContainer');

        const toast = document.createElement('div');

        toast.className = `toast ${type}`;

        const icons = {
          success: 'fa-check',
          error: 'fa-times',
          info: 'fa-info',
          warning: 'fa-exclamation'
        };

        toast.innerHTML = `
          <div class="toast-icon">
            <i class="fas ${icons[type]}"></i>
          </div>

          <div class="flex-1">
            <p class="text-sm font-semibold text-gray-900">
              ${type.charAt(0).toUpperCase() + type.slice(1)}
            </p>

            <p class="text-sm text-gray-600 mt-0.5">
              ${message}
            </p>
          </div>

          <button
            onclick="this.parentElement.classList.add('hiding'); setTimeout(() => this.parentElement.remove(), 300)"
            class="text-gray-400 hover:text-gray-600 p-1">

            <i class="fas fa-times text-xs"></i>

          </button>
        `;

        container.appendChild(toast);

        setTimeout(() => {

          if (toast.parentElement) {

            toast.classList.add('hiding');

            setTimeout(() => toast.remove(), 300);

          }

        }, duration);
      },

      confirm({
        title = 'Are you sure?',
        message = 'This action cannot be undone.',
        confirmText = 'Confirm',
        danger = true,
        icon = 'fa-exclamation-triangle'
      } = {}) {

        return new Promise((resolve) => {

          document.getElementById('confirmTitle').textContent = title;
          document.getElementById('confirmMessage').textContent = message;

          const actionBtn = document.getElementById('confirmAction');

          actionBtn.textContent = confirmText;

          actionBtn.className = danger
            ? 'btn btn-danger'
            : 'btn btn-primary';

          const iconEl = document.getElementById('confirmIcon');

          iconEl.className =
            `w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 ${
              danger
                ? 'bg-red-100 text-red-600'
                : 'bg-blue-100 text-blue-600'
            }`;

          iconEl.innerHTML =
            `<i class="fas ${icon} text-xl"></i>`;

          const modal =
            document.getElementById('confirmModal');

          modal.classList.remove('hidden');

          const cleanup = (result) => {

            modal.classList.add('hidden');
            actionBtn.onclick = null;
            resolve(result);

          };

          actionBtn.onclick = () => cleanup(true);

          modal.onclick = (e) => {

            if (e.target === modal) {
              cleanup(false);
            }

          };

        });
      },

      showModal(id) {

        document.getElementById(id).classList.remove('hidden');
        document.body.style.overflow = 'hidden';

      },

      hideModal(id) {

        document.getElementById(id).classList.add('hidden');
        document.body.style.overflow = '';

      },

      showLoader(container) {

        container.innerHTML = `
          <div class="dashboard-content">

            <div class="space-y-4">

              <div class="skeleton h-56 w-full"></div>

              <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                ${Array(4)
                  .fill('<div class="skeleton h-36"></div>')
                  .join('')}
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

                <div class="lg:col-span-2 skeleton h-80"></div>

                <div class="skeleton h-80"></div>

              </div>

            </div>

          </div>
        `;
      }
    };


    // =================== HELPERS ===================

    function formatCurrency(n) {

      if (!n || isNaN(n)) {
        return '₦0';
      }

      if (n >= 1000000000) {
        return '₦' + (n / 1000000000).toFixed(1) + 'B';
      }

      if (n >= 1000000) {
        return '₦' + (n / 1000000).toFixed(1) + 'M';
      }

      if (n >= 1000) {
        return '₦' + (n / 1000).toFixed(0) + 'K';
      }

      return '₦' + n.toLocaleString();
    }


    function formatMoney(n) {

      if (!n || isNaN(n)) {
        return '₦0';
      }

      return '₦' + Number(n).toLocaleString();
    }


    function getInitials(name) {

      if (!name) {
        return 'U';
      }

      return name
        .split(' ')
        .map(n => n[0])
        .join('')
        .toUpperCase()
        .slice(0, 2);
    }


    function escapeHtml(s) {

      if (!s) {
        return '';
      }

      return String(s).replace(
        /[&<>"']/g,
        m => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m])
      );
    }


    function statusBadge(status) {

      const map = {
        'Active': 'badge-active',
        'Pending': 'badge-pending',
        'Sold': 'badge-sold',
        'Rented': 'badge-rented',
        'Featured': 'badge-featured',
        'New': 'badge-new',
        'Contacted': 'badge-pending',
        'Qualified': 'badge-active',
        'Negotiating': 'badge-rented',
        'Closed': 'badge-neutral',
        'Confirmed': 'badge-active',
        'Closed Won': 'badge-active',
        'Closed Lost': 'badge-danger',
        'Proposal': 'badge-sold',
        'Initial Contact': 'badge-new',
        'Negotiation': 'badge-pending',
        'Paid': 'badge-active',
        'Processing': 'badge-pending',
        'VIP': 'badge-vip',
        'Inactive': 'badge-neutral'
      };

      return map[status] || 'badge-neutral';
    }


    function typeBadge(type) {

      return type === 'Buy' || type === 'Sale'
        ? 'badge-sold'
        : type === 'Rent' || type === 'Rental'
          ? 'badge-rented'
          : 'badge-neutral';
    }


    function updateNotifBadge() {

      const unread =
        state.notifications.filter(n => !n.read).length;

      const dot =
        document.getElementById('headerNotifDot');

      if (dot) {
        dot.classList.toggle(
          'hidden',
          unread === 0
        );
      }

      const sidebarDot =
        document.getElementById('sidebarNotifDot');

      if (sidebarDot) {
        sidebarDot.classList.toggle(
          'hidden',
          unread === 0
        );
      }
    }


    function getGreeting() {

      const hour = new Date().getHours();

      if (hour < 12) {
        return 'Good morning';
      }

      if (hour < 17) {
        return 'Good afternoon';
      }

      return 'Good evening';
    }


    function getMonthKey(date) {

      return `${date.getFullYear()}-${String(
        date.getMonth() + 1
      ).padStart(2, '0')}`;
    }


    function getLastSixMonths() {

      const months = [];

      const now = new Date();

      for (let i = 5; i >= 0; i--) {

        const date = new Date(
          now.getFullYear(),
          now.getMonth() - i,
          1
        );

        months.push({
          key: getMonthKey(date),
          label: date.toLocaleString('en', {
            month: 'short'
          })
        });

      }

      return months;
    }


    function getTransactionDate(transaction) {

      const raw =
        transaction.createdAt ||
        transaction.date ||
        transaction.paidAt ||
        transaction.timestamp;

      if (!raw) {
        return null;
      }

      if (
        typeof raw === 'object' &&
        typeof raw.toDate === 'function'
      ) {
        return raw.toDate();
      }

      if (typeof raw === 'number') {
        return new Date(
          raw < 10000000000
            ? raw * 1000
            : raw
        );
      }

      const parsed = new Date(raw);

      return isNaN(parsed.getTime())
        ? null
        : parsed;
    }


    function getRevenueByMonth() {

      const months = getLastSixMonths();

      return months.map(month => {

        const total = state.transactions
          .filter(transaction => {

            if (transaction.status !== 'Paid') {
              return false;
            }

            const date =
              getTransactionDate(transaction);

            if (!date) {
              return false;
            }

            return getMonthKey(date) === month.key;

          })
          .reduce(
            (sum, transaction) =>
              sum + Number(transaction.amount || 0),
            0
          );

        return total;

      });
    }

              <span
                id="sidebarNotifDot"
                class="notif-dot hidden ml-auto">
              </span>

            </a>

            <a
              href="settings.html"
              class="sidebar-link">

              <i class="fas fa-sliders"></i>
              <span>Settings</span>

            </a>

          `;

        }

      }


      updateSidebarStats();


      const app =
        document.getElementById(
          'app'
        );

      if (app) {
        app.classList.remove(
          'hidden'
        );
      }


      const loading =
        document.getElementById(
          'loadingScreen'
        );

      if (loading) {
        loading.classList.add(
          'hidden'
        );
      }

    }


    function updateSidebarStats() {

      const stat1 =
        document.getElementById(
          'sidebarStat1'
        );

      const stat2 =
        document.getElementById(
          'sidebarStat2'
        );


      if (agent === 'agent') {

        if (stat1) {
          stat1.textContent =
            state.properties.length;
        }

        if (stat2) {
          stat2.textContent =
            state.appointments.filter(
              a =>
                a.status === 'Confirmed'
            ).length;
        }

      } else {

        if (stat1) {
          stat1.textContent =
            state.properties.filter(
              p => p.saved
            ).length;
        }

        if (stat2) {
          stat2.textContent =
            state.appointments.filter(
              a =>
                a.status === 'Confirmed'
            ).length;
        }

      }

      updateNotifBadge();
    }


    function subscribeToData() {

      if (
        roleMismatch ||
        !state.user ||
        !state.userProfile
      ) {
        return;
      }

      FirestoreService.subscribeToData();
    }


    function renderPage() {

      const content =
        document.getElementById(
          'page-content'
        );

      if (!content) {
        return;
      }


      if (!state.initialized) {

        UI.showLoader(content);

        return;
      }


      content.className =
        'min-h-[calc(100vh-82px)] animate-fade';


      if (agent === 'agent') {

        renderAgentDashboard(
          content
        );

      } else {

        renderBuyerDashboard(
          content
        );

      }


      updateSidebarStats();


      const loading =
        document.getElementById(
          'loadingScreen'
        );

      if (loading) {
        loading.classList.add(
          'hidden'
        );
      }

    }


    window.navigate =
      function (page) {

        const target =
          ROUTES[page] ||
          ROUTES.dashboard;

        window.location.href =
          target;
      };


    window.toggleSidebar =
      function () {

        const sidebar =
          document.getElementById(
            'sidebar'
          );

        const backdrop =
          document.getElementById(
            'sidebarBackdrop'
          );

        if (
          !sidebar ||
          !backdrop
        ) {
          return;
        }

        sidebar.classList.toggle(
          'open'
        );

        sidebar.classList.toggle(
          '-translate-x-full'
        );

        backdrop.classList.toggle(
          'hidden'
        );
      };


    window.handleLogout =
      async function () {

        const ok =
          await UI.confirm({

            title: 'Sign out?',

            message:
              'You will need to sign in again to access your dashboard.',

            confirmText:
              'Sign Out',

            icon:
              'fa-sign-out-alt'

          });

        if (ok) {
          await AuthService.logout();
        }
      };


    AuthService.logout =
      async function () {

        try {

          await firebase
            .auth()
            .signOut();

          state.unsubscribers.forEach(
            unsub => {

              try {
                unsub();
              } catch (error) {
                console.warn(
                  'MoonLat unsubscribe failed:',
                  error
                );
              }

            }
          );

          state.unsubscribers = [];

          window.location.href =
            '../sign-in.html';

        } catch (err) {

          console.error(
            'Sign out error:',
            err
          );

          UI.toast(
            'Failed to sign out',
            'error'
          );

        }
      };


    document.addEventListener(
      'keydown',
      (event) => {

        if (event.key !== 'Escape') {
          return;
        }

        ['confirmModal'].forEach(
          id => {

            const modal =
              document.getElementById(
                id
              );

            if (
              modal &&
              !modal.classList.contains(
                'hidden'
              )
            ) {
              UI.hideModal(id);
            }

          }
        );

      }
    );


    document.addEventListener(
      'click',
      (event) => {

        const modal =
          event.target.closest(
            '#confirmModal'
          );

        if (
          modal &&
          event.target === modal
        ) {
          UI.hideModal(
            'confirmModal'
          );
        }

      }
    );


    document.addEventListener(
      'DOMContentLoaded',
      () => {

        const search =
          document.getElementById(
            'globalSearch'
          );

        if (search) {

          search.addEventListener(
            'keydown',
            (event) => {

              if (
                event.key === 'Enter'
              ) {

                const query =
                  search.value.trim();

                if (
                  query.length >= 1
                ) {

                  window.location.href =
                    agent === 'buyer'
                      ? `explore-property.html?q=${encodeURIComponent(query)}`
                      : `manager.html?q=${encodeURIComponent(query)}`;

                }

              }

            }
          );

        }

      }
    );


    function standaloneDashboardInit() {
      AuthService.init();
    }


    document.addEventListener(
      'DOMContentLoaded',
      standaloneDashboardInit
    );


    window.UI = UI;
    window.FirestoreService =
      FirestoreService;
    window.AuthService =
      AuthService;

  </script>

</body>
</html>
