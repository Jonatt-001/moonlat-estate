<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Browse Properties - MoonLat</title>

    <meta
        name="description"
        content="Browse available properties on MoonLat. Search, filter, compare locations and save properties you're interested in."
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    },

                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        }
                    },

                    boxShadow: {
                        soft: '0 10px 40px rgba(15, 23, 42, 0.06)',
                        premium: '0 20px 60px rgba(15, 23, 42, 0.10)'
                    }
                }
            }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",
            authDomain: "moonlat-estate-dashboard.firebaseapp.com",
            projectId: "moonlat-estate-dashboard",
            storageBucket: "moonlat-estate-dashboard.firebasestorage.app",
            messagingSenderId: "289878951289",
            appId: "1:289878951289:web:18db63e3ab8f071b811ba8"
        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();
        const auth = firebase.auth();
    </script>

    <style>

        * {
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(37, 99, 235, 0.06),
                    transparent 30%
                ),
                #f8fafc;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            -webkit-appearance: none;
        }

        ::selection {
            background: rgba(37, 99, 235, 0.18);
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        .map-shell {
            min-height: 420px;
        }

        .leaflet-control-attribution {
            font-size: 8px !important;
            opacity: .7;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, .16);
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            min-width: 220px;
        }

        .leaflet-popup-tip {
            box-shadow: none;
        }

        .custom-property-marker {
            background: transparent;
            border: 0;
        }

        .marker-pin {
            width: 38px;
            height: 38px;
            border-radius: 50% 50% 50% 0;
            background: #2563eb;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 7px 18px rgba(37, 99, 235, .34),
                0 0 0 4px rgba(255, 255, 255, .85);
        }

        .marker-pin::after {
            content: '';
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: white;
        }

        .marker-pin.featured {
            background: #0f172a;
            box-shadow:
                0 7px 18px rgba(15, 23, 42, .34),
                0 0 0 4px rgba(255, 255, 255, .85);
        }

        .property-card {
            transition:
                transform .22s ease,
                box-shadow .22s ease,
                border-color .22s ease;
        }

        .property-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px rgba(15, 23, 42, .09);
        }

        .property-card:active {
            transform: scale(.995);
        }

        .favorite-btn {
            transition:
                transform .18s ease,
                background .18s ease,
                color .18s ease,
                border-color .18s ease;
        }

        .favorite-btn:active {
            transform: scale(.92);
        }

        .favorite-btn.active {
            color: #e11d48;
            background: #fff1f2;
            border-color: #fecdd3;
        }

        .favorite-btn.active i {
            font-weight: 900;
        }

        .filter-chip {
            transition:
                background .18s ease,
                color .18s ease,
                border-color .18s ease,
                transform .18s ease;
        }

        .filter-chip:active {
            transform: scale(.97);
        }

        .filter-chip.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .sheet-backdrop {
            background: rgba(2, 6, 23, .62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sheet-enter {
            animation: sheetEnter .25s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes sheetEnter {

            from {
                opacity: 0;
                transform: translateY(100%);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .fade-up {
            animation: fadeUp .3s ease both;
        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .skeleton {
            background:
                linear-gradient(
                    90deg,
                    #e2e8f0 25%,
                    #f1f5f9 37%,
                    #e2e8f0 63%
                );

            background-size: 400% 100%;

            animation: skeleton 1.4s ease infinite;
        }

        @keyframes skeleton {

            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }

        }

        .toast-enter {
            animation: toastEnter .25s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes toastEnter {

            from {
                opacity: 0;
                transform: translate(-50%, -10px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }

        }

        .mobile-bottom-nav {
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .desktop-only {
            display: none;
        }

        @media (min-width: 1024px) {

            .desktop-only {
                display: block;
            }

            body {
                padding-bottom: 0;
            }

        }

        @media (max-width: 1023px) {

            body {
                padding-bottom: 84px;
            }

        }

    </style>

</head>


<body class="text-slate-900 font-sans antialiased">


    <!-- =========================================================
         APPLICATION SHELL
    ========================================================== -->

    <div class="min-h-screen">


        <!-- =====================================================
             DESKTOP / MOBILE HEADER
        ====================================================== -->

        <header
            class="sticky top-0 z-[1000] bg-white/92 backdrop-blur-xl border-b border-slate-200/80"
        >

            <div class="max-w-[1500px] mx-auto px-4 sm:px-6 lg:px-8">

                <div class="h-[68px] flex items-center gap-3">


                    <!-- Back -->
                    <a
                        href="index.html"
                        class="w-10 h-10 rounded-full border border-slate-200 bg-white flex items-center justify-center text-slate-600 hover:text-slate-950 hover:border-slate-300 transition shrink-0"
                        aria-label="Back to buyer dashboard"
                    >
                        <i class="fas fa-arrow-left text-sm"></i>
                    </a>


                    <!-- Title -->
                    <div class="min-w-0 flex-1">

                        <p
                            class="text-[10px] uppercase tracking-[0.18em] font-extrabold text-primary-600"
                        >
                            Buyer Dashboard
                        </p>

                        <h1
                            class="text-base sm:text-lg font-extrabold tracking-tight text-slate-950 truncate"
                        >
                            Browse Properties
                        </h1>

                    </div>


                    <!-- Desktop view toggle -->
                    <div
                        class="hidden md:flex items-center gap-1 p-1 rounded-xl bg-slate-100 border border-slate-200"
                    >

                        <button
                            id="desktopListToggle"
                            onclick="setViewMode('list')"
                            class="view-toggle px-3.5 py-2 rounded-lg text-xs font-extrabold text-slate-600"
                        >
                            <i class="fas fa-list mr-1.5"></i>
                            List
                        </button>

                        <button
                            id="desktopMapToggle"
                            onclick="setViewMode('map')"
                            class="view-toggle px-3.5 py-2 rounded-lg text-xs font-extrabold text-slate-600"
                        >
                            <i class="fas fa-map mr-1.5"></i>
                            Map
                        </button>

                    </div>


                    <!-- Saved -->
                    <a
                        href="saved-property.html"
                        class="relative w-10 h-10 rounded-full border border-slate-200 bg-white flex items-center justify-center text-slate-600 hover:text-rose-600 hover:border-rose-200 transition shrink-0"
                        aria-label="Saved properties"
                    >

                        <i class="far fa-heart text-sm"></i>

                        <span
                            id="savedCount"
                            class="hidden absolute -top-1 -right-1 min-w-[19px] h-[19px] px-1 rounded-full bg-rose-500 text-white text-[9px] font-extrabold items-center justify-center border-2 border-white"
                        >
                            0
                        </span>

                    </a>

                </div>

            </div>

        </header>


        <!-- =====================================================
             MAIN
        ====================================================== -->

        <main class="max-w-[1500px] mx-auto px-3 sm:px-5 lg:px-8 py-4 lg:py-7">


            <!-- =================================================
                 SEARCH / CONTROL AREA
            ================================================== -->

            <section class="mb-4 lg:mb-6">

                <div class="flex flex-col lg:flex-row lg:items-end gap-3 lg:gap-5">


                    <!-- Search -->
                    <div class="flex-1">

                        <label
                            for="searchInput"
                            class="sr-only"
                        >
                            Search properties
                        </label>

                        <div class="relative">

                            <span
                                class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
                            >
                                <i class="fas fa-search"></i>
                            </span>


                            <input
                                type="search"
                                id="searchInput"
                                autocomplete="off"
                                enterkeyhint="search"
                                class="w-full h-13 rounded-2xl border border-slate-200 bg-white pl-11 pr-24 text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none shadow-soft focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition"
                                placeholder="Search location, property name or type..."
                            >


                            <button
                                id="clearSearchBtn"
                                onclick="clearSearch()"
                                class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-xl bg-slate-100 text-slate-500 hover:bg-slate-200 transition items-center justify-center"
                                aria-label="Clear search"
                            >
                                <i class="fas fa-xmark text-xs"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Sort -->
                    <div class="flex gap-2">


                        <button
                            onclick="openFilterSheet()"
                            class="flex-1 lg:flex-none h-13 px-4 rounded-2xl border border-slate-200 bg-white text-slate-700 text-xs sm:text-sm font-extrabold shadow-soft hover:border-slate-300 transition flex items-center justify-center gap-2"
                        >

                            <i class="fas fa-sliders"></i>

                            <span>
                                Filters
                            </span>

                            <span
                                id="filterCountBadge"
                                class="hidden min-w-[20px] h-5 px-1.5 rounded-full bg-primary-600 text-white text-[9px] items-center justify-center"
                            >
                                0
                            </span>

                        </button>


                        <button
                            onclick="openSortSheet()"
                            class="flex-1 lg:flex-none h-13 px-4 rounded-2xl border border-slate-200 bg-white text-slate-700 text-xs sm:text-sm font-extrabold shadow-soft hover:border-slate-300 transition flex items-center justify-center gap-2"
                        >

                            <i class="fas fa-arrow-down-wide-short"></i>

                            <span>
                                Sort
                            </span>

                        </button>

                    </div>

                </div>


                <!-- Quick filters -->
                <div
                    class="flex gap-2 overflow-x-auto no-scrollbar mt-3"
                >

                    <button
                        onclick="setQuickFilter('all')"
                        data-quick-filter="all"
                        class="filter-chip active whitespace-nowrap px-4 py-2.5 rounded-xl border border-slate-900 bg-slate-950 text-white text-xs font-extrabold"
                    >
                        All
                    </button>


                    <button
                        onclick="setQuickFilter('Apartment')"
                        data-quick-filter="Apartment"
                        class="filter-chip whitespace-nowrap px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                    >
                        Apartments
                    </button>


                    <button
                        onclick="setQuickFilter('Villa')"
                        data-quick-filter="Villa"
                        class="filter-chip whitespace-nowrap px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                    >
                        Villas
                    </button>


                    <button
                        onclick="setQuickFilter('House')"
                        data-quick-filter="House"
                        class="filter-chip whitespace-nowrap px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                    >
                        Houses
                    </button>


                    <button
                        onclick="setQuickFilter('featured')"
                        data-quick-filter="featured"
                        class="filter-chip whitespace-nowrap px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                    >
                        <i class="fas fa-star text-amber-500 mr-1"></i>
                        Featured
                    </button>

                </div>

            </section>


            <!-- =================================================
                 MOBILE VIEW SWITCH
            ================================================== -->

            <div
                class="lg:hidden mb-4 p-1 rounded-2xl bg-slate-100 border border-slate-200 flex"
            >

                <button
                    id="mobileListToggle"
                    onclick="setViewMode('list')"
                    class="flex-1 h-11 rounded-xl bg-white shadow-sm text-slate-950 text-xs font-extrabold flex items-center justify-center gap-2"
                >
                    <i class="fas fa-list"></i>
                    List
                </button>


                <button
                    id="mobileMapToggle"
                    onclick="setViewMode('map')"
                    class="flex-1 h-11 rounded-xl text-slate-500 text-xs font-extrabold flex items-center justify-center gap-2"
                >
                    <i class="fas fa-map-location-dot"></i>
                    Map
                </button>

            </div>


            <!-- =================================================
                 RESULTS META
            ================================================== -->

            <div
                class="flex items-center justify-between gap-3 mb-3"
            >

                <div>

                    <p
                        class="text-[10px] uppercase tracking-[0.18em] font-extrabold text-slate-400"
                    >
                        Available listings
                    </p>

                    <p
                        class="text-sm sm:text-base font-extrabold text-slate-950 mt-0.5"
                    >
                        <span id="resultCount">0</span>
                        <span class="text-slate-400 font-semibold">
                            properties
                        </span>
                    </p>

                </div>


                <button
                    id="resetFiltersBtn"
                    onclick="resetAllFilters()"
                    class="hidden text-xs font-extrabold text-primary-600 hover:text-primary-700"
                >
                    Reset filters
                </button>

            </div>


            <!-- =================================================
                 CONTENT GRID
            ================================================== -->

            <div
                id="browseLayout"
                class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6"
            >


                <!-- =================================================
                     MAP
                ================================================== -->

                <section
                    id="mapPanel"
                    class="hidden lg:block lg:col-span-7"
                >

                    <div
                        class="map-shell sticky top-[88px] h-[calc(100vh-112px)] min-h-[600px] rounded-[28px] overflow-hidden border border-slate-200 bg-slate-200 shadow-soft relative"
                    >

                        <div id="map"></div>


                        <!-- Map floating controls -->

                        <div
                            class="absolute top-4 left-4 z-[500] flex flex-col gap-2"
                        >

                            <button
                                onclick="recenterMap()"
                                class="w-11 h-11 rounded-xl bg-white/95 backdrop-blur shadow-lg border border-slate-200 text-slate-700 flex items-center justify-center hover:bg-white transition"
                                aria-label="Recenter map"
                            >
                                <i class="fas fa-crosshairs text-sm"></i>
                            </button>

                        </div>


                        <!-- Map status -->

                        <div
                            class="absolute bottom-4 left-4 right-4 z-[500] pointer-events-none"
                        >

                            <div
                                class="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-white/95 backdrop-blur border border-slate-200 shadow-lg"
                            >

                                <span
                                    class="w-2 h-2 rounded-full bg-emerald-500"
                                ></span>

                                <span
                                    id="mapResultText"
                                    class="text-[11px] font-extrabold text-slate-700"
                                >
                                    Showing available properties
                                </span>

                            </div>

                        </div>

                    </div>

                </section>


                <!-- =================================================
                     LIST
                ================================================== -->

                <section
                    id="listPanel"
                    class="lg:col-span-5"
                >

                    <div
                        id="propertiesList"
                        class="space-y-3.5 pb-5"
                    >

                        <!-- Loading -->
                        <div
                            id="loadingState"
                            class="space-y-3.5"
                        >

                            <div
                                class="bg-white rounded-[24px] border border-slate-200 overflow-hidden"
                            >

                                <div class="h-52 skeleton"></div>

                                <div class="p-4 space-y-3">

                                    <div class="h-5 w-4/5 rounded skeleton"></div>

                                    <div class="h-4 w-2/5 rounded skeleton"></div>

                                    <div class="h-10 rounded skeleton"></div>

                                </div>

                            </div>


                            <div
                                class="bg-white rounded-[24px] border border-slate-200 overflow-hidden"
                            >

                                <div class="h-52 skeleton"></div>

                                <div class="p-4 space-y-3">

                                    <div class="h-5 w-3/4 rounded skeleton"></div>

                                    <div class="h-4 w-1/2 rounded skeleton"></div>

                                    <div class="h-10 rounded skeleton"></div>

                                </div>

                            </div>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>


    <!-- =========================================================
         FILTER SHEET
    ========================================================== -->

    <div
        id="filterSheet"
        class="hidden fixed inset-0 z-[2000] sheet-backdrop items-end sm:items-center justify-center"
        aria-hidden="true"
    >

        <div
            class="sheet-enter w-full sm:max-w-lg bg-white rounded-t-[30px] sm:rounded-[30px] max-h-[92vh] overflow-hidden shadow-2xl flex flex-col"
        >

            <div
                class="px-5 sm:px-7 pt-4 sm:pt-6 pb-4 border-b border-slate-100 shrink-0"
            >

                <div class="flex justify-center sm:hidden mb-4">
                    <span class="w-11 h-1.5 rounded-full bg-slate-200"></span>
                </div>


                <div class="flex items-start justify-between gap-4">

                    <div>

                        <p
                            class="text-[10px] uppercase tracking-[0.18em] font-extrabold text-primary-600"
                        >
                            Refine results
                        </p>

                        <h2
                            class="text-xl font-extrabold tracking-tight text-slate-950 mt-1"
                        >
                            Property filters
                        </h2>

                    </div>


                    <button
                        onclick="closeFilterSheet()"
                        class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center"
                        aria-label="Close filters"
                    >
                        <i class="fas fa-xmark"></i>
                    </button>

                </div>

            </div>


            <div
                class="overflow-y-auto p-5 sm:p-7 space-y-7"
            >


                <!-- Property type -->

                <div>

                    <label
                        class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-3"
                    >
                        Property type
                    </label>

                    <div class="grid grid-cols-2 gap-2.5">

                        <button
                            onclick="setAdvancedType('all')"
                            data-advanced-type="all"
                            class="advanced-type h-12 rounded-xl border border-slate-900 bg-slate-950 text-white text-xs font-extrabold"
                        >
                            All types
                        </button>

                        <button
                            onclick="setAdvancedType('Apartment')"
                            data-advanced-type="Apartment"
                            class="advanced-type h-12 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                        >
                            Apartment
                        </button>

                        <button
                            onclick="setAdvancedType('Villa')"
                            data-advanced-type="Villa"
                            class="advanced-type h-12 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                        >
                            Villa
                        </button>

                        <button
                            onclick="setAdvancedType('House')"
                            data-advanced-type="House"
                            class="advanced-type h-12 rounded-xl border border-slate-200 bg-white text-slate-600 text-xs font-extrabold"
                        >
                            House
                        </button>

                    </div>

                </div>


                <!-- Price -->

                <div>

                    <label
                        class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-3"
                    >
                        Price range
                    </label>

                    <div class="grid grid-cols-2 gap-3">

                        <div>

                            <label
                                for="minPrice"
                                class="block text-[11px] text-slate-400 mb-1.5"
                            >
                                Minimum
                            </label>

                            <input
                                type="number"
                                id="minPrice"
                                min="0"
                                inputmode="numeric"
                                placeholder="₦0"
                                class="w-full h-12 rounded-xl border border-slate-200 bg-slate-50 px-3 text-sm font-semibold outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10"
                            >

                        </div>


                        <div>

                            <label
                                for="maxPrice"
                                class="block text-[11px] text-slate-400 mb-1.5"
                            >
                                Maximum
                            </label>

                            <input
                                type="number"
                                id="maxPrice"
                                min="0"
                                inputmode="numeric"
                                placeholder="No limit"
                                class="w-full h-12 rounded-xl border border-slate-200 bg-slate-50 px-3 text-sm font-semibold outline-none focus:bg-white focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10"
                            >

                        </div>

                    </div>

                </div>


                <!-- Bedrooms -->

    <script>

        /*
         * =========================================================
         * APPLICATION STATE
         * =========================================================
         */

        let map = null;

        let markers = [];

        let allProperties = [];

        let filteredProperties = [];

        let currentUser = null;

        let currentViewMode = 'list';

        let currentQuickFilter = 'all';

        let currentSort = 'recommended';

        let savedProperties = new Set();

        let advancedFilters = {

            type: 'all',

            minPrice: '',

            maxPrice: '',

            bedrooms: 0,

            featured: false

        };


        const FALLBACK_IMAGE =
            'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=85';


        /*
         * =========================================================
         * INITIALIZATION
         * =========================================================
         */

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                initializeApplication();

            }
        );


        async function initializeApplication() {

            initializeMap();

            setupSearch();

            setupSheetBackdrops();

            updateViewModeUI();


            auth.onAuthStateChanged(
                async user => {

                    if (!user) {

                        window.location.href =
                            '../sign-in.html';

                        return;

                    }


                    currentUser =
                        user;


                    await Promise.allSettled([
                        loadProperties(),
                        loadSavedProperties()
                    ]);

                }
            );

        }


        /*
         * =========================================================
         * MAP
         * =========================================================
         */

        function initializeMap() {

            const mapElement =
                document.getElementById('map');


            if (!mapElement) return;


            map =
                L.map(
                    'map',
                    {
                        zoomControl: false,
                        attributionControl: true
                    }
                )
                .setView(
                    [6.5244, 3.3792],
                    11
                );


            L.tileLayer(
                'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    maxZoom: 19,
                    minZoom: 3,
                    attribution:
                        '&copy; OpenStreetMap contributors'
                }
            )
            .addTo(map);


            L.control
                .zoom({
                    position: 'bottomright'
                })
                .addTo(map);

        }


        function createMarkerIcon(
            property
        ) {

            return L.divIcon({

                className:
                    'custom-property-marker',

                html:
                    `
                        <div
                            class="marker-pin ${
                                property.featured
                                    ? 'featured'
                                    : ''
                            }"
                        ></div>
                    `,

                iconSize:
                    [38, 38],

                iconAnchor:
                    [19, 38],

                popupAnchor:
                    [0, -38]

            });

        }


        function updateMapMarkers() {

            if (!map) return;


            markers.forEach(
                marker => {

                    map.removeLayer(
                        marker
                    );

                }
            );


            markers = [];


            filteredProperties.forEach(
                property => {

                    const lat =
                        Number(
                            property.lat
                        );

                    const lng =
                        Number(
                            property.lng
                        );


                    if (
                        !Number.isFinite(lat) ||
                        !Number.isFinite(lng)
                    ) {

                        return;

                    }


                    const marker =
                        L.marker(
                            [lat, lng],
                            {
                                icon:
                                    createMarkerIcon(
                                        property
                                    )
                            }
                        )
                        .addTo(map);


                    marker.bindPopup(
                        buildMapPopup(
                            property
                        )
                    );


                    marker.on(
                        'click',
                        () => {

                            highlightPropertyCard(
                                property.id
                            );

                        }
                    );


                    markers.push(
                        marker
                    );

                }
            );


            updateMapResultText();

        }


        function buildMapPopup(
            property
        ) {

            const image =
                getPropertyImage(
                    property
                );


            const title =
                escapeHtml(
                    property.title ||
                    'Untitled Property'
                );


            const location =
                escapeHtml(
                    property.location ||
                    'Location unavailable'
                );


            return `

                <div class="w-[245px] overflow-hidden">

                    <div class="h-[125px] bg-slate-100 overflow-hidden">

                        <img
                            src="${escapeAttribute(image)}"
                            alt="${title}"
                            class="w-full h-full object-cover"
                            onerror="this.src='${FALLBACK_IMAGE}'"
                        >

                    </div>


                    <div class="p-3.5">

                        <div class="flex items-start justify-between gap-2">

                            <div class="min-w-0">

                                ${
                                    property.featured
                                        ? `
                                            <span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider text-amber-700 mb-1">
                                                <i class="fas fa-star"></i>
                                                Featured
                                            </span>
                                        `
                                        : ''
                                }

                                <p class="font-extrabold text-slate-950 text-sm truncate">
                                    ${title}
                                </p>

                                <p class="text-[10px] text-slate-500 mt-1 truncate">
                                    ${location}
                                </p>

                            </div>

                        </div>


                        <div class="flex items-center justify-between gap-2 mt-3">

                            <p class="font-extrabold text-slate-950 text-sm">
                                ₦${formatPrice(property.price)}
                            </p>


                            <button
                                onclick="viewProperty('${escapeAttribute(property.id)}')"
                                class="px-3 py-2 rounded-lg bg-slate-950 text-white text-[10px] font-extrabold"
                            >
                                View
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }


        function recenterMap() {

            if (!map) return;


            if (markers.length === 1) {

                map.setView(
                    markers[0].getLatLng(),
                    15
                );

                return;

            }


            if (markers.length > 1) {

                const group =
                    new L.featureGroup(
                        markers
                    );


                map.fitBounds(
                    group.getBounds().pad(.12)
                );

                return;

            }


            map.setView(
                [6.5244, 3.3792],
                11
            );

        }


        /*
         * =========================================================
         * FIREBASE PROPERTIES
         * =========================================================
         */

        async function loadProperties() {

            showLoadingState();


            try {

                const snapshot =
                    await db
                        .collection('properties')
                        .where(
                            'status',
                            '==',
                            'Active'
                        )
                        .get();


                allProperties =
                    snapshot.docs
                        .map(
                            doc => ({
                                id:
                                    doc.id,
                                ...doc.data()
                            })
                        );


                filteredProperties =
                    [...allProperties];


                applyAllFilters();


            } catch (error) {

                console.error(
                    'Error loading properties:',
                    error
                );


                showErrorState();

                showToast(
                    'Unable to load properties.',
                    'error'
                );

            }

        }


        async function loadSavedProperties() {

            if (!currentUser) return;


            try {

                const snapshot =
                    await db
                        .collection('users')
                        .doc(
                            currentUser.uid
                        )
                        .collection('savedProperties')
                        .get();


                savedProperties.clear();


                snapshot.forEach(
                    doc => {

                        savedProperties.add(
                            doc.id
                        );

                    }
                );


                updateSavedCount();

                renderProperties();

            } catch (error) {

                console.error(
                    'Error loading saved properties:',
                    error
                );

            }

        }


        /*
         * =========================================================
         * FILTER ENGINE
         * =========================================================
         */

        function applyAllFilters() {

            let results =
                [...allProperties];


            const query =
                document
                    .getElementById(
                        'searchInput'
                    )
                    ?.value
                    .toLowerCase()
                    .trim() ||
                '';


            /*
             * Search
             */

            if (query) {

                results =
                    results.filter(
                        property => {

                            const haystack =
                                [
                                    property.title,
                                    property.location,
                                    property.type,
                                    property.description,
                                    property.city,
                                    property.state,
                                    property.address
                                ]
                                .filter(Boolean)
                                .join(' ')
                                .toLowerCase();


                            return haystack.includes(
                                query
                            );

                        }
                    );

            }


            /*
             * Quick type filter
             */

            if (
                currentQuickFilter !==
                'all'
            ) {

                if (
                    currentQuickFilter ===
                    'featured'
                ) {

                    results =
                        results.filter(
                            property =>
                                property.featured ===
                                true
                        );

                } else {

                    results =
                        results.filter(
                            property =>
                                normalizeType(
                                    property.type
                                ) ===
                                normalizeType(
                                    currentQuickFilter
                                )
                        );

                }

            }


            /*
             * Advanced type
             */

            if (
                advancedFilters.type !==
                'all'
            ) {

                results =
                    results.filter(
                        property =>
                            normalizeType(
                                property.type
                            ) ===
                            normalizeType(
                                advancedFilters.type
                            )
                    );

            }


            /*
             * Minimum price
             */

            const minPrice =
                Number(
                    advancedFilters.minPrice
                );


            if (
                advancedFilters.minPrice !== '' &&
                Number.isFinite(minPrice)
            ) {

                results =
                    results.filter(
                        property =>
                            Number(
                                property.price || 0
                            ) >=
                            minPrice
                    );

            }


            /*
             * Maximum price
             */

            const maxPrice =
                Number(
                    advancedFilters.maxPrice
                );


            if (
                advancedFilters.maxPrice !== '' &&
                Number.isFinite(maxPrice)
            ) {

                results =
                    results.filter(
                        property =>
                            Number(
                                property.price || 0
                            ) <=
                            maxPrice
                    );

            }


            /*
             * Bedrooms
             */

            if (
                Number(
                    advancedFilters.bedrooms
                ) > 0
            ) {

                results =
                    results.filter(
                        property =>
                            Number(
                                property.beds || 0
                            ) >=
                            Number(
                                advancedFilters.bedrooms
                            )
                    );

            }


            /*
             * Featured
             */

            if (
                advancedFilters.featured
            ) {

                results =
                    results.filter(
                        property =>
                            property.featured ===
                            true
                    );

            }


            /*
             * Sorting
             */

            results =
                sortProperties(
                    results
                );


            filteredProperties =
                results;


            renderProperties();

            updateMapMarkers();

            updateResultMeta();

        }


        function sortProperties(
            properties
        ) {

            const results =
                [...properties];


            if (
                currentSort ===
                'price-low'
            ) {

                return results.sort(
                    (a, b) =>
                        Number(
                            a.price || 0
                        ) -
                        Number(
                            b.price || 0
                        )
                );

            }


            if (
                currentSort ===
                'price-high'
            ) {

                return results.sort(
                    (a, b) =>
                        Number(
                            b.price || 0
                        ) -
                        Number(
                            a.price || 0
                        )
                );

            }


            if (
                currentSort ===
                'beds'
            ) {

                return results.sort(
                    (a, b) =>
                        Number(
                            b.beds || 0
                        ) -
                        Number(
                            a.beds || 0
                        )
                );

            }


            if (
                currentSort ===
                'newest'
            ) {

                return results.sort(
                    (
                        a,
                        b
                    ) =>
                        getTimestampMillis(
                            b.createdAt
                        ) -
                        getTimestampMillis(
                            a.createdAt
                        )
                );

            }


            /*
             * Recommended:
             *
             * Featured first, then verified,
             * then newer properties.
             */

            return results.sort(
                (a, b) => {

                    const scoreA =
                        getRecommendationScore(
                            a
                        );

                    const scoreB =
                        getRecommendationScore(
                            b
                        );


                    return scoreB - scoreA;

                }
            );

        }


        function getRecommendationScore(
            property
        ) {

            let score = 0;


            if (
                property.featured ===
                true
            ) {

                score += 100;

            }


            if (
                property.verified ===
                true
            ) {

                score += 30;

            }


            score +=
                Math.min(
                    20,
                    Number(
                        property.beds ||
                        0
                    ) *
                    2
                );


            const created =
                getTimestampMillis(
                    property.createdAt
                );


            if (
                created
            ) {

                const ageDays =
                    Math.max(
                        0,
                        (
                            Date.now() -
                            created
                        ) /
                        86400000
                    );


                score +=
                    Math.max(
                        0,
                        20 -
                        ageDays
                    );

            }


            return score;

        }


        function normalizeType(
            value
        ) {

            return String(
                value ||
                ''
            )
            .trim()
            .toLowerCase();

        }


        /*
         * =========================================================
         * RENDER PROPERTIES
         * =========================================================
         */

        function renderProperties() {

            const container =
                document.getElementById(
                    'propertiesList'
                );


            if (!container) return;


            if (
                !filteredProperties.length
            ) {

                renderEmptyState();

                return;

            }


            container.innerHTML =
                filteredProperties
                    .map(
                        (
                            property,
                            index
                        ) =>
                            buildPropertyCard(
                                property,
                                index
                            )
                    )
                    .join('');

        }


        function buildPropertyCard(
            property,
            index
        ) {

            const image =
                getPropertyImage(
                    property
                );


            const title =
                escapeHtml(
                    property.title ||
                    'Untitled Property'
                );


            const location =
                escapeHtml(
                    property.location ||
                    'Location unavailable'
                );


            const type =
                escapeHtml(
                    property.type ||
                    'Property'
                );


            const price =
                formatPrice(
                    property.price
                );


            const saved =
                savedProperties.has(
                    property.id
                );


            const verified =
                property.verified ===

        function getPropertyImage(
            property
        ) {

            if (
                property &&
                Array.isArray(
                    property.images
                )
            ) {

                const first =
                    property.images.find(
                        image =>
                            typeof image ===
                            'string' &&
                            image.trim()
                    );


                if (first) {

                    return first;

                }

            }


            if (
                property &&
                typeof property.image ===
                'string' &&
                property.image.trim()
            ) {

                return property.image;

            }


            return FALLBACK_IMAGE;

        }

        function setupSearch() {

            const input =
                document.getElementById(
                    'searchInput'
                );


            if (!input) return;


            let searchTimer =
                null;


            input.addEventListener(
                'input',
                () => {

                    const value =
                        input.value.trim();


                    const clearButton =
                        document.getElementById(
                            'clearSearchBtn'
                        );


                    if (clearButton) {

                        if (value) {

                            clearButton.classList.remove(
                                'hidden'
                            );

                            clearButton.classList.add(
                                'flex'
                            );

                        } else {

                            clearButton.classList.add(
                                'hidden'
                            );

                            clearButton.classList.remove(
                                'flex'
                            );

                        }

                    }


                    clearTimeout(
                        searchTimer
                    );


                    searchTimer =
                        setTimeout(
                            () => {

                                applyAllFilters();

                            },
                            180
                        );

                }
            );


            input.addEventListener(
                'keydown',
                event => {

                    if (
                        event.key ===
                        'Escape'
                    ) {

                        clearSearch();

                    }

                }
            );

        }


        function clearSearch() {

            const input =
                document.getElementById(
                    'searchInput'
                );


            if (!input) return;


            input.value =
                '';


            const clearButton =
                document.getElementById(
                    'clearSearchBtn'
                );


            if (clearButton) {

                clearButton.classList.add(
                    'hidden'
                );

                clearButton.classList.remove(
                    'flex'
                );

            }


            applyAllFilters();

            input.focus();

        }

        function syncAdvancedFilterUI() {

            const minPrice =
                document.getElementById(
                    'minPrice'
                );


            const maxPrice =
                document.getElementById(
                    'maxPrice'
                );


            const featured =
                document.getElementById(
                    'featuredOnly'
                );


            if (minPrice) {

                minPrice.value =
                    advancedFilters.minPrice;

            }


            if (maxPrice) {

                maxPrice.value =
                    advancedFilters.maxPrice;

            }


            if (featured) {

                featured.checked =
                    advancedFilters.featured;

            }


            setAdvancedType(
                advancedFilters.type
            );


            setBedrooms(
                advancedFilters.bedrooms
            );

        }


        function applyAdvancedFilters() {

            const minPrice =
                document.getElementById(
                    'minPrice'
                );


            const maxPrice =
                document.getElementById(
                    'maxPrice'
                );


            const featured =
                document.getElementById(
                    'featuredOnly'
                );


            const minValue =
                minPrice?.value.trim() ||
                '';


            const maxValue =
                maxPrice?.value.trim() ||
                '';


            if (
                minValue !== '' &&
                maxValue !== '' &&
                Number(minValue) >
                Number(maxValue)
            ) {

                showToast(
                    'Minimum price cannot exceed maximum price.',
                    'error'
                );

                return;

            }


            advancedFilters.minPrice =
                minValue;

            advancedFilters.maxPrice =
                maxValue;

            advancedFilters.featured =
                Boolean(
                    featured?.checked
                );


            applyAllFilters();

            closeFilterSheet();

        }

        function setViewMode(
            mode
        ) {

            currentViewMode =
                mode;


            const mapPanel =
                document.getElementById(
                    'mapPanel'
                );


            const listPanel =
                document.getElementById(
                    'listPanel'
                );


            if (
                window.innerWidth <
                1024
            ) {

                if (mode === 'map') {

                    mapPanel.classList.remove(
                        'hidden'
                    );

                    mapPanel.classList.add(
                        'block'
                    );

                    mapPanel.classList.remove(
                        'lg:col-span-7'
                    );


                    listPanel.classList.add(
                        'hidden'
                    );

                } else {

                    mapPanel.classList.add(
                        'hidden'
                    );

                    listPanel.classList.remove(
                        'hidden'
                    );

                }

            } else {

                mapPanel.classList.remove(
                    'hidden'
                );

                listPanel.classList.remove(
                    'hidden'
                );

                mapPanel.classList.add(
                    'lg:col-span-7'
                );

            }


            updateViewModeUI();


            if (mode === 'map') {

                setTimeout(
                    () => {

                        if (map) {

                            map.invalidateSize();

                            recenterMap();

                        }

                    },
                    120
                );

            }

        }


        function updateViewModeUI() {

            const mobileList =
                document.getElementById(
                    'mobileListToggle'
                );


            const mobileMap =
                document.getElementById(
                    'mobileMapToggle'
                );


            const desktopList =
                document.getElementById(
                    'desktopListToggle'
                );


            const desktopMap =
                document.getElementById(
                    'desktopMapToggle'
                );


            const activate =
                (
                    button,
                    active
                ) => {

                    if (!button) return;


                    button.classList.toggle(
                        'bg-white',
                        active
                    );

                    button.classList.toggle(
                        'shadow-sm',
                        active
                    );

                    button.classList.toggle(
                        'text-slate-950',
                        active
                    );

                    button.classList.toggle(
                        'text-slate-500',
                        !active
                    );

                    button.classList.toggle(
                        'bg-slate-950',
                        active &&
                        button.id.startsWith(
                            'desktop'
                        )
                    );

                    button.classList.toggle(
                        'text-white',
                        active &&
                        button.id.startsWith(
                            'desktop'
                        )
                    );

                };


            activate(
                mobileList,
                currentViewMode ===
                'list'
            );


            activate(
                mobileMap,
                currentViewMode ===
                'map'
            );


            activate(
                desktopList,
                currentViewMode ===
                'list'
            );


            activate(
                desktopMap,
                currentViewMode ===
                'map'
            );

        }
