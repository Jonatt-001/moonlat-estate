                    'Please sign in to save properties.',
                    'error'
                );

                return;

            }


            const property =
                allProperties.find(
                    item =>
                        item.id ===
                        propertyId
                );


            if (!property) {

                return;

            }


            const alreadySaved =
                savedProperties.has(
                    propertyId
                );


            try {

                if (alreadySaved) {

                    await db
                        .collection('users')
                        .doc(
                            currentUser.uid
                        )
                        .collection(
                            'savedProperties'
                        )
                        .doc(
                            propertyId
                        )
                        .delete();


                    savedProperties.delete(
                        propertyId
                    );


                    showToast(
                        'Removed from saved properties.'
                    );

                } else {

                    await db
                        .collection('users')
                        .doc(
                            currentUser.uid
                        )
                        .collection(
                            'savedProperties'
                        )
                        .doc(
                            propertyId
                        )
                        .set({

                            ...property,

                            savedAt:
                                firebase
                                    .firestore
                                    .FieldValue
                                    .serverTimestamp()

                        });


                    savedProperties.add(
                        propertyId
                    );


                    showToast(
                        'Property saved.'
                    );

                }


                updateSavedCount();

                renderProperties();

            } catch (error) {

                console.error(
                    'Error toggling saved property:',
                    error
                );


                showToast(
                    'Unable to update saved property.',
                    'error'
                );

            }

        }


        function updateSavedCount() {

            const badge =
                document.getElementById(
                    'savedCount'
                );


            if (!badge) return;


            const count =
                savedProperties.size;


            if (count > 0) {

                badge.textContent =
                    count;

                badge.classList.remove(
                    'hidden'
                );

                badge.classList.add(
                    'flex'
                );

            } else {

                badge.classList.add(
                    'hidden'
                );

                badge.classList.remove(
                    'flex'
                );

            }

        }


        /*
         * =========================================================
         * NAVIGATION
         * =========================================================
         */

        function viewProperty(
            id
        ) {

            if (!id) return;


            window.location.href =
                `property-detail.html?id=${encodeURIComponent(id)}`;

        }


        function highlightPropertyCard(
            id
        ) {

            if (!id) return;


            const card =
                document.getElementById(
                    `property-card-${id}`
                );


            if (!card) return;


            if (
                currentViewMode !==
                'list' &&
                window.innerWidth <
                1024
            ) {

                return;

            }


            card.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });


            card.classList.add(
                'border-primary-300'
            );


            setTimeout(
                () => {

                    card.classList.remove(
                        'border-primary-300'
                    );

                },
                1600
            );

        }


        /*
         * =========================================================
         * RESULT META
         * =========================================================
         */

        function updateResultMeta() {

            const resultCount =
                document.getElementById(
                    'resultCount'
                );


            if (resultCount) {

                resultCount.textContent =
                    filteredProperties.length;

            }


            const activeFilters =
                getActiveFilterCount();


            const badge =
                document.getElementById(
                    'filterCountBadge'
                );


            if (badge) {

                if (activeFilters > 0) {

                    badge.textContent =
                        activeFilters;

                    badge.classList.remove(
                        'hidden'
                    );

                    badge.classList.add(
                        'flex'
                    );

                } else {

                    badge.classList.add(
                        'hidden'
                    );

                    badge.classList.remove(
                        'flex'
                    );

                }

            }


            const resetButton =
                document.getElementById(
                    'resetFiltersBtn'
                );


            if (resetButton) {

                const hasQuery =
                    Boolean(
                        document
                            .getElementById(
                                'searchInput'
                            )
                            ?.value
                            .trim()
                    );


                const active =
                    activeFilters > 0 ||
                    hasQuery;


                resetButton.classList.toggle(
                    'hidden',
                    !active
                );

            }


            updateMapResultText();

        }


        function getActiveFilterCount() {

            let count = 0;


            if (
                currentQuickFilter !==
                'all'
            ) {

                count++;

            }


            if (
                advancedFilters.type !==
                'all'
            ) {

                count++;

            }


            if (
                advancedFilters.minPrice !==
                ''
            ) {

                count++;

            }


            if (
                advancedFilters.maxPrice !==
                ''
            ) {

                count++;

            }


            if (
                Number(
                    advancedFilters.bedrooms
                ) > 0
            ) {

                count++;

            }


            if (
                advancedFilters.featured
            ) {

                count++;

            }


            return count;

        }


        function updateMapResultText() {

            const element =
                document.getElementById(
                    'mapResultText'
                );


            if (!element) return;


            if (
                filteredProperties.length ===
                0
            ) {

                element.textContent =
                    'No matching properties';

                return;

            }


            element.textContent =
                `${filteredProperties.length} ${
                    filteredProperties.length === 1
                        ? 'property'
                        : 'properties'
                } on map`;

        }


        /*
         * =========================================================
         * SHEETS / BACKDROPS
         * =========================================================
         */

        function setupSheetBackdrops() {

            const filterSheet =
                document.getElementById(
                    'filterSheet'
                );


            const sortSheet =
                document.getElementById(
                    'sortSheet'
                );


            if (filterSheet) {

                filterSheet.addEventListener(
                    'click',
                    event => {

                        if (
                            event.target ===
                            filterSheet
                        ) {

                            closeFilterSheet();

                        }

                    }
                );

            }


            if (sortSheet) {

                sortSheet.addEventListener(
                    'click',
                    event => {

                        if (
                            event.target ===
                            sortSheet
                        ) {

                            closeSortSheet();

                        }

                    }
                );

            }


            document.addEventListener(
                'keydown',
                event => {

                    if (
                        event.key !==
                        'Escape'
                    ) {

                        return;

                    }


                    const filter =
                        document.getElementById(
                            'filterSheet'
                        );


                    const sort =
                        document.getElementById(
                            'sortSheet'
                        );


                    if (
                        filter &&
                        filter.classList.contains(
                            'flex'
                        )
                    ) {

                        closeFilterSheet();

                        return;

                    }


                    if (
                        sort &&
                        sort.classList.contains(
                            'flex'
                        )
                    ) {

                        closeSortSheet();

                    }

                }
            );

        }


        function restoreBodyScroll() {

            const filter =
                document.getElementById(
                    'filterSheet'
                );


            const sort =
                document.getElementById(
                    'sortSheet'
                );


            const filterOpen =
                filter &&
                filter.classList.contains(
                    'flex'
                );


            const sortOpen =
                sort &&
                sort.classList.contains(
                    'flex'
                );


            if (
                !filterOpen &&
                !sortOpen
            ) {

                document.body.style.overflow =
                    '';

            }

        }


        /*
         * =========================================================
         * RESPONSIVE BEHAVIOR
         * =========================================================
         */

        window.addEventListener(
            'resize',
            () => {

                if (
                    window.innerWidth >=
                    1024
                ) {

                    const mapPanel =
                        document.getElementById(
                            'mapPanel'
                        );


                    const listPanel =
                        document.getElementById(
                            'listPanel'
                        );


                    mapPanel?.classList.remove(
                        'hidden'
                    );


                    listPanel?.classList.remove(
                        'hidden'
                    );


                    if (map) {

                        setTimeout(
                            () => {

                                map.invalidateSize();

                            },
                            100
                        );

                    }

                } else {

                    setViewMode(
                        currentViewMode
                    );

                }

            }
        );


        /*
         * =========================================================
         * UTILITIES
         * =========================================================
         */

        function formatPrice(
            price
        ) {

            const numeric =
                Number(
                    price
                );


            if (
                !Number.isFinite(
                    numeric
                )
            ) {

                return '0';

            }


            return numeric.toLocaleString(
                'en-NG'
            );

        }


        function getTimestampMillis(
            timestamp
        ) {

            if (!timestamp) {

                return 0;

            }


            if (
                typeof timestamp.toMillis ===
                'function'
            ) {

                return timestamp.toMillis();

            }


            if (
                timestamp.seconds !==
                undefined
            ) {

                return Number(
                    timestamp.seconds
                ) * 1000;

            }


            if (
                timestamp instanceof Date
            ) {

                return timestamp.getTime();

            }


            if (
                typeof timestamp ===
                'string'
            ) {

                const parsed =
                    Date.parse(
                        timestamp
                    );


                return Number.isNaN(
                    parsed
                )
                    ? 0
                    : parsed;

            }


            return 0;

        }


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ''
            )
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

        }


        function escapeAttribute(
            value
        ) {

            return String(
                value ?? ''
            )
            .replace(
                /\\/g,
                '\\\\'
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /"/g,
                '&quot;'
            );

        }


        /*
         * =========================================================
         * TOAST
         * =========================================================
         */

        function showToast(
            message,
            type = 'success'
        ) {

            const existing =
                document.getElementById(
                    'moonlatBrowseToast'
                );


            if (existing) {

                existing.remove();

            }


            const toast =
                document.createElement(
                    'div'
                );


            toast.id =
                'moonlatBrowseToast';


            toast.className =
                `
                    fixed
                    top-4
                    left-1/2
                    -translate-x-1/2
                    z-[4000]
                    max-w-[calc(100vw-32px)]
                    flex
                    items-center
                    gap-3
                    px-4
                    py-3
                    rounded-2xl
                    shadow-2xl
                    text-white
                    text-xs
                    font-extrabold
                    toast-enter
                    ${
                        type === 'success'
                            ? 'bg-slate-950'
                            : 'bg-rose-600'
                    }
                `;


            toast.innerHTML =
                `

                    <span
                        class="w-7 h-7 rounded-lg ${
                            type === 'success'
                                ? 'bg-emerald-500/15 text-emerald-400'
                                : 'bg-white/15 text-white'
                        } flex items-center justify-center shrink-0"
                    >

                        <i
                            class="fas ${
                                type === 'success'
                                    ? 'fa-check'
                                    : 'fa-triangle-exclamation'
                            } text-[10px]"
                        ></i>

                    </span>


                    <span class="truncate">
                        ${escapeHtml(message)}
                    </span>

                `;


            document.body.appendChild(
                toast
            );


            setTimeout(
                () => {

                    if (!toast.isConnected) {
                        return;
                    }


                    toast.style.opacity =
                        '0';

                    toast.style.transform =
                        'translate(-50%, -8px)';

                    toast.style.transition =
                        'all .2s ease';


                    setTimeout(
                        () => {

                            toast.remove();

                        },
                        220
                    );

                },
                3000
            );

        }


        /*
         * =========================================================
         * INITIAL UI SYNC
         * =========================================================
         */

        syncSortUI();

        syncAdvancedFilterUI();

        updateViewModeUI();

    </script>

</body>
