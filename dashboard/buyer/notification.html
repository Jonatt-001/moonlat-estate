  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 90% -10%,
          rgba(37, 99, 235, .055),
          transparent 30%

    }

    button,
    a {
      -webkit-user-select: none;
      user-select: none;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .2);
      outline-offset: 2px;
    }

    .glass {
      background: rgba(255, 255, 255, .91);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .notification-item {
      position: relative;
      transition:
        background-color .2s ease,
        opacity .2s ease,
        transform .2s ease;
    }

    .notification-item.unread {
      background: rgba(239, 246, 255, .72);
    }

    .notification-item.read:hover,
    .notification-item.unread:hover {
      background: #f8fafc;
    }

    .notification-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notification-action {
      transition:
        opacity .2s ease,
        transform .2s ease,
        background-color .2s ease,
        color .2s ease;
    }

    .notification-item:hover .notification-action {
      opacity: 1;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: #e9edf2;
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.6),
        transparent
      );
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      to {
        transform: translateX(100%);
      }
    }

    .page-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .25s ease;
    }

    .page-loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 21px;
      height: 21px;
      border: 2px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .state-in {
      animation: stateIn .25s ease-out both;
    }

    @keyframes stateIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .confirm-backdrop {
      background: rgba(2, 6, 23, .56);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .confirm-dialog {
      animation: dialogIn .22s cubic-bezier(.22,1,.36,1);
    }

    @keyframes dialogIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .toast {
      animation: toastIn .28s cubic-bezier(.22,1,.36,1);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 12px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .notification-removing {
      opacity: 0 !important;
      transform: translateX(12px) !important;
      pointer-events: none !important;
    }

    @media (max-width: 639px) {
      .notification-action {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script>
    let currentUser = null;
    let notifications = [];
    let unsubscribe = null;
    let pendingDeleteId = null;
    let isDeleting = false;


    /* =========================================================
       INITIALIZATION
    ========================================================== */

    document.addEventListener('DOMContentLoaded', () => {

      auth.onAuthStateChanged((user) => {

        if (!user) {

          if (unsubscribe) {
            unsubscribe();
            unsubscribe = null;
          }

          sessionStorage.setItem(
            'redirectAfterLogin',
            window.location.href
          );

          window.location.replace(
            '../sign-in.html'
          );

          return;
        }


        currentUser = user;

        updateUserAvatar(user);

        setupRealtimeNotifications();

      });

    });


    window.addEventListener('beforeunload', () => {

      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }

    });


    /* =========================================================
       REAL-TIME NOTIFICATIONS
    ========================================================== */

    function setupRealtimeNotifications() {

      if (!currentUser) {
        return;
      }


      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }


      /*
       * IMPORTANT:
       *
       * Do NOT use:
       *
       * .where('userId', '==', currentUser.uid)
       * .orderBy('createdAt', 'desc')
       *
       * together unless the corresponding composite
       * Firestore index exists.
       *
       * The notification center does not need that index.
       *
       * We query only by userId and perform the newest-first
       * ordering locally in JavaScript.
       */
      unsubscribe =
        db.collection('notifications')
          .where(
            'userId',
            '==',
            currentUser.uid
          )
          .limit(50)
          .onSnapshot(

            (snapshot) => {

              notifications =
                snapshot.docs
                  .map(
                    doc => ({
                      id: doc.id,
                      ...doc.data()
                    })
                  )
                  .sort(
                    sortNotificationsNewestFirst
                  );


              renderNotifications();

            },

            (error) => {

              console.error(
                'Notification listener error:',
                error
              );


              showNotificationError(
                error
              );

            }

          );

    }


    /* =========================================================
       NOTIFICATION SORTING
    ========================================================== */

    function sortNotificationsNewestFirst(
      first,
      second
    ) {

      const firstTime =
        getTimestampMilliseconds(
          first?.createdAt
        );


      const secondTime =
        getTimestampMilliseconds(
          second?.createdAt
        );


      return secondTime - firstTime;

    }


    function getTimestampMilliseconds(
      timestamp
    ) {

      if (!timestamp) {
        return 0;
      }


      try {

        if (
          typeof timestamp.toMillis ===
          'function'
        ) {

          return timestamp.toMillis();

        }


        if (
          typeof timestamp.toDate ===
          'function'
        ) {

          return timestamp.toDate().getTime();

        }


        if (
          timestamp instanceof Date
        ) {

          return timestamp.getTime();

        }


        const milliseconds =
          new Date(
            timestamp
          ).getTime();


        return Number.isNaN(
          milliseconds
        )
          ? 0
          : milliseconds;

      } catch (error) {

        return 0;

      }

    }


    /* =========================================================
       RENDER
    ========================================================== */

    function renderNotifications() {

      const container =
        document.getElementById(
          'notificationsContainer'
        );

      const subtitle =
        document.getElementById(
          'notificationSubtitle'
        );

      const badge =
        document.getElementById(
          'unreadBadge'
        );

      const markAll =
        document.getElementById(
          'markAllBtn'
        );

      const toolbar =
        document.getElementById(
          'notificationToolbar'
        );

      const total =
        document.getElementById(
          'totalNotificationCount'
        );


      const unreadCount =
        notifications.filter(
          notification =>
            notification.isRead !== true
        ).length;


      /* Header */

      if (unreadCount === 0) {

        subtitle.textContent =
          notifications.length === 0
            ? 'You are all caught up.'
            : 'You have no unread notifications.';

      } else {

        subtitle.textContent =
          unreadCount === 1
            ? '1 unread notification'
            : `${unreadCount} unread notifications`;

      }


      /* Badge */

      if (unreadCount > 0) {

        badge.textContent =
          unreadCount;

        badge.classList.remove(
          'hidden'
        );

        badge.classList.add(
          'inline-flex'
        );

      } else {

        badge.classList.add(
          'hidden'
        );

        badge.classList.remove(
          'inline-flex'
        );

      }


      /* Mark all */

      if (unreadCount > 0) {

        markAll.classList.remove(
          'hidden'
        );

        markAll.classList.add(
          'inline-flex'
        );

      } else {

        markAll.classList.add(
          'hidden'
        );

        markAll.classList.remove(
          'inline-flex'
        );

      }


      /* Toolbar */

      if (notifications.length > 0) {

        toolbar.classList.remove(
          'hidden'
        );

        total.textContent =
          notifications.length === 1
            ? '1 notification'
            : `${notifications.length} notifications`;

      } else {

        toolbar.classList.add(
          'hidden'
        );

      }


      /* Empty */

      if (notifications.length === 0) {

        container.innerHTML = `
          <div class="state-in p-10 sm:p-16 text-center">

            <div class="w-16 h-16 rounded-[20px] bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-5">
              <i class="fas fa-bell-slash text-xl"></i>
            </div>

            <p class="text-[10px] uppercase tracking-[.18em] font-extrabold text-slate-400">
              Notification center
            </p>

            <h3 class="text-xl font-extrabold tracking-tight text-slate-950 mt-2">
              You're all caught up
            </h3>

            <p class="text-xs sm:text-sm text-slate-500 leading-6 max-w-sm mx-auto mt-2">
              Important updates about your properties, viewings and account will appear here.
            </p>

          </div>
        `;

        return;

      }


      container.innerHTML =
        notifications
          .map(
            createNotification
          )
          .join('');

    }


    function createNotification(
      notification
    ) {

      const style =
        getNotificationStyle(
          notification.type
        );


      const isRead =
        notification.isRead === true;


      const title =
        notification.title ||
        'MoonLat notification';


      const message =
        notification.message ||
        'You have a new update from MoonLat.';


      const time =
        formatNotificationTime(
          notification.createdAt
        );


      const safeId =
        escapeAttribute(
          notification.id
        );


      const safeLink =
        notification.link &&
        notification.link !== 'undefined'
          ? escapeAttribute(
              notification.link
            )
          : '';


      return `
        <article
          id="notification-${safeId}"
          class="notification-item ${
            isRead
              ? 'read'
              : 'unread'
          } p-4 sm:p-5"
        >

          <div class="flex items-start gap-3.5 sm:gap-4">

            <!-- ICON -->
            <div
              class="notification-icon ${style.bg} ${style.text}"
              aria-hidden="true"
            >
              <i class="${style.icon} text-sm"></i>
            </div>


            <!-- CONTENT -->
            <div
              class="flex-1 min-w-0 pr-1 cursor-pointer"
              onclick="handleNotificationClick('${safeId}', '${safeLink}', ${isRead})"
              role="${safeLink ? 'link' : 'button'}"
              tabindex="0"
              onkeydown="handleNotificationKey(event, '${safeId}', '${safeLink}', ${isRead})"
            >

              <div class="flex items-start gap-2">

                <h3
                  class="${
                    isRead
                      ? 'font-semibold'
                      : 'font-extrabold'
                  } text-sm text-slate-950 leading-5"
                >
                  ${escapeHtml(title)}
                </h3>

                ${
                  !isRead
                    ? `
                      <span
                        class="w-2 h-2 rounded-full bg-primary-600 mt-1.5 shrink-0"
                        aria-label="Unread"
                      ></span>
                    `
                    : ''
                }

              </div>


              <p class="text-xs sm:text-sm text-slate-600 leading-5 mt-1">
                ${escapeHtml(message)}
              </p>


              <div class="flex items-center gap-2 mt-2.5">

                <span class="text-[10px] font-bold text-slate-400">
                  ${escapeHtml(time)}
                </span>

                ${
                  safeLink
                    ? `
                      <span class="text-[10px] text-primary-600 font-extrabold">
                        View
                        <i class="fas fa-arrow-right ml-1 text-[8px]"></i>
                      </span>
                    `
                    : ''
                }

              </div>

            </div>


            <!-- DELETE -->
            <button
              type="button"
              onclick="requestDeleteNotification(event, '${safeId}')"
              class="notification-action opacity-0 w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-400 hover:text-rose-600 hover:border-rose-200 hover:bg-rose-50 flex items-center justify-center shrink-0"
              title="Delete notification"
              aria-label="Delete notification"
            >
              <i class="fas fa-trash text-[10px]"></i>
            </button>

          </div>

        </article>
      `;

    }


    /* =========================================================
       NOTIFICATION CLICK
    ========================================================== */

    async function handleNotificationClick(
      id,
      link,
      isRead
    ) {

      if (!currentUser) {
        return;
      }


      if (!isRead) {

        try {

          await db
            .collection('notifications')
            .doc(id)
            .update({
              isRead: true
            });

        } catch (error) {

          console.error(
            'Error marking notification as read:',
            error
          );

        }

      }


      if (
        link &&
        link !== 'undefined' &&
        link !== 'null'
      ) {

        window.location.href =
          link;

      }

    }


    function handleNotificationKey(
      event,
      id,
      link,
      isRead
    ) {

      if (
        event.key === 'Enter' ||
        event.key === ' '
      ) {

        event.preventDefault();

        handleNotificationClick(
          id,
          link,
          isRead
        );

      }

    }


    /* =========================================================
       MARK ALL READ
    ========================================================== */

    async function markAllAsRead() {

      if (
        !currentUser ||
        !notifications.length
      ) {
        return;
      }


      const unread =
        notifications.filter(
          notification =>
            notification.isRead !== true
        );


      if (!unread.length) {
        return;
      }


      const button =
        document.getElementById(
          'markAllBtn'
        );


      const original =
        button.innerHTML;


      button.disabled =
        true;


      button.innerHTML = `
        <span class="spinner w-3.5 h-3.5 border-[1.5px] border-primary-200 border-t-primary-600"></span>
        Updating
      `;


      try {

        /*
         * Firestore batches are limited to
         * 500 operations. We only load 50,
         * but chunking keeps this function safe.
         */
        for (
          let i = 0;
          i < unread.length;
          i += 450
        ) {

          const chunk =
            unread.slice(
              i,
              i + 450
            );


          const batch =
            db.batch();


          chunk.forEach(
            notification => {

              batch.update(
                db.collection(
                  'notifications'
                ).doc(
                  notification.id
                ),
                {
                  isRead: true
                }
              );

            }
          );


          await batch.commit();

        }


        showToast(
          'All notifications marked as read.'
        );


      } catch (error) {

        console.error(
          'Error marking notifications:',
          error
        );

        showToast(
          getErrorMessage(
            error,
            'Unable to update notifications.'
          ),
          'error'
        );

      } finally {

        button.disabled =
          false;

        button.innerHTML =
          original;

      }

    }


    /* =========================================================
       DELETE
    ========================================================== */

    function requestDeleteNotification(
      event,
      id
    ) {

      event.preventDefault();
      event.stopPropagation();


      if (
        !currentUser ||
        !id ||
        isDeleting
      ) {
        return;
      }


      pendingDeleteId =
        id;


      const notification =
        notifications.find(
          item =>
            item.id === id
        );


      const title =
        notification?.title ||
        'this notification';


      document.getElementById(
        'deleteModalTitle'
      ).textContent =
        `Delete "${truncateText(title, 42)}"?`;


      openDeleteModal();

    }


    function openDeleteModal() {

      const modal =
        document.getElementById(
          'deleteModal'
        );


      modal.classList.remove(
        'hidden'
      );

      modal.classList.add(
        'flex'
      );


      document.body.classList.add(
        'modal-open'
      );


      setTimeout(() => {

        document
          .getElementById(
            'confirmDeleteBtn'
          )
          .focus();

      }, 30);

    }


    function closeDeleteModal() {

      if (isDeleting) {
        return;
      }


      const modal =
        document.getElementById(
          'deleteModal'
        );


      modal.classList.add(
        'hidden'
      );

      modal.classList.remove(
        'flex'
      );


      document.body.classList.remove(
        'modal-open'
      );


      pendingDeleteId =
        null;

    }


    async function confirmDeleteNotification() {

      const id =
        pendingDeleteId;


      if (
        !id ||
        !currentUser ||
        isDeleting
      ) {
        return;
      }


      isDeleting =
        true;


      const button =
        document.getElementById(
          'confirmDeleteBtn'
        );


      button.disabled =
        true;


      button.innerHTML = `
        <span class="inline-flex items-center gap-2">
          <span class="spinner w-3.5 h-3.5 border-[1.5px] border-rose-300 border-t-white"></span>
          Deleting
        </span>
      `;


      const item =
        document.getElementById(
          `notification-${CSS.escape(id)}`
        );


      try {

        await db
          .collection('notifications')
          .doc(id)
          .delete();


        if (item) {

          item.classList.add(
            'notification-removing'
          );

          await wait(
            200
          );

        }


        closeDeleteModal();

        showToast(
          'Notification deleted.'
        );


      } catch (error) {

        console.error(
          'Error deleting notification:',
          error
        );

        showToast(
          getErrorMessage(
            error,
            'Unable to delete notification.'
          ),
          'error'
        );

      } finally {

        isDeleting =
          false;

        button.disabled =
          false;

        button.textContent =
          'Delete';

      }

    }


    /* =========================================================
       FIRESTORE ERROR
    ========================================================== */

    function showNotificationError(
      error
    ) {

      const container =
        document.getElementById(
          'notificationsContainer'
        );


      const errorCode =
        String(
          error?.code || ''
        ).toLowerCase();


      const errorMessage =
        String(
          error?.message || ''
        ).toLowerCase();


      const isIndexError =
        errorCode.includes(
          'failed-precondition'
        )
        ||
        errorMessage.includes(
          'index'
        );


      const isPermissionError =
        errorCode.includes(
          'permission-denied'
        );


      let message =
        'There was a problem connecting to your notification center.';


      if (isIndexError) {

        message =
          'The notification query requires a Firestore index.';


      } else if (isPermissionError) {

        message =
          'Your account does not currently have permission to access these notifications.';

      }


      container.innerHTML = `
        <div class="state-in p-10 sm:p-14 text-center">

          <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-triangle-exclamation"></i>
          </div>

          <h3 class="text-lg font-extrabold text-slate-950">
            Notifications couldn't be loaded
          </h3>

          <p class="text-xs text-slate-500 leading-5 max-w-md mx-auto mt-2">
            ${escapeHtml(message)}
          </p>

          <button
            type="button"
            onclick="setupRealtimeNotifications()"
            class="inline-flex items-center gap-2 h-10 px-5 mt-5 rounded-xl bg-slate-950 text-white text-xs font-extrabold hover:bg-slate-800 transition"
          >
            <i class="fas fa-rotate-right text-[10px]"></i>
            Try again
          </button>

        </div>
      `;


      document
        .getElementById(
          'notificationToolbar'
        )
        .classList.add(
          'hidden'
        );

    }


    /* =========================================================
       STYLING
    ========================================================== */

    function getNotificationStyle(
      type
    ) {

      const styles = {

        appointment: {
          icon: 'fas fa-calendar-check',
          bg: 'bg-emerald-50',
          text: 'text-emerald-600'
        },

        viewing: {
          icon: 'fas fa-calendar-check',
          bg: 'bg-emerald-50',
          text: 'text-emerald-600'
        },

        price_drop: {
          icon: 'fas fa-tag',
          bg: 'bg-blue-50',
          text: 'text-blue-600'
        },

        property: {
          icon: 'fas fa-house',
          bg: 'bg-indigo-50',
          text: 'text-indigo-600'
        },

        message: {
          icon: 'fas fa-comment-dots',
          bg: 'bg-violet-50',
          text: 'text-violet-600'
        },

        alert: {
          icon: 'fas fa-triangle-exclamation',
          bg: 'bg-amber-50',
          text: 'text-amber-600'
        },

        success: {
          icon: 'fas fa-circle-check',
          bg: 'bg-emerald-50',
          text: 'text-emerald-600'
        },

        system: {
          icon: 'fas fa-gear',
          bg: 'bg-slate-100',
          text: 'text-slate-600'
        },

        default: {
          icon: 'fas fa-bell',
          bg: 'bg-primary-50',
          text: 'text-primary-600'
        }

      };


      return (
        styles[type] ||
        styles.default
      );

    }


    /* =========================================================
       TIME
    ========================================================== */

    function formatNotificationTime(
      timestamp
    ) {

      if (!timestamp) {
        return 'Just now';
      }


      let date;


      try {

        date =
          timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

      } catch (error) {

        return 'Just now';

      }


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return 'Just now';
      }


      const now =
        new Date();


      let seconds =
        Math.floor(
          (
            now.getTime() -
            date.getTime()
          ) / 1000
        );


      if (seconds < 0) {
        seconds = 0;
      }


      if (seconds < 60) {
        return 'Just now';
      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      if (minutes < 60) {

        return minutes === 1
          ? '1 minute ago'
          : `${minutes} minutes ago`;

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      if (hours < 24) {

        return hours === 1
          ? '1 hour ago'
          : `${hours} hours ago`;

      }


      const days =
        Math.floor(
          hours / 24
        );


      if (days === 1) {
        return 'Yesterday';
      }


      if (days < 7) {

        return `${days} days ago`;

      }


      if (days < 30) {

        const weeks =
          Math.floor(
            days / 7
          );

        return weeks === 1
          ? '1 week ago'
          : `${weeks} weeks ago`;

      }


      return date.toLocaleDateString(
        'en-NG',
        {
          day: 'numeric',
          month: 'short',
          year:
            date.getFullYear() !==
            now.getFullYear()
              ? 'numeric'
              : undefined
        }
      );

    }


    /* =========================================================
       USER AVATAR
    ========================================================== */

    function updateUserAvatar(
      user
    ) {

      const avatar =
        document.getElementById(
          'userAvatar'
        );


      if (!avatar) {
        return;
      }


      if (user.photoURL) {

        avatar.innerHTML = `
          <img
            src="${escapeAttribute(user.photoURL)}"
            alt="Account"
            class="w-full h-full object-cover"
            onerror="this.remove(); this.parentElement.textContent='${escapeAttribute(
              getInitial(
                user.displayName ||
                user.email
              )
            )}'"
          >
        `;

        return;

      }


      avatar.textContent =
        getInitial(
          user.displayName ||
          user.email
        );

    }


    function getInitial(
      value
    ) {

      const text =
        String(
          value || 'U'
        ).trim();


      return (
        text.charAt(0) ||
        'U'
      ).toUpperCase();

    }


    /* =========================================================
       UTILITIES
    ========================================================== */

    function wait(
      milliseconds
    ) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            milliseconds
          )
      );

    }


    function truncateText(
      text,
      length
    ) {

      const value =
        String(
          text || ''
        );


      if (
        value.length <= length
      ) {
        return value;
      }


      return (
        value.slice(
          0,
          length - 1
        ) + '…'
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }


    function escapeAttribute(
      value
    ) {

      return escapeHtml(
        value
      );

    }


    function getErrorMessage(
      error,
      fallback
    ) {

      const code =
        String(
          error?.code || ''
        );


      const messages = {

        'permission-denied':
          'You do not have permission to modify these notifications.',

        'unavailable':
          'MoonLat is temporarily unavailable. Please try again.',

        'network-request-failed':
          'Your network connection failed. Please try again.',

        'failed-precondition':
          'The requested Firestore operation is not currently available.'

      };


      return (
        messages[code] ||
        fallback
      );

    }


    /* =========================================================
       TOAST
    ========================================================== */

    function showToast(
      message,
      type = 'success'
    ) {

      const container =
        document.getElementById(
          'toastContainer'
        );


      if (!container) {
        return;
      }


      container
        .querySelectorAll(
          '.toast'
        )
        .forEach(
          toast =>
            toast.remove()
        );


      const toast =
        document.createElement(
          'div'
        );


      const isError =
        type === 'error';


      toast.className = `
        toast
        pointer-events-auto
        flex
        items-center
        gap-3
        min-w-[min(320px,calc(100vw-32px))]
        max-w-[calc(100vw-32px)]
        px-4
        py-3
        rounded-2xl
        shadow-2xl
        text-white
        text-xs
        font-bold
        ${
          isError
            ? 'bg-rose-600'
            : 'bg-slate-950'
        }
      `;


      toast.innerHTML = `
        <span class="w-7 h-7 rounded-lg ${
          isError
            ? 'bg-white/15'
            : 'bg-emerald-500/15'
        } flex items-center justify-center shrink-0">
          <i class="fas ${
            isError
              ? 'fa-triangle-exclamation'
              : 'fa-check'
          } text-[10px]"></i>
        </span>

        <span class="leading-5">
          ${escapeHtml(message)}
        </span>
      `;


      container.appendChild(
        toast
      );


      setTimeout(() => {

        toast.style.opacity =
          '0';

        toast.style.transform =
          'translate(-50%, 8px)';

        toast.style.transition =
          'opacity .2s ease, transform .2s ease';


        setTimeout(
          () => toast.remove(),
          220
        );

      }, 3000);

    }


    /* =========================================================
       ESCAPE KEY
    ========================================================== */

    document.addEventListener(
      'keydown',
      event => {

        if (
          event.key === 'Escape'
        ) {

          const modal =
            document.getElementById(
              'deleteModal'
            );


          if (
            modal &&
            modal.classList.contains(
              'flex'
            )
          ) {

            closeDeleteModal();

          }

        }

      }
    );


    /* =========================================================
       PAGE LOADER
    ========================================================== */

    window.addEventListener(
      'load',
      () => {

        const loader =
          document.getElementById(
            'pageLoader'
          );


        if (!loader) {
          return;
        }


        setTimeout(() => {

          loader.classList.add(
            'hide'
          );


          setTimeout(
            () => loader.remove(),
            280
          );

        }, 100);

      }

    );

  </script>
