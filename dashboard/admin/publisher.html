<style>
* { font-family: 'Inter', sans-serif; }
body { background: #000; color: #fff; }

:root {
  --primary: #FF6B35;
  --primary-hover: #E85A2D;
  --bg-dark: #000;
  --bg-card: #111;
  --border: rgba(255,255,255,0.1);
}

.drop-zone {
  border: 2px dashed var(--border);
  transition: all 0.3s;
  cursor: pointer;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--primary);
  background: rgba(255,107,53,0.05);
}

.image-preview {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 12px;
  background: #1a1a1a;
}
.image-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.image-preview .remove-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.8);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  cursor: pointer;
}
.image-preview:hover .remove-btn {
  opacity: 1;
}
.image-preview .primary-badge {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background: var(--primary);
  color: #fff;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 600;
}

.upload-progress {
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
  overflow: hidden;
}
.upload-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #E85A2D);
  transition: width 0.3s;
}

.property-card {
  transition: all 0.3s;
  border: 1px solid var(--border);
  background: var(--bg-card);
}
.property-card:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
}

.tab-btn {
  padding: 10px 20px;
  border-radius: 999px;
  font-weight: 500;
  transition: all 0.3s;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: #fff;
}
.tab-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.tab-btn:not(.active):hover {
  border-color: var(--primary);
  color: var(--primary);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  padding: 12px 28px;
  border-radius: 12px;
  font-weight: 500;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: none;
  cursor: pointer;
}
.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
}

.btn-ghost {
  background: transparent;
  color: #fff;
  padding: 12px 28px;
  border-radius: 12px;
  font-weight: 500;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
}
.btn-ghost:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.card-glass {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
}

.input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: #fff;
  transition: all 0.3s;
}
.input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(255,255,255,0.08);
}
.input::placeholder {
  color: rgba(255,255,255,0.4);
}

.chip {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.7);
}
.chip.active {
  background: rgba(255,107,53,0.2);
  border-color: var(--primary);
  color: var(--primary);
}
.chip:hover:not(.active) {
  background: rgba(255,255,255,0.1);
}

.badge {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-active {
  background: rgba(34,197,94,0.15);
  color: #22c55e;
  border: 1px solid rgba(34,197,94,0.2);
}
.badge-pending {
  background: rgba(255,107,53,0.15);
  color: var(--primary);
  border: 1px solid rgba(255,107,53,0.2);
}
.badge-suspended {
  background: rgba(239,68,68,0.15);
  color: #ef4444;
  border: 1px solid rgba(239,68,68,0.2);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-content {
  background: #111;
  border: 1px solid var(--border);
  border-radius: 20px;
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.fade-in {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

.toast {
  background: #111;
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  animation: slideIn 0.4s;
  min-width: 320px;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.toast.hiding {
  animation: slideOut 0.3s forwards;
}
@keyframes slideOut {
  to { transform: translateX(100%); opacity: 0; }
}

.sidebar {
  background: #000;
  border-right: 1px solid var(--border);
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 12px;
  color: rgba(255,255,255,0.6);

}
.sidebar-link:hover {

  color: #fff;
}
.sidebar-link.active {
  background: rgba(255,107,53,0.1);
  color: var(--primary);
}

.nav-glass {
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  background: var(--primary);
  color: #fff;
}

/* Drawer Overlay */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 35;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* Sidebar close button */
.sidebar-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  padding: 0.5rem;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
}
.sidebar-close:hover {
  background: rgba(255,255,255,0.2);
}

/* SEO Schema */
.schema-json {
  display: none;
}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy, where } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",
  authDomain: "moonlat-estate-dashboard.firebaseapp.com",
  projectId: "moonlat-estate-dashboard",
  storageBucket: "moonlat-estate-dashboard.firebasestorage.app",
  messagingSenderId: "289878951289",
  appId: "1:289878951289:web:18db63e3ab8f071b811ba8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let allProperties = [];
let allAgents = [];
let currentTab = 'upload';
let selectedImages = [];
let editingProperty = null;

const ErrorHandler = {
  handle(error, action = 'perform this action') {
    console.error(`[MoonLat Publisher]`, error);
    const messages = {
      'permission-denied': 'You do not have permission to perform this action',
      'unauthorized': 'Authentication required',
      'not-found': 'Resource not found',
      'storage/unauthorized': 'Storage access denied',
      'storage/canceled': 'Upload was canceled',
      'storage/unknown': 'Unknown storage error'
    };
    const errorCode = error.code || '';
    showToast(messages[errorCode] || `Failed to ${action}: ${error.message || 'Unknown error'}`, 'error');
  }
};

function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
  
  toast.innerHTML = `
    <i class="fas ${icons[type]} text-xl" style="color: var(--primary)"></i>
    <div class="flex-1">
      <p class="font-semibold text-sm">${type.charAt(0).toUpperCase() + type.slice(1)}</p>
      <p class="text-sm text-gray-400 mt-0.5">${message}</p>
    </div>
    <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white">
      <i class="fas fa-times"></i>
    </button>
  `;
  
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('hiding');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// Drawer Controls
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
}

// Close drawer on escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSidebar();
  }
});

onAuthStateChanged(auth, async (user) => {
  try {
    if (!user) {
      window.location.href = '../sign-in.html';
      return;
    }
    
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    
    if (!userDoc.exists()) throw new Error('User profile not found');
    
    const userData = userDoc.data();
    
    if (userData.role !== 'admin') {
      await signOut(auth);
      showToast('Access denied. Admin privileges required.', 'error');
      window.location.href = 'dashboard.html';
      return;
    }
    
    currentUser = { uid: user.uid, ...userData };
    document.getElementById('adminName').textContent = userData.name || 'Admin';
    document.getElementById('adminAvatar').textContent = (userData.name || 'A')[0].toUpperCase();
    document.getElementById('authGuard').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    
    subscribeToData();
    renderPage();
    
  } catch (error) {
    ErrorHandler.handle(error, 'initialize publisher');
    await signOut(auth);
    window.location.href = '../sign-in.html';
  }
});

function subscribeToData() {
  onSnapshot(collection(db, 'users'), (snap) => {
    const users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allAgents = users.filter(u => u.role === 'agent');
    renderPage();
  });
  
  onSnapshot(collection(db, 'properties'), (snap) => {
    allProperties = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderPage();
    updateSEOSchema();
  });
}

// Update SEO Schema dynamically
function updateSEOSchema() {
  const schema = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "MoonLat Property Listings",
    "description": "Professional real estate listings",
    "numberOfItems": allProperties.length,
    "itemListElement": allProperties.slice(0, 10).map((p, index) => ({
      "@type": "RealEstateListing",
      "position": index + 1,
      "name": p.title,
      "description": p.description,
      "price": p.price,
      "priceCurrency": "NGN",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": p.location,
        "addressCountry": "NG"
      },
      "image": p.image || p.images?.[0]
    }))
  };
  
  const schemaScript = document.getElementById('propertySchema');
  if (schemaScript) {
    schemaScript.textContent = JSON.stringify(schema);
  }
}

function renderPage() {
  const c = document.getElementById('pageContent');
  
  c.innerHTML = `
    <div class="mb-8 fade-in">
      <div class="flex items-center justify-between mb-6">
        <div>
          <p class="text-xs tracking-wider text-gray-500 uppercase mb-2">Property Management</p>
          <h1 class="text-4xl md:text-5xl font-bold mb-2">Property Publisher</h1>
          <p class="text-lg text-gray-400">Upload, manage, and moderate all property listings</p>
        </div>
        <div class="flex gap-2">
          <button onclick="switchTab('upload')" class="tab-btn ${currentTab === 'upload' ? 'active' : ''}">
            <i class="fas fa-plus mr-2"></i>Upload New
          </button>
          <button onclick="switchTab('manage')" class="tab-btn ${currentTab === 'manage' ? 'active' : ''}">
            <i class="fas fa-list mr-2"></i>Manage All (${allProperties.length})
          </button>
        </div>
      </div>
    </div>
    
    <div id="tabContent"></div>
  `;
  
  renderTabContent();
  setTimeout(() => document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible')), 100);
}

function switchTab(tab) {
  currentTab = tab;
  renderPage();
  closeSidebar();
}

function renderTabContent() {
  const content = document.getElementById('tabContent');
  if (currentTab === 'upload') renderUploadForm(content);
  else renderPropertyManager(content);
}

function renderUploadForm(c) {
  const propertyTypes = ['Apartment', 'House', 'Villa', 'Townhouse', 'Office', 'Commercial', 'Land'];
  const amenities = ['Pool', 'Gym', 'Parking', 'Garden', 'Security', 'Balcony', 'Fireplace', 'AC', 'Laundry', 'Elevator', 'CCTV', 'Furnished'];
  
  c.innerHTML = `
    <form id="propertyForm" class="space-y-6 fade-in">
      <div class="card-glass">
        <h3 class="text-2xl font-bold mb-6" style="color: var(--primary)"><i class="fas fa-info-circle mr-2"></i>Basic Information</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm text-gray-400 mb-2">Property Title <span style="color: var(--primary)">*</span></label>
            <input type="text" id="propTitle" class="input" placeholder="e.g. Modern 3-Bedroom Apartment in Lekki" required maxlength="100">
            <p class="text-xs text-gray-500 mt-1">Max 100 characters</p>
          </div>
          
          <div>
            <label class="block text-sm text-gray-400 mb-2">Property Type <span style="color: var(--primary)">*</span></label>
            <select id="propType" class="input" required>
              <option value="">Select type</option>
              ${propertyTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
            </select>
          </div>
          
          <div>
            <label class="block text-sm text-gray-400 mb-2">Status</label>
            <select id="propStatus" class="input">
              <option value="Pending">Pending (Requires Approval)</option>
              <option value="Active">Active (Publish Immediately)</option>
            </select>

function handleFileSelect(event) {
  handleFiles(event.target.files);
}

function handleFiles(files) {
  const maxFiles = 10;
  const maxSize = 5 * 1024 * 1024;
  
  for (let file of files) {
    if (selectedImages.length >= maxFiles) {
      showToast(`Maximum ${maxFiles} images allowed`, 'warning');
      break;
    }
    
    if (!file.type.startsWith('image/')) {
      showToast(`${file.name} is not an image`, 'error');
      continue;
    }
    
    if (file.size > maxSize) {
      showToast(`${file.name} exceeds 5MB limit`, 'error');
      continue;
    }
    
    selectedImages.push(file);
  }
  
  renderImagePreviews();
}

function renderImagePreviews() {
  const container = document.getElementById('imagePreview');
  container.innerHTML = selectedImages.map((file, index) => `
    <div class="image-preview">
      <img src="${URL.createObjectURL(file)}" alt="Preview ${index + 1}">
      ${index === 0 ? '<div class="primary-badge"><i class="fas fa-star mr-1"></i>Cover</div>' : ''}
      <div class="remove-btn" onclick="removeImage(${index})">
        <i class="fas fa-times"></i>
      </div>
    </div>
  `).join('');
}

function removeImage(index) {
  selectedImages.splice(index, 1);
  renderImagePreviews();
}

function toggleAmenity(el) {
  el.classList.toggle('active');
}

async function handlePropertySubmit(event) {
  event.preventDefault();
  
  if (selectedImages.length === 0) {
    showToast('Please upload at least one image', 'error');
    return;
  }
  
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Uploading...';
  
  try {
    const imageUrls = [];
    const progressContainer = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    
    progressContainer.classList.remove('hidden');
    
    for (let i = 0; i < selectedImages.length; i++) {
      const file = selectedImages[i];
      const fileName = `${Date.now()}_${i}_${file.name}`;
      const storageRef = ref(storage, `properties/${fileName}`);
      
      const uploadTask = uploadBytesResumable(storageRef, file);
      
      await new Promise((resolve, reject) => {
        uploadTask.on('state_changed',
          (snapshot) => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            const totalProgress = ((i * 100) + progress) / selectedImages.length;
            progressBar.style.width = totalProgress + '%';
            progressText.textContent = Math.round(totalProgress) + '%';
          },
          (error) => reject(error),
          async () => {
            const url = await getDownloadURL(uploadTask.snapshot.ref);
            imageUrls.push(url);
            resolve();
          }
        );
      });
    }
    
    const amenities = Array.from(document.querySelectorAll('.chip.active')).map(el => el.dataset.amenity);
    
    // Generate SEO-friendly slug
    const title = document.getElementById('propTitle').value.trim();
    const slug = title.toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
    
    const propertyData = {
      title: title,
      slug: slug,
      type: document.getElementById('propType').value,
      status: document.getElementById('propStatus').value,
      price: parseInt(document.getElementById('propPrice').value) || 0,
      area: parseInt(document.getElementById('propArea').value) || 0,
      beds: parseInt(document.getElementById('propBeds').value) || 0,
      baths: parseFloat(document.getElementById('propBaths').value) || 0,
      location: document.getElementById('propLocation').value.trim(),
      description: document.getElementById('propDesc').value.trim(),
      amenities: amenities,
      images: imageUrls,
      image: imageUrls[0],
      featured: document.getElementById('propFeatured').checked,
      ownerId: document.getElementById('propAgent').value || currentUser.uid,
      uploadedBy: currentUser.uid,
      uploadedByName: currentUser.name || 'Admin',
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      inquiries: 0,
      viewings: 0,
      // SEO Metadata
      metaTitle: title,
      metaDescription: document.getElementById('propDesc').value.trim().substring(0, 160),
      keywords: [document.getElementById('propType').value, document.getElementById('propLocation').value.trim(), ...amenities].join(', ')
    };
    
    await addDoc(collection(db, 'properties'), propertyData);
    
    showToast('Property uploaded successfully!', 'success');
    
    resetForm();
    switchTab('manage');
    
  } catch (error) {
    ErrorHandler.handle(error, 'upload property');
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Property';
  }
}

  else if (currentFilter === 'suspended') filtered = filtered.filter(p => p.status === 'suspended');
  else if (currentFilter === 'flagged') filtered = filtered.filter(p => p.flagged);

window.savePropertyEdit = async function(propertyId) {
  try {
    const title = document.getElementById('editTitle').value.trim();
    const slug = title.toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
    
    const data = {
      title: title,
      slug: slug,
      type: document.getElementById('editType').value,
      status: document.getElementById('editStatus').value,
      price: parseInt(document.getElementById('editPrice').value) || 0,
      area: parseInt(document.getElementById('editArea').value) || 0,
      beds: parseInt(document.getElementById('editBeds').value) || 0,
      baths: parseFloat(document.getElementById('editBaths').value) || 0,
      location: document.getElementById('editLocation').value.trim(),
      description: document.getElementById('editDesc').value.trim(),
      metaTitle: title,
      metaDescription: document.getElementById('editDesc').value.trim().substring(0, 160),
      updatedAt: serverTimestamp()
    };
    
    await updateDoc(doc(db, 'properties', propertyId), data);
    showToast('Property updated successfully', 'success');
    closeModal();
  } catch (error) {
    ErrorHandler.handle(error, 'update property');
  }
};

window.removePropertyImage = async function(propertyId, index) {
  if (!confirm('Remove this image?')) return;
  
  try {
    const property = allProperties.find(p => p.id === propertyId);
    if (!property) return;
    
    const images = property.images || [property.image];
    const removedImage = images[index];
    
    images.splice(index, 1);
    
    await updateDoc(doc(db, 'properties', propertyId), {
      images: images,
      image: images[0] || null,
      updatedAt: serverTimestamp()
    });
    
    if (removedImage) {
      try {
        const storageRef = ref(storage, removedImage);
        await deleteObject(storageRef);
      } catch (e) {
        console.warn('Could not delete from storage:', e);
      }
    }
    
    showToast('Image removed', 'success');
    editProperty(propertyId);
  } catch (error) {
    ErrorHandler.handle(error, 'remove image');
  }
};

window.toggleFlag = async function(propertyId, flag) {
  try {
    await updateDoc(doc(db, 'properties', propertyId), {
      flagged: flag,
      flaggedAt: flag ? serverTimestamp() : null,
      flaggedBy: flag ? currentUser.uid : null,
      updatedAt: serverTimestamp()
    });
    showToast(flag ? 'Property flagged' : 'Flag removed', 'success');
  } catch (error) {
    ErrorHandler.handle(error, 'toggle flag');
  }
};

window.deleteProperty = async function(propertyId) {
  if (!confirm('Delete this property permanently? This cannot be undone.')) return;
  
  try {
    const property = allProperties.find(p => p.id === propertyId);
    
    if (property?.images) {
      for (const imageUrl of property.images) {
        try {
          const storageRef = ref(storage, imageUrl);
          await deleteObject(storageRef);
        } catch (e) {
          console.warn('Could not delete image:', e);
        }
      }
    }
    
    await deleteDoc(doc(db, 'properties', propertyId));
    showToast('Property deleted', 'success');
  } catch (error) {
    ErrorHandler.handle(error, 'delete property');
  }
};

window.handleLogout = async function() {
  if (!confirm('Sign out?')) return;
  try {
    await signOut(auth);
    window.location.href = '../sign-in.html';
  } catch (error) {
    ErrorHandler.handle(error, 'sign out');
  }
};

window.toggleSidebar = toggleSidebar;
window.closeSidebar = closeSidebar;
window.switchTab = switchTab;
window.handleFileSelect = handleFileSelect;
window.removeImage = removeImage;
window.toggleAmenity = toggleAmenity;
window.resetForm = resetForm;
window.filterProperties = filterProperties;
window.renderPropertyGrid = renderPropertyGrid;
</script>
