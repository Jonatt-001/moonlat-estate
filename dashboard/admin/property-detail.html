<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details - MoonLat Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="scroll-smooth">

<div class="stars"></div>

<div id="authGuard" class="fixed inset-0 bg-black z-[9999] flex items-center justify-center">
  <div class="spinner"></div>
</div>

<div id="app" class="flex min-h-screen hidden">
  <aside class="sidebar sidebar-glass w-72 fixed h-full z-40 flex flex-col">
    <div class="p-6 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center">
          <i class="fas fa-shield-alt text-black"></i>
        </div>
        <div>
          <h1 class="display font-bold text-lg">MoonLat Admin</h1>
          <p class="text-xs opacity-60">Control Center</p>
        </div>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a href="index.html" class="sidebar-link">
        <i class="fas fa-arrow-left w-5"></i> Back to Dashboard
      </a>
      <a href="index.html#properties" class="sidebar-link">
        <i class="fas fa-building w-5"></i> All Properties
      </a>
    </nav>
  </aside>

  <main class="flex-1 ml-72">
    <header class="nav-glass sticky top-0 z-30 px-8 py-4">
      <div class="flex items-center justify-between">
        <h2 class="display text-xl font-bold">Property Details</h2>
        <button onclick="handleLogout()" class="btn-ghost text-sm">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </button>
      </div>
    </header>

    <div id="pageContent" class="p-8 relative">
      <div class="flex items-center justify-center" style="min-height: 400px;">
        <div class="spinner"></div>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer" class="fixed bottom-6 right-6 z-50"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",
  authDomain: "moonlat-estate-dashboard.firebaseapp.com",
  projectId: "moonlat-estate-dashboard",
  storageBucket: "moonlat-estate-dashboard.firebasestorage.app",
  messagingSenderId: "289878951289",
  appId: "1:289878951289:web:18db63e3ab8f071b811ba8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let propertyId = null;
let allAgents = [];

const urlParams = new URLSearchParams(window.location.search);
propertyId = urlParams.get('id');

if (!propertyId) {
  window.location.href = 'index.html';
}

onAuthStateChanged(auth, async (user) => {
  try {
    if (!user) {
      window.location.href = '../sign-in.html';
      return;
    }
    
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    
    if (!userDoc.exists() || userDoc.data().role !== 'admin') {
      await signOut(auth);
      window.location.href = '../sign-in.html';
      return;
    }
    
    currentUser = userDoc.data();
    document.getElementById('authGuard').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    
    loadPropertyData();
    
  } catch (error) {
    console.error('Auth error:', error);
    window.location.href = '../sign-in.html';
  }
});

function loadPropertyData() {
  onSnapshot(doc(db, 'properties', propertyId), async (doc) => {
    if (!doc.exists()) {
      document.getElementById('pageContent').innerHTML = `
        <div class="card-glass p-12 text-center fade-in">
          <i class="fas fa-building text-6xl opacity-30 mb-4"></i>
          <h2 class="display text-3xl font-bold mb-2">Property Not Found</h2>
          <p class="opacity-70 mb-6">This property may have been deleted.</p>
          <a href="index.html#properties" class="btn-ghost"><i class="fas fa-arrow-left"></i> Back to Properties</a>
        </div>
      `;
      return;
    }
    
    const property = { id: doc.id, ...doc.data() };
    
    onSnapshot(collection(db, 'users'), (snap) => {
      allAgents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPropertyDetail(property);
    });
  });
}

function renderPropertyDetail(property) {
  const agent = allAgents.find(a => a.id === property.ownerId);
  const listDate = new Date(property.createdAt || Date.now());
  
  document.getElementById('pageContent').innerHTML = `
    <a href="index.html#properties" class="btn-ghost mb-8 fade-in">
      <i class="fas fa-arrow-left"></i> Back to Properties
    </a>
    
    <!-- Hero Image -->
    <div class="card-glass overflow-hidden mb-6 fade-in">
      <img src="${property.image || 'https://via.placeholder.com/1200x600'}" 
           class="w-full h-64 md:h-96 object-cover" 
           onerror="this.src='https://via.placeholder.com/1200x600'">
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Main Info -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Header -->
        <div class="card-glass p-6 fade-in">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div>
              <h1 class="display text-4xl md:text-5xl font-bold mb-2">${property.title || 'Untitled Property'}</h1>
              <p class="opacity-70 flex items-center gap-2">
                <i class="fas fa-map-marker-alt"></i>
                ${property.location || 'Location not specified'}
              </p>
            </div>
            <span class="badge ${property.status === 'Active' ? 'badge-active' : property.status === 'Pending' ? 'badge-pending' : 'badge-suspended'} flex-shrink-0">
              ${property.status || 'Active'}
            </span>
          </div>
          
          <p class="display text-5xl font-bold text-green-400 mb-4">
            ₦${(property.price || 0).toLocaleString()}
          </p>
        </div>
        
        <!-- Specs -->
        <div class="card-glass p-6 fade-in">
          <h3 class="display text-2xl font-bold mb-6">Property Details</h3>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="p-4 rounded-lg bg-white/5">
              <p class="text-xs opacity-60 mb-1">Type</p>
              <p class="font-semibold">${property.type || '-'}</p>
            </div>
            <div class="p-4 rounded-lg bg-white/5">
              <p class="text-xs opacity-60 mb-1">Bedrooms</p>
              <p class="font-semibold">${property.beds || 0}</p>
            </div>
            <div class="p-4 rounded-lg bg-white/5">
              <p class="text-xs opacity-60 mb-1">Bathrooms</p>
              <p class="font-semibold">${property.baths || 0}</p>
            </div>
            <div class="p-4 rounded-lg bg-white/5">
              <p class="text-xs opacity-60 mb-1">Area</p>
              <p class="font-semibold">${property.area || 0} ft²</p>
            </div>
          </div>
        </div>
        
        <!-- Description -->
        <div class="card-glass p-6 fade-in">
          <h3 class="display text-2xl font-bold mb-4">Description</h3>
          <p class="opacity-80 leading-relaxed whitespace-pre-line">
            ${property.description || 'No description provided.'}
          </p>
        </div>
      </div>
      
      <!-- Sidebar -->
      <div class="lg:col-span-1 space-y-6">
        <!-- Agent Info -->
        <div class="card-glass p-6 fade-in">
          <h3 class="display text-xl font-bold mb-4">Listed By</h3>
          ${agent ? `
            <a href="agent-detail.html?id=${agent.id}" class="flex items-center gap-3 mb-4 hover:bg-white/5 p-2 rounded-lg transition">
              <div class="avatar">${(agent.name || 'A')[0].toUpperCase()}</div>
              <div class="flex-1 min-w-0">
                <p class="font-semibold truncate">${agent.name || 'Unnamed Agent'}</p>
                <p class="text-xs opacity-60 truncate">${agent.agency || 'Independent'}</p>
              </div>
              <i class="fas fa-chevron-right opacity-40"></i>
            </a>
            <div class="space-y-2 text-sm">
              <p class="flex items-center gap-2 opacity-80">
                <i class="fas fa-envelope w-4 opacity-60"></i>
                ${agent.email || 'No email'}
              </p>
              <p class="flex items-center gap-2 opacity-80">
                <i class="fas fa-phone w-4 opacity-60"></i>
                ${agent.phone || 'Not provided'}
              </p>
            </div>
          ` : `
            <p class="opacity-60">Unknown agent</p>
          `}
        </div>
        
        <!-- Listing Info -->
        <div class="card-glass p-6 fade-in">
          <h3 class="display text-xl font-bold mb-4">Listing Info</h3>
          <div class="space-y-3 text-sm">
            <div class="flex justify-between">
              <span class="opacity-60">Property ID</span>
              <span class="font-mono text-xs">${property.id.slice(0, 10)}...</span>
            </div>
            <div class="flex justify-between">
              <span class="opacity-60">Listed On</span>
              <span>${listDate.toLocaleDateString()}</span>
            </div>
            <div class="flex justify-between">
              <span class="opacity-60">Price per ft²</span>
              <span>₦${property.area ? Math.round(property.price / property.area).toLocaleString() : '-'}</span>
            </div>
          </div>
        </div>
        
        <!-- Actions -->
        <div class="card-glass p-6 fade-in">
          <h3 class="display text-xl font-bold mb-4">Actions</h3>
          <div class="flex flex-col gap-2">
            ${property.status === 'Pending' ? `
              <button onclick="approveProperty('${property.id}')" class="btn-primary w-full justify-center">
                <i class="fas fa-check"></i> Approve Listing
              </button>
            ` : ''}
            <button onclick="suspendProperty('${property.id}')" class="btn-ghost w-full justify-center">
              <i class="fas fa-ban"></i> Suspend Listing
            </button>
            <button onclick="deleteProperty('${property.id}')" class="btn-danger w-full justify-center">
              <i class="fas fa-trash"></i> Delete Property
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
  
  setTimeout(() => document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible')), 100);
}

window.approveProperty = async function(propertyId) {
  try {
    await updateDoc(doc(db, 'properties', propertyId), {
      status: 'Active',
      approvedAt: serverTimestamp(),
      approvedBy: currentUser.uid
    });
    showToast('Property approved successfully', 'success');
  } catch (error) {
    console.error('Error:', error);
    showToast('Failed to approve property', 'error');
  }
};

window.suspendProperty = async function(propertyId) {
  if (!confirm('Are you sure you want to suspend this property?')) return;
  
  try {
    await updateDoc(doc(db, 'properties', propertyId), {
      status: 'suspended',
      suspendedAt: serverTimestamp(),
      suspendedBy: currentUser.uid
    });
    showToast('Property suspended successfully', 'success');
  } catch (error) {
    console.error('Error:', error);
    showToast('Failed to suspend property', 'error');
  }
};

window.deleteProperty = async function(propertyId) {
  if (!confirm('Are you sure you want to delete this property? This action cannot be undone.')) return;
  
  try {
    await deleteDoc(doc(db, 'properties', propertyId));
    showToast('Property deleted successfully', 'success');
    setTimeout(() => window.location.href = 'index.html#properties', 800);
  } catch (error) {
    console.error('Error:', error);
    showToast('Failed to delete property', 'error');
  }
};

window.handleLogout = async function() {
  await signOut(auth);
  window.location.href = '../sign-in.html';
};

function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icons = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle'
  };
  
  toast.innerHTML = `
    <i class="fas ${icons[type]} text-xl"></i>
    <div class="flex-1">
      <p class="font-semibold text-sm">${type.charAt(0).toUpperCase() + type.slice(1)}</p>
      <p class="text-sm opacity-80 mt-0.5">${message}</p>
    </div>
    <button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100">
      <i class="fas fa-times"></i>
    </button>
  `;
  
  container.appendChild(toast);
  
  if (duration > 0) {
    setTimeout(() => {
      toast.classList.add('hiding');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }
}
</script>

</body>
</html>
