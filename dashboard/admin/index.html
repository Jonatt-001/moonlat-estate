<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonLat — Admin Control Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

  * { font-family: 'Inter', sans-serif; }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
  
  body {
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }
  
  .stars {
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 50px 160px, #fff, transparent),
      radial-gradient(2px 2px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(1px 1px at 160px 120px, #fff, transparent),
      radial-gradient(2px 2px at 200px 50px, #fff, transparent);
    background-size: 200px 200px;
    opacity: 0.6;
    z-index: 0;
    animation: twinkle 8s infinite;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
  
  .nav-glass {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  
  .sidebar-glass {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  
  .card-glass {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    transition: all 0.3s;
  }
  
  .card-glass:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-4px);
  }
  
  .stat-card {
    position: relative;
    overflow: hidden;
  }
  
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FACC15, transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .stat-card:hover::before {
    opacity: 1;
  }
  
  .btn-primary {
    background: #fff;
    color: #000;
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 500;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  
  .btn-primary:hover {
    background: transparent;
    color: #fff;
    box-shadow: inset 0 0 0 1px #fff;
  }
  
  .btn-ghost {
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 500;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(10px);
  }
  
  .btn-ghost:hover {
    background: rgba(255,255,255,0.1);
    border-color: #fff;
  }
  
  .btn-danger {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 500;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  
  .btn-danger:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: #ef4444;
  }
  
  .fade-in {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1s ease, transform 1s ease;
  }
  
  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }
  
  .stat-num {
    font-variant-numeric: tabular-nums;
  }
  
  .divider-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }
  
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    pointer-events: none;
  }
  
  .scroll-smooth { scroll-behavior: smooth; }
  
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  
  .float-anim { animation: float 6s ease-in-out infinite; }
  
  .marquee {
    display: flex;
    gap: 4rem;
    animation: scroll 30s linear infinite;
  }
  
  @keyframes scroll {
    to { transform: translateX(-50%); }
  }
  
  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    color: rgba(255,255,255,0.6);
    transition: all 0.3s;
    cursor: pointer;
  }
  
  .sidebar-link:hover {
    background: rgba(255,255,255,0.05);
    color: #fff;
  }
  
  .sidebar-link.active {
    background: rgba(250, 204, 21, 0.1);
    color: #FACC15;
    border: 1px solid rgba(250, 204, 21, 0.2);
  }
  
  .badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  
  .badge-active {
    background: rgba(34, 197, 94, 0.1);
    color: #22c55e;
    border: 1px solid rgba(34, 197, 94, 0.2);
  }
  
  .badge-pending {
    background: rgba(245, 158, 11, 0.1);
    color: #f59e0b;
    border: 1px solid rgba(245, 158, 11, 0.2);
  }
  
  .badge-suspended {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }
  
  .badge-verified {
    background: rgba(59, 130, 246, 0.1);
    color: #3b82f6;
    border: 1px solid rgba(59, 130, 246, 0.2);
  }
  
  .input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #fff;
    transition: all 0.3s;
  }
  
  .input:focus {
    outline: none;
    border-color: #FACC15;
    background: rgba(255,255,255,0.08);
  }
  
  .input::placeholder {
    color: rgba(255,255,255,0.4);
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
  }
  
  th {
    text-align: left;
    padding: 16px 24px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  
  td {
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  
  tr:hover {
    background: rgba(255,255,255,0.02);
  }
  
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #000;
    background: linear-gradient(135deg, #FACC15, #A16207);
  }
  
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #FACC15;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .toast {
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    animation: slideIn 0.4s;
    min-width: 320px;
  }
  
  .toast.success { border-left: 4px solid #22c55e; }
  .toast.error { border-left: 4px solid #ef4444; }
  .toast.warning { border-left: 4px solid #f59e0b; }
  .toast.info { border-left: 4px solid #3b82f6; }
  
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  
  .toast.hiding {
    animation: slideOut 0.3s forwards;
  }
  
  @keyframes slideOut {
    to { transform: translateX(100%); opacity: 0; }
  }
  
  .toggle {
    position: relative;
    width: 48px;
    height: 24px;
  }
  
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    transition: 0.3s;
  }
  
  .toggle-slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    transition: 0.3s;
  }
  
  input:checked + .toggle-slider {
    background: rgba(250, 204, 21, 0.2);
    border-color: #FACC15;
  }
  
  input:checked + .toggle-slider:before {
    transform: translateX(24px);
    background: #FACC15;
  }
  
  @media (max-width: 1024px) {
    .sidebar {
      transform: translateX(-100%);
      transition: transform 0.3s;
    }
    
    .sidebar.open {
      transform: translateX(0);
    }
    
    main {
      margin-left: 0 !important;
    }
  }

/* Touch Device Optimizations */
@media (hover: none) and (pointer: coarse) {
  /* Larger touch targets */
  .btn-primary,
  .btn-ghost,
  .btn-danger {
    min-height: 44px !important;
  }
  
  .sidebar-link {
    min-height: 44px !important;
  }
  
  /* Remove hover effects on touch devices */
  .card-glass:hover {
    transform: none !important;
  }
  
  .btn-primary:hover,
  .btn-ghost:hover {
    transform: none !important;
  }
  
  /* Active states for touch feedback */
  .btn-primary:active,
  .btn-ghost:active,
  .sidebar-link:active {
    transform: scale(0.98) !important;
    opacity: 0.8 !important;
  }
}

/* High DPI Displays */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
  .stars {
    background-size: 150px 150px !important;
  }
  
  .glow-orb {
    filter: blur(60px) !important;
  }
}

/* Safe Area Insets (Notch devices) */
@supports (padding: max(0px)) {
  .sidebar {
    padding-left: max(0px, env(safe-area-inset-left)) !important;
    padding-bottom: max(0px, env(safe-area-inset-bottom)) !important;
  }
  
  main {
    padding-right: max(0px, env(safe-area-inset-right)) !important;
  }
  
  header {
    padding-top: max(0.75rem, env(safe-area-inset-top)) !important;
  }
  
  #toastContainer {
    bottom: max(1.5rem, env(safe-area-inset-bottom)) !important;
    right: max(1.5rem, env(safe-area-inset-right)) !important;
  }
}

/* Print Styles */
@media print {
  .sidebar,
  header,
  .glow-orb,
  .stars,
  .toast {
    display: none !important;
  }
  
  main {
    margin-left: 0 !important;

    border: 1px solid #000 !important;
    background: #fff !important;
    color: #000 !important;
  }
  
  * {
    color: #000 !important;
    background: #fff !important;
  }
}

/* Reduced Motion Preference */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  
  .fade-in {
    opacity: 1 !important;
    transform: none !important;
  }
  
  .stars {
    animation: none !important;
  }
}

  /* Keep dark theme as default for SpaceX aesthetic */

// =================== ERROR HANDLING ===================
const ErrorHandler = {
  handle(error, action = 'perform this action') {
    console.error(`[MoonLat Admin]`, error);

      'permission-denied': 'You do not have permission to perform this action',
      'unauthorized': 'Authentication required. Please sign in again',
      'not-found': 'The requested resource was not found',
      'network-error': 'Network error. Please check your connection',

      'auth/invalid-email': 'Invalid email address format',
      'auth/email-already-in-use': 'This email is already in use by another account',
      'auth/weak-password': 'Password should be at least 6 characters',
      'auth/invalid-credential': 'Invalid credentials'
    };
    const errorCode = error.code || '';
    showToast(messages[errorCode] || `Failed to ${action}: ${error.message || 'Unknown error'}`, 'error');
  }
};

// =================== TOAST SYSTEM ===================
function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icons = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle'
  };
  
  toast.innerHTML = `
    <i class="fas ${icons[type]} text-xl"></i>
    <div class="flex-1">
      <p class="font-semibold text-sm">${type.charAt(0).toUpperCase() + type.slice(1)}</p>
      <p class="text-sm opacity-80 mt-0.5">${message}</p>
    </div>
    <button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100">
      <i class="fas fa-times"></i>
    </button>
  `;
  
  container.appendChild(toast);
  
  if (duration > 0) {
    setTimeout(() => {
      toast.classList.add('hiding');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }
}

// =================== AUTH CHECK ===================
onAuthStateChanged(auth, async (user) => {
  try {
    if (!user) {
      window.location.href = '../sign-in.html';
      return;
    }

if (userData.role !== 'admin') {

}

  }
});

// =================== DATA SUBSCRIPTION ===================
let activityCount = 0;
let lastActivityTime = Date.now();

function subscribeToData() {
  onSnapshot(collection(db, 'users'), (snap) => {
    const prevCount = allUsers.length;
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allAgents = allUsers.filter(u => u.role === 'agent');
    
    if (prevCount > 0 && allUsers.length > prevCount) {
      const newCount = allUsers.length - prevCount;
      triggerBellRing(newCount, 'user');
    }
    
    renderPage();
  });
  
  onSnapshot(collection(db, 'properties'), (snap) => {
    const prevCount = allProperties.length;
    allProperties = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    if (prevCount > 0 && allProperties.length > prevCount) {
      const newCount = allProperties.length - prevCount;
      triggerBellRing(newCount, 'property');
    }
    
    renderPage();
  });
  
  onSnapshot(collection(db, 'transactions'), (snap) => {
    const prevCount = allTransactions.length;
    allTransactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    if (prevCount > 0 && allTransactions.length > prevCount) {
      const newCount = allTransactions.length - prevCount;
      triggerBellRing(newCount, 'transaction');
    }
    
    renderPage();
  });
}

// =================== BELL NOTIFICATION ===================
function triggerBellRing(count = 1, type = 'activity') {
  const bell = document.getElementById('activityBell');
  const badge = document.getElementById('bellBadge');
  
  if (!bell || !badge) return;
  
  activityCount += count;
  badge.textContent = activityCount > 99 ? '99+' : activityCount;
  badge.classList.remove('hidden');
  badge.classList.add('bell-pulse');
  
  bell.classList.remove('bell-ring');
  void bell.offsetWidth;
  bell.classList.add('bell-ring');
  
  setTimeout(() => {
    badge.classList.remove('bell-pulse');
  }, 6000);
  
  const messages = {
    user: `${count} new user${count > 1 ? 's' : ''} registered`,
    property: `${count} new propert${count > 1 ? 'ies' : 'y'} listed`,
    transaction: `${count} new transaction${count > 1 ? 's' : ''}`,
    activity: `${count} new activit${count > 1 ? 'ies' : 'y'}`
  };
  
  showToast(messages[type] || messages.activity, 'info', 3000);
}

  activityCount = 0;

}

// =================== NAVIGATION ===================
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  renderPage();
  
  if (window.innerWidth < 1024) {
    closeSidebar();
  }
}

window.navigate = navigate;

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
  
  if (sidebar.classList.contains('open')) {
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
  }
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

window.toggleSidebar = toggleSidebar;
window.closeSidebar = closeSidebar;

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSidebar();
  }
});

function calculateUserGrowth() {
  const now = new Date();
  const months = [];
  const counts = [];
  
  for (let i = 5; i >= 0; i--) {
    const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(date.toLocaleDateString('en', { month: 'short' }));
    
    const usersThisMonth = allUsers.filter(u => {
      const userDate = u.createdAt?.toDate ? u.createdAt.toDate() : new Date(u.createdAt || Date.now());
      return userDate <= date;
    }).length;
    
    counts.push(usersThisMonth);
  }
  
  return { labels: months, data: counts };
}

// =================== CREDENTIAL CHANGE FUNCTIONS ===================

// Helper: Reauthenticate user with current password
async function reauthenticateUser(currentPassword) {
  const user = auth.currentUser;
  if (!user || !user.email) {
    throw new Error('No authenticated user found');
  }
  
  const credential = EmailAuthProvider.credential(user.email, currentPassword);
  await reauthenticateWithCredential(user, credential);
  return user;
}

window.changeEmail = async function() {
  const currentPassword = document.getElementById('emailCurrentPassword').value;
  const newEmail = document.getElementById('newEmail').value.trim();
  const btn = document.getElementById('changeEmailBtn');
  
  // Validation
  if (!currentPassword) {
    showToast('Please enter your current password', 'error');
    return;
  }
  
  if (!newEmail) {
    showToast('Please enter a new email address', 'error');
    return;
  }
  
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(newEmail)) {
    showToast('Please enter a valid email address', 'error');
    return;
  }
  
  if (newEmail === currentUser.authEmail) {
    showToast('New email is the same as current email', 'warning');
    return;
  }
  
  // Confirmation
  if (!confirm(`Are you sure you want to change your email to ${newEmail}?\n\nYou will be signed out and must use the new email to log in.`)) {
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Updating...';
  
  try {
    // Step 1: Reauthenticate with current password
    const user = await reauthenticateUser(currentPassword);
    
    // Step 2: Update email in Firebase Auth
    await updateEmail(user, newEmail);
    
    // Step 3: Update email in Firestore
    await updateDoc(doc(db, 'users', user.uid), {
      email: newEmail,
      emailChangedAt: serverTimestamp(),
      emailChangedBy: user.uid,
      updatedAt: serverTimestamp()
    });
    
    showToast('Email updated successfully! Signing out...', 'success', 3000);
    
    // Step 4: Sign out and redirect to sign-in
    setTimeout(async () => {
      await signOut(auth);
      window.location.href = '../sign-in.html';
    }, 2000);
    
  } catch (error) {
    ErrorHandler.handle(error, 'update email');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-envelope"></i> Update Email';
  }
};

window.changePassword = async function() {
  const currentPassword = document.getElementById('passwordCurrentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;
  const btn = document.getElementById('changePasswordBtn');
  
  // Validation
  if (!currentPassword) {
    showToast('Please enter your current password', 'error');
    return;
  }
  
  if (!newPassword) {
    showToast('Please enter a new password', 'error');
    return;
  }
  
  if (newPassword.length < 6) {
    showToast('New password must be at least 6 characters', 'error');
    return;
  }
  
  if (newPassword !== confirmNewPassword) {
    showToast('New passwords do not match', 'error');
    return;
  }
  
  if (newPassword === currentPassword) {
    showToast('New password must be different from current password', 'warning');
    return;
  }
  
  // Confirmation
  if (!confirm('Are you sure you want to change your password?\n\nYou will be signed out and must use the new password to log in.')) {
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Updating...';
  
  try {
    // Step 1: Reauthenticate with current password
    const user = await reauthenticateUser(currentPassword);
    
    // Step 2: Update password in Firebase Auth
    await updatePassword(user, newPassword);
    
    // Step 3: Update Firestore record
    await updateDoc(doc(db, 'users', user.uid), {
      passwordChangedAt: serverTimestamp(),
      passwordChangedBy: user.uid,
      updatedAt: serverTimestamp()
    });
    
    showToast('Password updated successfully! Signing out...', 'success', 3000);
    
    // Step 4: Sign out and redirect to sign-in
    setTimeout(async () => {
      await signOut(auth);
      window.location.href = '../sign-in.html';
    }, 2000);
    
  } catch (error) {
    ErrorHandler.handle(error, 'update password');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> Update Password';
  }
};
