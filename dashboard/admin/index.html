<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updateEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxtSNaTqeTvUKD_tahO5LuR238AqZfpqg",
  authDomain: "moonlat-estate-dashboard.firebaseapp.com",
  projectId: "moonlat-estate-dashboard",
  storageBucket: "moonlat-estate-dashboard.firebasestorage.app",
  messagingSenderId: "289878951289",
  appId: "1:289878951289:web:18db63e3ab8f071b811ba8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let allUsers = [];
let allAgents = [];
let allProperties = [];
let allTransactions = [];
let currentPage = 'dashboard';

// =================== ERROR HANDLING ===================
const ErrorHandler = {
  handle(error, action = 'perform this action') {
    console.error(`[MoonLat Admin]`, error);
    const messages = {
      'permission-denied': 'You do not have permission to perform this action',
      'unauthorized': 'Authentication required. Please sign in again',
      'not-found': 'The requested resource was not found',
      'network-error': 'Network error. Please check your connection',
      'auth/requires-recent-login': 'Please sign in again to change credentials',
      'auth/wrong-password': 'Current password is incorrect',
      'auth/invalid-email': 'Invalid email address format',
      'auth/email-already-in-use': 'This email is already in use by another account',
      'auth/weak-password': 'Password should be at least 6 characters',
      'auth/invalid-credential': 'Invalid credentials'
    };
    const errorCode = error.code || '';
    showToast(messages[errorCode] || `Failed to ${action}: ${error.message || 'Unknown error'}`, 'error');
  }
};

// =================== TOAST SYSTEM ===================
function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icons = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle'
  };
  
  toast.innerHTML = `
    <i class="fas ${icons[type]} text-xl"></i>
    <div class="flex-1">
      <p class="font-semibold text-sm">${type.charAt(0).toUpperCase() + type.slice(1)}</p>
      <p class="text-sm opacity-80 mt-0.5">${message}</p>
    </div>
    <button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100">
      <i class="fas fa-times"></i>
    </button>
  `;
  
  container.appendChild(toast);
  
  if (duration > 0) {
    setTimeout(() => {
      toast.classList.add('hiding');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }
}

// =================== AUTH CHECK ===================
onAuthStateChanged(auth, async (user) => {
  try {
    if (!user) {
      window.location.href = '../sign-in.html';
      return;
    }
    
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    
    if (!userDoc.exists()) {
      throw new Error('User profile not found');
    }
    
    const userData = userDoc.data();
    
    if (userData.role !== 'admin') {
      await signOut(auth);
      showToast('Access denied. Admin privileges required.', 'error');
      window.location.href = 'dashboard.html';
      return;
    }
    
    currentUser = { uid: user.uid, ...userData, authEmail: user.email };
    
    document.getElementById('adminName').textContent = userData.name || 'Admin';
    document.getElementById('adminAvatar').textContent = (userData.name || 'A')[0].toUpperCase();
    
    document.getElementById('authGuard').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    
    subscribeToData();
    renderPage();
    
    showToast('Welcome back, ' + (userData.name || 'Admin'), 'success', 2000);
    
  } catch (error) {
    ErrorHandler.handle(error, 'initialize admin panel');
    await signOut(auth);
    window.location.href = '../sign-in.html';
  }
});

// =================== DATA SUBSCRIPTION ===================
let activityCount = 0;
let lastActivityTime = Date.now();

function subscribeToData() {
  onSnapshot(collection(db, 'users'), (snap) => {
    const prevCount = allUsers.length;
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allAgents = allUsers.filter(u => u.role === 'agent');
    
    if (prevCount > 0 && allUsers.length > prevCount) {
      const newCount = allUsers.length - prevCount;
      triggerBellRing(newCount, 'user');
    }
    
    renderPage();
  });
  
  onSnapshot(collection(db, 'properties'), (snap) => {
    const prevCount = allProperties.length;
    allProperties = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    if (prevCount > 0 && allProperties.length > prevCount) {
      const newCount = allProperties.length - prevCount;
      triggerBellRing(newCount, 'property');
    }
    
    renderPage();
  });
  
  onSnapshot(collection(db, 'transactions'), (snap) => {
    const prevCount = allTransactions.length;
    allTransactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    if (prevCount > 0 && allTransactions.length > prevCount) {
      const newCount = allTransactions.length - prevCount;
      triggerBellRing(newCount, 'transaction');
    }
    
    renderPage();
  });
}

// =================== BELL NOTIFICATION ===================
function triggerBellRing(count = 1, type = 'activity') {
  const bell = document.getElementById('activityBell');
  const badge = document.getElementById('bellBadge');
  
  if (!bell || !badge) return;
  
  activityCount += count;
  badge.textContent = activityCount > 99 ? '99+' : activityCount;
  badge.classList.remove('hidden');
  badge.classList.add('bell-pulse');
  
  bell.classList.remove('bell-ring');
  void bell.offsetWidth;
  bell.classList.add('bell-ring');
  
  setTimeout(() => {
    badge.classList.remove('bell-pulse');
  }, 6000);
  
  const messages = {
    user: `${count} new user${count > 1 ? 's' : ''} registered`,
    property: `${count} new propert${count > 1 ? 'ies' : 'y'} listed`,
    transaction: `${count} new transaction${count > 1 ? 's' : ''}`,
    activity: `${count} new activit${count > 1 ? 'ies' : 'y'}`
  };
  
  showToast(messages[type] || messages.activity, 'info', 3000);
}

window.addEventListener('pageshow', (event) => {
  if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
    resetBell();
  }
});

function resetBell() {
  activityCount = 0;
  const badge = document.getElementById('bellBadge');
  if (badge) {
    badge.classList.add('hidden');
    badge.classList.remove('bell-pulse');
  }
}

// =================== NAVIGATION ===================
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  renderPage();
  
  if (window.innerWidth < 1024) {
    closeSidebar();
  }
}

window.navigate = navigate;

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
  
  if (sidebar.classList.contains('open')) {
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
  }
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

window.toggleSidebar = toggleSidebar;
window.closeSidebar = closeSidebar;

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSidebar();
  }
});

// =================== RENDER PAGES ===================
function renderPage() {
  const content = document.getElementById('pageContent');
  
  switch(currentPage) {
    case 'dashboard': renderDashboard(content); break;
    case 'users': renderUsers(content); break;
    case 'agents': renderAgents(content); break;
    case 'properties': renderProperties(content); break;
    case 'transactions': renderTransactions(content); break;
    case 'analytics': renderAnalytics(content); break;
    case 'reports': renderReports(content); break;
    case 'settings': renderSettings(content); break;
    default: renderDashboard(content);
  }
}

        <p class="display text-5xl font-bold stat-num" data-count="${totalUsers}">0</p>
        <p class="text-sm opacity-70 mt-2">Total Users</p>

        <p class="display text-5xl font-bold stat-num" data-count="${totalProperties}">0</p>

      <div class="card-glass stat-card p-6 fade-in">

function calculateUserGrowth() {
  const now = new Date();
  const months = [];
  const counts = [];
  
  for (let i = 5; i >= 0; i--) {
    const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(date.toLocaleDateString('en', { month: 'short' }));
    
    const usersThisMonth = allUsers.filter(u => {
      const userDate = u.createdAt?.toDate ? u.createdAt.toDate() : new Date(u.createdAt || Date.now());
      return userDate <= date;
    }).length;
    
    counts.push(usersThisMonth);
  }
  
  return { labels: months, data: counts };
}

// =================== CREDENTIAL CHANGE FUNCTIONS ===================

// Helper: Reauthenticate user with current password
async function reauthenticateUser(currentPassword) {
  const user = auth.currentUser;
  if (!user || !user.email) {
    throw new Error('No authenticated user found');
  }
  
  const credential = EmailAuthProvider.credential(user.email, currentPassword);
  await reauthenticateWithCredential(user, credential);
  return user;
}

window.changeEmail = async function() {
  const currentPassword = document.getElementById('emailCurrentPassword').value;
  const newEmail = document.getElementById('newEmail').value.trim();
  const btn = document.getElementById('changeEmailBtn');
  
  // Validation
  if (!currentPassword) {
    showToast('Please enter your current password', 'error');
    return;
  }
  
  if (!newEmail) {
    showToast('Please enter a new email address', 'error');
    return;
  }
  
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(newEmail)) {
    showToast('Please enter a valid email address', 'error');
    return;
  }
  
  if (newEmail === currentUser.authEmail) {
    showToast('New email is the same as current email', 'warning');
    return;
  }
  
  // Confirmation
  if (!confirm(`Are you sure you want to change your email to ${newEmail}?\n\nYou will be signed out and must use the new email to log in.`)) {
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Updating...';
  
  try {
    // Step 1: Reauthenticate with current password
    const user = await reauthenticateUser(currentPassword);
    
    // Step 2: Update email in Firebase Auth
    await updateEmail(user, newEmail);
    
    // Step 3: Update email in Firestore
    await updateDoc(doc(db, 'users', user.uid), {
      email: newEmail,
      emailChangedAt: serverTimestamp(),
      emailChangedBy: user.uid,
      updatedAt: serverTimestamp()
    });
    
    showToast('Email updated successfully! Signing out...', 'success', 3000);
    
    // Step 4: Sign out and redirect to sign-in
    setTimeout(async () => {
      await signOut(auth);
      window.location.href = '../sign-in.html';
    }, 2000);
    
  } catch (error) {
    ErrorHandler.handle(error, 'update email');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-envelope"></i> Update Email';
  }
};

window.changePassword = async function() {
  const currentPassword = document.getElementById('passwordCurrentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;
  const btn = document.getElementById('changePasswordBtn');
  
  // Validation
  if (!currentPassword) {
    showToast('Please enter your current password', 'error');
    return;
  }
  
  if (!newPassword) {
    showToast('Please enter a new password', 'error');
    return;
  }
  
  if (newPassword.length < 6) {
    showToast('New password must be at least 6 characters', 'error');
    return;
  }
  
  if (newPassword !== confirmNewPassword) {
    showToast('New passwords do not match', 'error');
    return;
  }
  
  if (newPassword === currentPassword) {
    showToast('New password must be different from current password', 'warning');
    return;
  }
  
  // Confirmation
  if (!confirm('Are you sure you want to change your password?\n\nYou will be signed out and must use the new password to log in.')) {
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Updating...';
  
  try {
    // Step 1: Reauthenticate with current password
    const user = await reauthenticateUser(currentPassword);
    
    // Step 2: Update password in Firebase Auth
    await updatePassword(user, newPassword);
    
    // Step 3: Update Firestore record
    await updateDoc(doc(db, 'users', user.uid), {
      passwordChangedAt: serverTimestamp(),
      passwordChangedBy: user.uid,
      updatedAt: serverTimestamp()
    });
    
    showToast('Password updated successfully! Signing out...', 'success', 3000);
    
    // Step 4: Sign out and redirect to sign-in
    setTimeout(async () => {
      await signOut(auth);
      window.location.href = '../sign-in.html';
    }, 2000);
    
  } catch (error) {
    ErrorHandler.handle(error, 'update password');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> Update Password';
  }
};
